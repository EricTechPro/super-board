  arrow markers) and viewer UX (camera zoom/pan with reading depths, minimap, node focus panel,
  node finder, export) adapted from tt-a1i/archify (MIT, (c) 2026 tt-a1i, (c) 2025 Cocoon AI).
  See ../THIRD_PARTY_NOTICES.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>super-board skill map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<script>
  try { const t = localStorage.getItem('visual-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  :root {
    --bg: #020617; --bg-2: #0b1222; --panel: #0f172a; --panel-2: #111c33; --border: #1e293b; --border-2: #334155;
    --text: #f8fafc; --muted: #94a3b8; --dim: #64748b; --grid: rgba(148,163,184,.07); --mask: #0f172a;
    --arrow: #64748b; --shadow: 0 18px 48px rgba(0,0,0,.30);
    --dot: rgba(148,163,184,.16); --gridline: rgba(148,163,184,.045); --chrome: rgba(15,23,42,.82);
    --cyan: #22d3ee; --green: #34d399; --violet: #a78bfa; --amber: #fbbf24; --rose: #fb7185; --orange: #fb923c; --slate: #94a3b8; --fuchsia: #e879f9;
    --cyan-f: rgba(8,51,68,.45); --green-f: rgba(6,78,59,.45); --violet-f: rgba(76,29,149,.42); --amber-f: rgba(120,53,15,.38);
    --rose-f: rgba(136,19,55,.42); --orange-f: rgba(154,52,18,.35); --slate-f: rgba(30,41,59,.6); --fuchsia-f: rgba(112,26,117,.38);
    --add-bg: rgba(52,211,153,.10); --add-tx: #6ee7b7; --del-bg: rgba(251,113,133,.10); --del-tx: #fda4af;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f5f7; --bg-2: #eef0f4; --panel: #ffffff; --panel-2: #f8fafc; --border: #e5e7eb; --border-2: #cbd5e1;
      --text: #0f172a; --muted: #5b6474; --dim: #8a93a3; --grid: rgba(15,23,42,.05); --mask: #ffffff; --arrow: #94a3b8; --shadow: 0 12px 32px rgba(15,23,42,.08);
      --dot: #d5dbe3; --gridline: rgba(15,23,42,.035); --chrome: rgba(255,255,255,.9);
      --cyan: #0e7490; --green: #047857; --violet: #6d28d9; --amber: #b45309; --rose: #be123c; --orange: #c2410c; --slate: #475569; --fuchsia: #a21caf;
      --cyan-f: rgba(34,211,238,.13); --green-f: rgba(52,211,153,.16); --violet-f: rgba(167,139,250,.18); --amber-f: rgba(251,191,36,.18);
      --rose-f: rgba(251,113,133,.14); --orange-f: rgba(251,146,60,.15); --slate-f: rgba(148,163,184,.16); --fuchsia-f: rgba(232,121,249,.14);
      --add-bg: rgba(16,185,129,.10); --add-tx: #047857; --del-bg: rgba(225,29,72,.08); --del-tx: #be123c;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f4f5f7; --bg-2: #eef0f4; --panel: #ffffff; --panel-2: #f8fafc; --border: #e5e7eb; --border-2: #cbd5e1;
    --text: #0f172a; --muted: #5b6474; --dim: #8a93a3; --grid: rgba(15,23,42,.05); --mask: #ffffff; --arrow: #94a3b8; --shadow: 0 12px 32px rgba(15,23,42,.08);
      --dot: #d5dbe3; --gridline: rgba(15,23,42,.035); --chrome: rgba(255,255,255,.9);
    --cyan: #0e7490; --green: #047857; --violet: #6d28d9; --amber: #b45309; --rose: #be123c; --orange: #c2410c; --slate: #475569; --fuchsia: #a21caf;
    --cyan-f: rgba(34,211,238,.13); --green-f: rgba(52,211,153,.16); --violet-f: rgba(167,139,250,.18); --amber-f: rgba(251,191,36,.18);
    --rose-f: rgba(251,113,133,.14); --orange-f: rgba(251,146,60,.15); --slate-f: rgba(148,163,184,.16); --fuchsia-f: rgba(232,121,249,.14);
    --add-bg: rgba(16,185,129,.10); --add-tx: #047857; --del-bg: rgba(225,29,72,.08); --del-tx: #be123c;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 22px 22px; }
  a { color: var(--cyan); }
  code, .mono { font-family: var(--mono); font-size: .86em; }
  :not(pre) > code { overflow-wrap: anywhere; background: var(--panel-2); border: 1px solid var(--border); padding: .05em .35em; border-radius: 5px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 720px) { .wrap { padding: 0 32px; } }

  /* top bar */
  .bar { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(10px); background: color-mix(in srgb, var(--bg) 82%, transparent); border-bottom: 1px solid var(--border); }
  .bar .wrap { display: flex; align-items: center; gap: 14px; height: 50px; }
  .bar .brand { font: 700 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .bar nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  .bar nav a { color: var(--muted); text-decoration: none; font: 500 13px var(--sans); padding: 5px 10px; border-radius: 7px; white-space: nowrap; }
  .bar nav a:hover { color: var(--text); background: var(--panel); }
  .btn { background: var(--panel); border: 1px solid var(--border-2); color: var(--text); border-radius: 8px; height: 32px; padding: 0 12px; font: 500 13px var(--sans); cursor: pointer; }
  .btn:hover { border-color: var(--cyan); }
  .btn:focus-visible, button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  /* hero */
  header.hero { padding: 40px 0 8px; }
  .eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font: 600 12px var(--mono); color: var(--muted); }
  .kind { text-transform: uppercase; letter-spacing: .12em; font-weight: 700; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .kind.recap { color: var(--green); border-color: var(--green); background: var(--green-f); }
  .kind.plan { color: var(--cyan); border-color: var(--cyan); background: var(--cyan-f); }
  .kind.explore { color: var(--violet); border-color: var(--violet); background: var(--violet-f); }
  h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.15; letter-spacing: -.025em; margin: 14px 0 8px; font-weight: 700; }
  .sub { color: var(--muted); font-size: 16px; margin: 0 0 18px; max-width: 820px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat { display: flex; align-items: baseline; gap: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 7px 12px; }
  .stat b { font: 700 17px var(--mono); }
  .stat span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .stat.add b { color: var(--green); } .stat.del b { color: var(--rose); }

  section { padding: 26px 0 8px; scroll-margin-top: 60px; }
  h2 { font: 700 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  h2 .count { color: var(--dim); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; }
  .prose p { margin: 0 0 12px; max-width: 860px; } .prose p:last-child { margin-bottom: 0; }
  .prose ul { margin: 0 0 12px; padding-left: 20px; }
  .summary { padding: 20px 22px; font-size: 16px; }

  /* key changes + files */
  .split { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 980px) { .split { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } .split > aside { position: sticky; top: 64px; } }
  .changes { display: grid; gap: 10px; }
  .change { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 16px 18px; }
  .change .num { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font: 700 13px var(--mono); background: var(--panel-2); border: 1px solid var(--border-2); color: var(--muted); }
  .change h3 { margin: 2px 0 4px; font-size: 16px; line-height: 1.35; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .change .detail { color: var(--muted); font-size: 14.5px; }
  .tag { font: 700 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; }
  .t-added, .t-new, .t-add { color: var(--green); } .t-changed, .t-modified, .t-change { color: var(--cyan); } .t-removed, .t-delete { color: var(--rose); }
  .t-fix { color: var(--amber); } .t-refactor { color: var(--violet); } .t-docs, .t-chore { color: var(--slate); } .t-risk { color: var(--orange); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font: 500 12px var(--mono); color: var(--muted); background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .chip:hover { color: var(--text); border-color: var(--cyan); }

  .files { padding: 6px 0; overflow: hidden; }
  .files .head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 8px; font: 600 12px var(--mono); color: var(--muted); }
  .area { border-top: 1px solid var(--border); }
  .area > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 9px 16px; font: 600 12.5px var(--mono); color: var(--text); }
  .area > summary::-webkit-details-marker { display: none; }
  .area > summary::before { content: "▸"; color: var(--dim); transition: transform .15s; }
  .area[open] > summary::before { transform: rotate(90deg); }
  .area > summary .n { margin-left: auto; font-weight: 500; }
  .frow { display: grid; grid-template-columns: 20px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 5px 16px 5px 30px; font: 12.5px var(--mono); cursor: default; }
  .frow.link { cursor: pointer; } .frow.link:hover, .frow.hl { background: var(--panel-2); }
  .frow .st { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font-size: 10px; font-weight: 700; border: 1px solid currentColor; }
  .st.A { color: var(--green); } .st.M { color: var(--amber); } .st.D { color: var(--rose); } .st.R { color: var(--violet); }
  .frow .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .frow .p bdi { direction: ltr; } .frow .p .dir { color: var(--dim); }
  .frow .ad { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .plus { color: var(--green); } .minus { color: var(--rose); }
  .blocks { display: inline-flex; gap: 2px; } .blocks i { width: 7px; height: 7px; border-radius: 2px; background: var(--border-2); }
  .blocks i.g { background: var(--green); } .blocks i.r { background: var(--rose); }
  .fnote { grid-column: 2 / 4; color: var(--muted); font: 12.5px/1.45 var(--sans); margin-top: -2px; }

  /* diagrams */
  figure.dia { margin: 0 0 18px; padding: 18px 18px 14px; overflow: hidden; }
  @media (min-width: 1300px) { #diagram { position: relative; left: 50%; transform: translateX(-50%); width: min(1640px, calc(100vw - 64px)); } }
  figure.dia figcaption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 18px; margin-bottom: 10px; }
  figure.dia .ft { font-weight: 600; font-size: 16px; }
  figure.dia .fc { color: var(--muted); font-size: 14px; margin-top: 10px; }
  .canvas { position: relative; overflow: hidden; border-radius: 10px; border: 1px solid var(--border); background-color: var(--bg-2); touch-action: none; cursor: grab; outline: none;
    background-image: radial-gradient(circle, var(--dot) 1.1px, transparent 1.4px), linear-gradient(var(--gridline) 1px, transparent 1px), linear-gradient(90deg, var(--gridline) 1px, transparent 1px); }
  .canvas:focus-visible { box-shadow: 0 0 0 2px var(--cyan); }
  .canvas.grabbing, .stage.grabbing { cursor: grabbing; }
  .canvas svg { display: block; position: absolute; inset: 0; }
  .canvas.full { position: fixed; inset: 12px; z-index: 60; border-radius: 14px; box-shadow: var(--shadow); height: auto !important; }
  body.noscroll { overflow: hidden; }
  .cam-hint { position: absolute; left: 10px; bottom: 8px; font: 500 11px var(--mono); color: var(--dim); pointer-events: none; opacity: 0; transition: opacity .2s; }
  .canvas:hover .cam-hint { opacity: 1; }
  .ctl { position: absolute; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 11px; background: var(--chrome); border: 1px solid var(--border-2); box-shadow: var(--shadow); backdrop-filter: blur(10px); z-index: 4; }
  .ctl button { min-width: 30px; height: 28px; border: 0; background: none; color: var(--text); font: 600 13px var(--mono); border-radius: 8px; cursor: pointer; padding: 0 7px; }
  .ctl button:hover:not(:disabled) { background: var(--panel-2); color: var(--cyan); }
  .ctl button:disabled { opacity: .35; cursor: default; }
  .ctl .pct { min-width: 54px; font-weight: 500; color: var(--muted); }
  .ctl .sep { width: 1px; height: 18px; background: var(--border-2); margin: 0 3px; }
  .ctl .depth { font: 700 10px var(--mono); letter-spacing: .12em; color: var(--dim); padding: 0 8px; }
  .mini-ctl { opacity: .0; transition: opacity .2s; } .canvas:hover .mini-ctl, .canvas:focus-within .mini-ctl, .canvas.full .mini-ctl { opacity: 1; }
  @media (hover: none) { .mini-ctl { opacity: 1; } }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 600 11px var(--mono); color: var(--muted); align-items: center; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; border: 1.5px solid; margin-right: 6px; vertical-align: -1px; }
  svg .n-mask { fill: var(--mask); }
  svg .n-body { stroke-width: 1.5; transition: stroke-width .15s, filter .15s; }
  svg .n-label { fill: var(--text); font: 600 13px var(--mono); letter-spacing: -.01em; }
  svg .n-sub { fill: var(--muted); font: 10px var(--mono); }
  svg .e-label { fill: var(--muted); font: 600 10px var(--mono); }
  svg .e-lbg { fill: var(--bg-2); stroke: var(--border); }
  svg .g-label { font: 700 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
  svg .badge-tx { font: 700 8.5px var(--mono); letter-spacing: .08em; }
  svg .edge { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: stroke-width .15s, opacity .2s; }
  svg .halo { fill: none; stroke: var(--bg-2); stroke-width: 6; }
  svg .hitline { fill: none; stroke: transparent; stroke-width: 12; }
  svg .flowline { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 1.5 13; opacity: 0; pointer-events: none; }
  .flowing svg .flowline { opacity: .95; animation: flowdash 1.1s linear infinite; }
  .flowing svg .edge { opacity: .55; }
  @keyframes flowdash { to { stroke-dashoffset: -14.5; } }
  @media (prefers-reduced-motion: reduce) { .flowing svg .flowline { animation: none; opacity: 0; } .flowing svg .edge { opacity: 1; } }
  .ctl button.on { color: var(--cyan); background: var(--cyan-f); }
  svg .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -12; } }
  @media (prefers-reduced-motion: reduce) { svg .flow { animation: none; } }
  /* reading depths (archify): far out = shapes + names; closer = subs, verbs, edge labels */
  .depth-read { transition: opacity .18s; }
  [data-depth="map"] .depth-read { opacity: 0; pointer-events: none; }
  /* typed node styles (map) */
  svg .node { cursor: pointer; outline: none; }
  svg .node .n-ring { fill: none; stroke-width: 1.2; stroke-opacity: .38; }
  svg .node.pub .n-body { stroke-width: 2.6; }
  svg .node.pub .n-label { font-weight: 700; }
  svg .node.priv .n-body { stroke-width: 1; stroke-opacity: .7; fill-opacity: .5; }
  svg .node.priv .n-label { fill: var(--muted); font-weight: 500; font-size: 11.5px !important; }
  svg .node.priv .n-sub { display: none; }
  svg .node.priv .n-sigil { opacity: .7; }
  svg .node .n-stack { fill: var(--mask); stroke-width: 1; stroke-opacity: .45; }
  svg .node .ini-tx { font: 700 7.5px var(--mono); }
  svg .node .tab-tx { font: 800 8px var(--mono); letter-spacing: .14em; fill: var(--mask); }
  svg .node .verb-chip { fill: var(--mask); stroke-width: .9; stroke-opacity: .6; }
  svg .node .verb-tx { font: 600 9.5px var(--mono); }
  svg .node.subject .n-body { stroke-dasharray: none; filter: drop-shadow(0 0 10px color-mix(in srgb, currentColor 0%, transparent)); }
  svg .node:hover .n-body, svg .node:focus-visible .n-body { stroke-width: 3; }
  svg .node.priv:hover .n-body { stroke-opacity: 1; }
  svg .node.priv:hover .n-label { fill: var(--text); }
  svg .node:focus-visible .n-mask { stroke: var(--cyan); stroke-width: 3; }
  svg .edge-g.hov .edge, svg .edge-g.hot .edge { stroke-width: 2.6; }
  .focusing svg .node:not(.sel):not(.nb) { opacity: .28; }
  .focusing svg .edge-g:not(.hot) { opacity: .15; }
  .focusing svg .e-lab:not(.hot) { opacity: .15; }
  svg .node, svg .edge-g, svg .e-lab { transition: opacity .2s; }
  svg .node.sel .n-body { stroke-width: 3.2; }
  svg .node.sel .n-mask { stroke: var(--text); stroke-width: 1; stroke-dasharray: 3 3; }
  svg .node.flash .n-mask { animation: flash 1.3s ease-out; }
  @keyframes flash { 0%, 40% { stroke: var(--amber); stroke-width: 8; } 100% { stroke-width: 0; } }

  /* ================= map mode app shell ================= */
  body.map-mode { overflow: hidden; height: 100dvh; background-image: none; }
  .mapapp { display: grid; grid-template-columns: 0 minmax(0, 1fr) 0; grid-template-rows: 54px minmax(0, 1fr); height: 100dvh; max-width: none; padding: 0; transition: grid-template-columns .25s ease; }
  body.tree-open .mapapp { grid-template-columns: 248px minmax(0, 1fr) 0; }
  .mapapp:has(.panel:not([hidden])) { grid-template-columns: 0 minmax(0, 1fr) 380px; }
  body.tree-open .mapapp:has(.panel:not([hidden])) { grid-template-columns: 248px minmax(0, 1fr) 380px; }
  .mbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--border); background: var(--chrome); backdrop-filter: blur(12px); z-index: 10; min-width: 0; }
  .mbrand { display: flex; align-items: center; gap: 9px; font: 700 15px var(--sans); letter-spacing: -.01em; white-space: nowrap; }
  .mbrand i { width: 10px; height: 10px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 0 4px var(--cyan-f); }
  .crumbs { display: flex; align-items: center; gap: 4px; min-width: 0; flex: 1; overflow-x: auto; scrollbar-width: none; padding-left: 8px; border-left: 1px solid var(--border); }
  .crumb { font: 600 12.5px var(--mono); color: var(--muted); background: none; border: 0; padding: 4px 8px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
  button.crumb:hover { color: var(--text); background: var(--panel-2); }
  .crumb.cur { color: var(--text); background: var(--cyan-f); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cyan) 45%, transparent); cursor: default; }
  .crumb-sep { color: var(--dim); font: 12px var(--mono); }
  .ibtn { width: 34px; height: 34px; flex: none; border-radius: 9px; border: 1px solid var(--border-2); background: var(--panel); color: var(--text); cursor: pointer; font: 600 14px var(--mono); }
  .ibtn:hover { border-color: var(--cyan); color: var(--cyan); }
  .ibtn.sm { width: 26px; height: 26px; font-size: 12px; border-radius: 7px; }
  .pbtn { height: 34px; padding: 0 14px; border-radius: 9px; border: 0; background: var(--text); color: var(--bg); font: 600 13px var(--sans); cursor: pointer; white-space: nowrap; }
  .pbtn:hover { opacity: .88; }
  .menu { position: relative; }
  .menu-pop[hidden] { display: none; }
  .menu-pop { position: absolute; right: 0; top: 40px; min-width: 210px; padding: 5px; border-radius: 11px; background: var(--panel); border: 1px solid var(--border-2); box-shadow: var(--shadow); display: grid; z-index: 30; }
  .menu-pop button { text-align: left; background: none; border: 0; color: var(--text); font: 500 13px var(--sans); padding: 8px 10px; border-radius: 7px; cursor: pointer; }
  .menu-pop button:hover { background: var(--panel-2); color: var(--cyan); }

llect/SKILL.md"}, {"id": "super-qa", "label": "super-qa", "kind": "lane", "verbs": [], "what": "Tester lane: evidence, test-gap check, screenshots, or bounce to Build.", "when": "Use when the user says \"run super-qa\", \"QA review\", \"bug bash\", \"verify and fix\", or invokes `/super-qa`.", "how": "Before iter 1, resolve a test login. **Never ask the user; discover or create.** Order:", "source": "_skills/vendor/super-board/skills/super-qa/SKILL.md"}, {"id": "super-review", "label": "super-review", "kind": "lane", "verbs": [], "what": "Reviewer lane: own hypotheses, remembers prior findings, merge gate.", "when": "Use when the user says \"Super Review\", \"review this branch\", \"review loop\", \"make sure this is merge-ready\", \"PR review\", or asks for code, architecture, security, QA evidence, or release-readiness judgment.", "how": "**Super Review** is the super-board reviewer. It checks whether a branch or PR is safe to merge, records actionable findings, and routes fixes to the right Super workflow.", "source": "_skills/vendor/super-board/skills/super-review/SKILL.md"}, {"id": "ui-refine-loop", "label": "/ui-refine-loop", "kind": "public", "verbs": [], "what": "Critique → refine loop that polishes one page or component.", "when": "Use when the user says \"ui-refine-loop\", \"/ui-refine-loop\", \"refine loop\", \"iterate on this page\", \"polish this page with impeccable\", or \"keep polishing\".", "how": "Impeccable's `critique` and `audit` find problems once, and each fix command (`distill`, `layout`, `polish`, and the rest) fixes one kind once. This skill chains them into a short unattended loop. Each round, **fresh checkers** find and rank the problems, then a **fresh fixer** picks the right Impeccable commands and lands one green commit. A short ledger is the only thing carried between rounds, ", "source": "_skills/vendor/super-board/skills/ui-refine-loop/SKILL.md"}, {"id": "visual", "label": "/visual", "kind": "public", "verbs": ["recap", "plan"], "wh       if (pub || ext) { const tab = pub ? 'PUBLIC' : 'EXTERNAL', tw = tab.length * 6.4 + 10;
        s += `<g class="pub-tab"><rect x="${n.x + 12}" y="${n.y - 8}" width="${tw}" height="15" rx="4" fill="${c}"/><text x="${n.x + 12 + tw / 2}" y="${n.y + 3}" text-anchor="middle" class="tab-tx">${tab}</text></g>`; }
      if (map && (n.author || ext)) { // author identity: avatar, or an initials badge when unknown
        const A = (D.authors || {})[n.author] || {}, ax = n.x + n.w - 13, ay = n.y + 13, cid = 'av-' + (svgSeq) + '-' + String(n.id).replace(/[^\w-]/g, '_');
        s += `<g class="avatar"><title>${esc(A.name ? 'by ' + A.name + ' (@' + n.author + ')' : 'author unknown')}</title>`;
        if (A.avatar) s += `<clipPath id="${cid}"><circle cx="${ax}" cy="${ay}" r="8.5"/></clipPath><image href="${A.avatar}" x="${ax - 8.5}" y="${ay - 8.5}" width="17" height="17" clip-path="url(#${cid})" preserveAspectRatio="xMidYMid slice"/><circle cx="${ax}" cy="${ay}" r="8.5" fill="none" stroke="${c}" stroke-width="1.2"/>`;
        else { const ini = String(n.author || n.label).replace(/^[/@]/, '').split(/[\s_-]+/).map(w => w[0]).join('').slice(0, 2).toUpperCase(); s += `<circle cx="${ax}" cy="${ay}" r="8.5" class="n-mask" stroke="${c}" stroke-width="1.2" stroke-dasharray="2 2"/><text x="${ax}" y="${ay + 3}" text-anchor="middle" class="ini-tx" fill="${c}">${esc(ini)}</text>`; }
        s += `</g>`;
      }
      if (kids) s += `<g class="open-hint depth-read"><rect x="${n.x + n.w - 40}" y="${n.y + n.h - 11}" width="34" height="16" rx="8" class="n-mask" stroke="${c}"/><text x="${n.x + n.w - 23}" y="${n.y + n.h + 1}" text-anchor="middle" class="badge-tx" fill="${c}">⤢ ${kids}</text></g>`;
      const ch = CHG[String(n.change || '').toLowerCase()];
      if (ch) {
        const bw = ch[1].length * 6 + 12;
        s += `<rect x="${n.x + n.w - bw - 8}" y="${n.y - 8}" width="${bw}" height="16" rx="8" fill="var(--mask)" stroke="var(--${ch[0]})"/>
          <text x="${n.x + n.w - bw / 2 - 8}" y="${n.y + 3}" text-anchor="middle" class="badge-tx" fill="var(--${ch[0]})">${ch[1]}</text>`;
      }
      s += `</g>`;
    });
    s += '</g><g class="labels depth-read">';
    edges.forEach((e, i) => {
      if (!e.lbl) return;
      const L = e.lbl;
      s += `<g class="e-lab" data-i="${i}"><rect x="${L.x}" y="${L.y}" width="${L.w}" height="${L.h}" rx="5" class="e-lbg"/><text x="${L.x + L.w / 2}" y="${L.y + 12.5}" text-anchor="middle" class="e-label" data-t="el" data-o="${esc(e.from)}>${esc(e.to)}">${esc(L.text)}</text></g>`;

    return s + '</g></svg>';
  }

  /* ================= camera: wheel/pinch zoom, drag pan, animated moves =================
     Ported in spirit from archify's viewer camera (MIT): reading depths by zoom level
     (map / read / full), fit + 100% presets, keyboard steps. Implemented on the SVG viewBox
     so text stays crisp at every zoom. */
  class Camera {
    constructor(el, svg, o = {}) {
      this.el = el; this.svg = svg; this.o = o; this.s = { cx: 0, cy: 0, k: 1 }; this.touched = false;
      this.ptrs = new Map(); this.anim = 0;
      el.addEventListener('wheel', e => this.onWheel(e), { passive: false });
      el.addEventListener('pointerdown', e => this.onDown(e));
      el.addEventListener('pointermove', e => this.onMove(e));
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => el.addEventListener(t, e => this.onUp(e)));
      el.addEventListener('click', e => { if (this.dragged) { e.stopPropagation(); e.preventDefault(); this.dragged = false; } }, true);
      el.addEventListener('dblclick', e => { if (e.target.closest('.node')) return; const r = el.getBoundingClientRect(); this.zoomAt(2, e.clientX - r.left, e.clientY - r.top, true); });
    }
    setSvg(svg, bounds) { this.svg = svg; this.b = bounds; }
    size() { return [this.el.clientWidth || 800, this.el.clientHeight || 500]; }
    fitState(pad = 0.92) {
      const [W, H] = this.size(), b = this.b;
      const k = Math.min(W / b.w, H / b.h) * pad;
      return { cx: b.x + b.w / 2, cy: b.y + b.h / 2, k: Math.min(k, this.o.maxFit || 1.25) };
    }
    limits() { const f = this.fitState(); return [Math.min(f.k * 0.5, 0.2), this.o.max || 4]; }
    clamp(s) {
      const [lo, hi] = this.limits(), b = this.b;
      const k = Math.min(hi, Math.max(lo, s.k));
      return { k, cx: Math.min(b.x + b.w, Math.max(b.x, s.cx)), cy: Math.min(b.y + b.h, Math.max(b.y, s.cy)) };
    }
    apply() {
      const [W, H] = this.size(), { cx, cy, k } = this.s;
      const vx = cx - W / (2 * k), vy = cy - H / (2 * k);
      this.svg.setAttribute('viewBox', `${vx} ${vy} ${W / k} ${H / k}`);
      this.svg.setAttribute('width', W); this.svg.setAttribute('height', H);
      const g = 24 * k, G = g * 5;
      this.el.style.backgroundSize = `${g}px ${g}px, ${G}px ${G}px, ${G}px ${G}px`;
      const ox = -vx * k, oy = -vy * k;
      this.el.style.backgroundPosition = `${ox}px ${oy}px, ${ox}px ${oy}px, ${ox}px ${oy}px`;
      this.el.dataset.depth = k < 0.5 ? 'map' : k < 1.6 ? 'read' : 'full';
      this.o.onChange && this.o.onChange(this);
    }
    set(s) { cancelAnimationFrame(this.anim); this.s = this.clamp({ ...this.s, ...s }); this.apply(); }
    animate(to, ms = 380) {
      cancelAnimationFrame(this.anim);
      const from = { ...this.s }, dest = this.clamp({ ...this.s, ...to });
      if (matchMedia('(prefers-reduced-motion: reduce)').matches || window.__instant) { this.set(dest); return Promise.resolve(); }
      return new Promise(res => {
        const t0 = performance.now(), ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        const lk0 = Math.log(from.k), lk1 = Math.log(dest.k);
        const step = now => {
          const t = Math.min(1, (now - t0) / ms), e = ease(t);
          this.s = { cx: from.cx + (dest.cx - from.cx) * e, cy: from.cy + (dest.cy - from.cy) * e, k: Math.exp(lk0 + (lk1 - lk0) * e) };
          this.apply();
          if (t < 1) this.anim = requestAnimationFrame(step); else res();
        };
        this.anim = requestAnimationFrame(step);
      });
    }
    toWorld(sx, sy) { const [W, H] = this.size(), { cx, cy, k } = this.s; return [cx + (sx - W / 2) / k, cy + (sy - H / 2) / k]; }
    zoomAt(f, sx, sy, anim) {
      const [W, H] = this.size(); if (sx == null) { sx = W / 2; sy = H / 2; }
      const [wx, wy] = this.toWorld(sx, sy), [lo, hi] = this.limits();
      const k = Math.min(hi, Math.max(lo, this.s.k * f));
      const to = { k, cx: wx - (sx - W / 2) / k, cy: wy - (sy - H / 2) / k };
      this.touched = true;
      return anim ? this.animate(to, 220) : this.set(to);
    }
    fit(anim = true) { this.touched = false; return anim ? this.animate(this.fitState()) : this.set(this.fitState()); }
    actual(anim = true) { this.touched = true; return anim ? this.animate({ k: 1 }) : this.set({ k: 1 }); }
    pan(dx, dy, anim) { this.touched = true; const to = { cx: this.s.cx - dx / this.s.k, cy: this.s.cy - dy / this.s.k }; return anim ? this.animate(to, 160) : this.set(to); }
    reveal(r, anim = true) { // pan (no zoom change) until rect r is comfortably inside the viewport
      const [W, H] = this.size(), { cx, cy, k } = this.s, hw = W / (2 * k), hh = H / (2 * k), m = 60 / k;
      let nx = cx, ny = cy;
      if (r.x - m < cx - hw) nx = r.x - m + hw; else if (r.x + r.w + m > cx + hw) nx = r.x + r.w + m - hw;
      if (r.y - m < cy - hh) ny = r.y - m + hh; else if (r.y + r.h + m > cy + hh) ny = r.y + r.h + m - hh;
      if (r.w + 2 * m > 2 * hw) nx = r.x + r.w / 2;
      if (nx !== cx || ny !== cy) return anim ? this.animate({ cx: nx, cy: ny }, 300) : this.set({ cx: nx, cy: ny });
      return Promise.resolve();
    }
    zoomTo(r, fill = 0.9) { const [W, H] = this.size(); return { cx: r.x + r.w / 2, cy: r.y + r.h / 2, k: Math.min(W / r.w, H / r.h) * fill }; }
    onWheel(e) {
      const pinch = e.ctrlKey || e.metaKey;
      if (this.o.wheel === 'ctrl' && !pinch && !this.el.classList.contains('full')) return; // page scroll wins in documents
      e.preventDefault();
      const r = this.el.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top;
      const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY, dx = e.deltaMode === 1 ? e.deltaX * 16 : e.deltaX;
      const trackpadPan = !pinch && e.deltaMode === 0 && (Math.abs(dx) > 0 || (Math.abs(dy) < 40 && !Number.isInteger(dy)));
      if (trackpadPan) return this.pan(-dx, -dy);
      this.zoomAt(Math.exp(-dy * (pinch ? 0.012 : 0.0022)), sx, sy);
    }
    onDown(e) {
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      if (e.target.closest('.ctl, .minimap, button, a, input')) return;
      this.ptrs.set(e.pointerId, [e.clientX, e.clientY]);
      this.start = { x: e.clientX, y: e.clientY, s: { ...this.s }, dist: this.pinchDist() };
      this.moved = 0; this.dragged = false;
      cancelAnimationFrame(this.anim);
    }
    pinchDist() { const p = [...this.ptrs.values()]; return p.length > 1 ? Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]) : 0; }
    onMove(e) {
      if (!this.ptrs.has(e.pointerId)) return;
      this.ptrs.set(e.pointerId, [e.clientX, e.clientY]);
      if (this.ptrs.size > 1) { // pinch
        const d = this.pinchDist(); if (!this.start.dist) { this.start.dist = d; this.start.s = { ...this.s }; return; }
        const p = [...this.ptrs.values()], r = this.el.getBoundingClientRect();
        this.s = { ...this.start.s }; this.zoomAt(d / this.start.dist, (p[0][0] + p[1][0]) / 2 - r.left, (p[0][1] + p[1][1]) / 2 - r.top);
        this.dragged = true; return;
      }
      const dx = e.clientX - this.start.x, dy = e.clientY - this.start.y;
      this.moved = Math.max(this.moved, Math.hypot(dx, dy));
      if (this.moved > 4) {
        if (!this.dragged) { this.dragged = true; this.el.classList.add('grabbing'); try { this.el.setPointerCapture(e.pointerId); } catch (_) {} }
        this.touched = true;
        this.set({ cx: this.start.s.cx - dx / this.s.k, cy: this.start.s.cy - dy / this.s.k });
      }
    }
    onUp(e) {
      if (!this.ptrs.has(e.pointerId)) return;
      this.ptrs.delete(e.pointerId); this.el.classList.remove('grabbing');
      if (this.ptrs.size === 1) { const [p] = [...this.ptrs.values()]; this.start = { x: p[0], y: p[1], s: { ...this.s }, dist: 0 }; }
      if (!this.dragged) this.dragged = false;
    }
  }

  function routeAudit(geo, where) {
    const issues = [];
    // routes: no crossings, no shared runs, no label lying across another route
    const segs = geo.edges.map(e => e.pts.slice(0, -1).map((a, i) => [a, e.pts[i + 1]]));
    const name = e => `${e.s.label}→${e.t.label}`;
    const crossing = ([a, b], [c, d]) => {
      const av = a[0] === b[0], cv = c[0] === d[0];
      if (av === cv) { // parallel: overlapping collinear run = shared trunk
        if (av && Math.abs(a[0] - c[0]) < 1) return Math.min(Math.max(a[1], b[1]), Math.max(c[1], d[1])) - Math.max(Math.min(a[1], b[1]), Math.min(c[1], d[1])) > 1 ? 'share' : null;
        if (!av && Math.abs(a[1] - c[1]) < 1) return Math.min(Math.max(a[0], b[0]), Math.max(c[0], d[0])) - Math.max(Math.min(a[0], b[0]), Math.min(c[0], d[0])) > 1 ? 'share' : null;
        return null;
      }
      const [v, hz] = av ? [[a, b], [c, d]] : [[c, d], [a, b]];
      const x = v[0][0], y = hz[0][1];
      const inV = y > Math.min(v[0][1], v[1][1]) + .5 && y < Math.max(v[0][1], v[1][1]) - .5, inH = x > Math.min(hz[0][0], hz[1][0]) + .5 && x < Math.max(hz[0][0], hz[1][0]) - .5;
      return inV && inH ? 'cross' : null;
    };
    for (let i = 0; i < segs.length; i++) for (let j = i + 1; j < segs.length; j++) {
      let found = null;
      for (const s1 of segs[i]) { for (const s2 of segs[j]) { found = crossing(s1, s2); if (found) break; } if (found) break; }
      if (found === 'cross') issues.push(`${where}: edges ${name(geo.edges[i])} and ${name(geo.edges[j])} cross`);
      if (found === 'share') issues.push(`${where}: edges ${name(geo.edges[i])} and ${name(geo.edges[j])} share a line`);
    }
    geo.edges.forEach((e, i) => { if (!e.lbl) return; const L = { x: e.lbl.x + 1, y: e.lbl.y + 1, w: e.lbl.w - 2, h: e.lbl.h - 2 };
      geo.edges.forEach((o, j) => { if (j !== i && segs[j].some(([a, b]) => Math.max(a[0], b[0]) > L.x && Math.min(a[0], b[0]) < L.x + L.w && Math.max(a[1], b[1]) > L.y && Math.min(a[1], b[1]) < L.y + L.h)) issues.push(`${where}: label "${e.lbl.text}" lies on edge ${name(o)}`); }); });
    return issues;
  }

  /* label-overlap audit used by `visual.py check` (world coordinates, real font metrics) */
  function auditSvg(svg, geo, where) {
    const issues = [], R = n => ({ x: n.x, y: n.y, w: n.w, h: n.h });
    const T = [...svg.querySelectorAll('text[data-t]')].map(t => { let b; try { b = t.getBBox(); } catch (_) { return null; } return { t: t.dataset.t, o: t.dataset.o, txt: t.textContent, b: { x: b.x, y: b.y, w: b.width, h: b.height } }; }).filter(x => x && x.b.w);
    const nodes = geo.nodes;
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) if (hit(R(nodes[i]), R(nodes[j]), -1)) issues.push(`${where}: nodes "${nodes[i].label}" and "${nodes[j].label}" overlap`);
    T.forEach(a => {
      if (a.t === 'el') {
        nodes.forEach(n => { if (hit(a.b, R(n), -1)) issues.push(`${where}: edge label "${a.txt}" covers node "${n.label}"`); });
      } else {
        const own = geo.byId[a.o];
        if (own && (a.b.x < own.x + 1 || a.b.x + a.b.w > own.x + own.w - 1)) issues.push(`${where}: text "${a.txt}" overflows node "${own.label}"`);
        nodes.forEach(n => { if (n !== own && hit(a.b, R(n), -1)) issues.push(`${where}: text "${a.txt}" overlaps node "${n.label}"`); });
      }
    });
    issues.push(...routeAudit(geo, where));
    const els = T.filter(a => a.t === 'el');
    for (let i = 0; i < els.length; i++) for (let j = i + 1; j < els.length; j++) if (hit(els[i].b, els[j].b, -1)) issues.push(`${where}: edge labels "${els[i].txt}" and "${els[j].txt}" overlap`);
    return issues;
  }

  function toggleTheme() {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    const next = cur === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('visual-theme', next); } catch (e) {}
  }

  function renderDoc() {
  const kind = D.kind || 'explore';
  const L = {
    recap:   { key: 'Key changes', files: 'Files changed', dia: 'What changed', tests: 'What to test', hunks: 'Annotated changes' },
    plan:    { key: 'What will change', files: 'Files to touch', dia: 'Design', tests: 'Verification', hunks: 'Code sketches' },
    explore: { key: 'Highlights', files: 'Map', dia: 'Diagram', tests: 'Try it', hunks: 'Key code' },
  }[kind] || {};
  const labels = Object.assign({}, L, D.labels || {});
  const navItems = [];
  const sec = (id, title, count) => { navItems.push([id, title]);
    const s = h(`<section id="${id}"><h2>${esc(title)}${count != null ? ` <span class="count">${count}</span>` : ''}</h2></section>`);
    app.appendChild(s); return s; };
  const base = p => p.split('/').pop();
  const dir = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/') + 1) : '';
  const hunkByFile = {};

  /* ---------- hero ---------- */
  const m = D.meta || {};
  const eyebrow = [`<span class="kind ${esc(kind)}">${esc(kind)}</span>`];
  if (m.project) eyebrow.push(`<span>${esc(m.project)}</span>`);
  if (m.branch) eyebrow.push(`<span>⎇ ${esc(m.branch)}${m.base ? ' → ' + esc(m.base) : ''}</span>`);
  if (D.source) eyebrow.push(`<span>◇ ${esc(D.source)}</span>`);
  const st = D.stats || {};
  const stats = [];
  if (st.files != null) stats.push(`<div class="stat"><b>${st.files}</b><span>files</span></div>`);
  if (st.add != null) stats.push(`<div class="stat add"><b>+${st.add}</b><span>added</span></div>`);
  if (st.del != null) stats.push(`<div class="stat del"><b>−${st.del}</b><span>removed</span></div>`);
  if (st.commits) stats.push(`<div class="stat"><b>${st.commits}</b><span>commits</span></div>`);
  if (kind === 'plan' && (D.steps || []).length) stats.push(`<div class="stat"><b>${D.steps.length}</b><span>steps</span></div>`);
  if (kind === 'plan' && (D.files || []).length && st.files == null) stats.push(`<div class="stat"><b>${D.files.length}</b><span>files</span></div>`);
  if ((D.questions || []).length) stats.push(`<div class="stat"><b>${D.questions.length}</b><span>open questions</span></div>`);
  app.appendChild(h(`<header class="hero"><div class="eyebrow">${eyebrow.join('<span>·</span>')}</div>
    <h1>${inline(D.title || 'Visual')}</h1>${D.subtitle ? `<p class="sub">${inline(D.subtitle)}</p>` : ''}
    <div class="stats">${stats.join('')}</div></header>`));

  if (D.summary) sec('summary', 'Summary').appendChild(h(`<div class="card summary prose">${md(D.summary)}</div>`));

  /* ---------- key changes + files ---------- */
  const keys = D.keyChanges || [];
  const files = D.files || [];
  if (keys.length || files.length) {
    const s = sec('changes', keys.length ? labels.key : labels.files);
    const grid = h(`<div class="split"></div>`); s.appendChild(grid);
    if (keys.length) {
      const col = h(`<div class="changes"></div>`);
      keys.forEach((k, i) => {
        const tag = k.tag ? `<span class="tag t-${esc(String(k.tag).toLowerCase())}">${esc(k.tag)}</span>` : '';
        const chips = (k.files || []).map(f => `<span class="chip" data-file="${esc(f)}" title="${esc(f)}">${esc(base(f))}</span>`).join('');
        col.appendChild(h(`<div class="card change"><div class="num">${String(i + 1).padStart(2, '0')}</div><div>
          <h3>${inline(k.title)} ${tag}</h3>${k.detail ? `<div class="detail prose">${md(k.detail)}</div>` : ''}
          ${chips ? `<div class="chips">${chips}</div>` : ''}</div></div>`));
      });
      grid.appendChild(col);
    }
    if (files.length) grid.appendChild(renderFiles(files));
    if (!keys.length) grid.style.gridTemplateColumns = '1fr';
  }

  function normStatus(f) {
    const s = String(f.status || 'M').toUpperCase();
    return ({ ADD: 'A', ADDED: 'A', NEW: 'A', CREATE: 'A', MODIFY: 'M', MODIFIED: 'M', CHANGE: 'M', EDIT: 'M',
      DELETE: 'D', DELETED: 'D', REMOVE: 'D', RENAME: 'R', RENAMED: 'R' })[s] || s[0];
  }
  function renderFiles(files) {
    const aside = h(`<aside class="card files"></aside>`);
    const tot = files.reduce((a, f) => [a[0] + (f.add || 0), a[1] + (f.del || 0)], [0, 0]);
    const hasNums = files.some(f => f.add || f.del);
    aside.appendChild(h(`<div class="head"><span>${esc(labels.files)} · ${files.length}</span>${hasNums ? `<span><span class="plus">+${tot[0]}</span> <span class="minus">−${tot[1]}</span></span>` : ''}</div>`));
    const areas = {};
    files.forEach(f => (areas[f.area || '(root)'] ||= []).push(f));
    const many = Object.keys(areas).length > 8;
    Object.entries(areas).forEach(([area, fs]) => {
      const a = fs.reduce((x, f) => [x[0] + (f.add || 0), x[1] + (f.del || 0)], [0, 0]);
      const d = h(`<details class="area" ${many && fs.length > 6 ? '' : 'open'}><summary>${esc(area)}<span class="n">${hasNums ? `<span class="plus">+${a[0]}</span> <span class="minus">−${a[1]}</span>` : fs.length}</span></summary></details>`);
      fs.forEach(f => {
        const s = normStatus(f), tot = (f.add || 0) + (f.del || 0);
        const g = tot ? Math.round(5 * (f.add || 0) / tot) : 0;
        const blocks = hasNums ? `<span class="blocks">${[0,1,2,3,4].map(i => `<i class="${tot ? (i < g ? 'g' : 'r') : ''}"></i>`).join('')}</span>` : '';
        const nums = hasNums ? `${f.binary ? '<span>bin</span>' : `<span class="plus">+${f.add || 0}</span><span class="minus">−${f.del || 0}</span>`}${blocks}` : '';
        const pre = f.prefix ?? (f.area ? f.area + '/' : ''), rel = pre && f.path.startsWith(pre) && f.path !== pre ? f.path.slice(pre.length) : f.path;

    });
    addEventListener('popstate', () => { const p = new URLSearchParams(location.hash.slice(1)); const v = p.get('view') || rootId; if (v !== cur) go(v, { replace: true, select: p.get('node') || undefined }); else if (p.get('node')) select(p.get('node')); else if (sel) deselect(); });
    let rz; addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { if (!cam.touched) cam.fit(false); else cam.apply(); }); });

    /* export: resolve CSS variables into attributes so the file stands alone */
    function standalone(scale) {
      const clone = svg.cloneNode(true), b = geo.bounds;
      const src = svg.querySelectorAll('*'), dst = clone.querySelectorAll('*');
      const props = ['fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'opacity', 'fill-opacity', 'stroke-opacity', 'font-family', 'font-size', 'font-weight', 'letter-spacing', 'visibility'];
      src.forEach((el, i) => { const cs = getComputedStyle(el); props.forEach(p => { const v = cs.getPropertyValue(p); if (v) dst[i].style.setProperty(p, v); }); });
      clone.querySelectorAll('title').forEach(t => t.remove());
      clone.setAttribute('viewBox', `${b.x} ${b.y} ${b.w} ${b.h}`); clone.setAttribute('width', b.w * scale); clone.setAttribute('height', b.h * scale);
      const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      Object.entries({ x: b.x, y: b.y, width: b.w, height: b.h, fill: getComputedStyle(document.body).backgroundColor }).forEach(([k2, v]) => bg.setAttribute(k2, v));
      clone.insertBefore(bg, clone.firstChild.nextSibling);
      return new XMLSerializer().serializeToString(clone);
    }
    function download(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
    function exportView(x) {
      const base = (D.slug || D.title || 'map').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + cur.replace(/[^a-z0-9]+/gi, '-');
      if (x === 'svg') download(base + '.svg', new Blob([standalone(1)], { type: 'image/svg+xml' }));
      else if (x === 'png') {
        const img = new Image(), s = standalone(2), b = geo.bounds;
        img.onload = () => { const c = document.createElement('canvas'); c.width = b.w * 2; c.height = b.h * 2; c.getContext('2d').drawImage(img, 0, 0); c.toBlob(bl => download(base + '.png', bl)); };
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
      } else if (x === 'link') { navigator.clipboard && navigator.clipboard.writeText(location.href).then(() => toast('Link copied'), () => toast(location.href)); }
      else if (x === 'json') { const { meta, kind, ...model } = D; download(base.split('-' + cur)[0] + '.json', new Blob([JSON.stringify(model, null, 2)], { type: 'application/json' })); }
      if (x !== 'link') toast('Exported ' + x.toUpperCase());
    }

    /* boot */
    const p0 = new URLSearchParams(location.hash.slice(1));
    const v0 = V[p0.get('view')] ? p0.get('view') : rootId;
    stack = chain(v0); mount(v0); cam.fit(false); cam.touched = false;
    const n0 = p0.get('node') || (Q.get('shot') && v0 !== rootId ? subjectOf(V[v0]) || (V[v0].nodeIds || [])[0] : null);
    if (n0 && geo.byId[n0]) select(n0, { reveal: false });
    setHash(true);
    if (!Q.get('shot') && !Q.get('check')) { try { if (!localStorage.getItem('visual-map-seen')) { toast('Scroll to zoom · drag to pan · double-click a stacked node to open it · ? for keys', 5200); localStorage.setItem('visual-map-seen', '1'); } } catch (_) {} }

    window.__mapAudit = () => {
      const out = [], host = document.createElement('div');
      host.style.cssText = 'position:absolute;left:-99999px;top:0;width:2000px;height:2000px;visibility:hidden';
      document.body.appendChild(host);
      const routes = {}, layouts = {};
      if (Q.get('optimize')) views.forEach(v => { if (!v.layout) { const r = optimize(v.id); layouts[v.id] = r.pos; layoutCache[v.id] = r.pos; } });
      views.forEach(v => { const { g, markup } = buildView(v.id); host.innerHTML = markup; out.push(...auditSvg(host.firstChild, g, 'view ' + v.id)); Object.entries(g.stats || {}).forEach(([k, n]) => { routes[k] = (routes[k] || 0) + n; });
        g.edges.filter(e => e.how === 'fallback').forEach(e => (routes.fallbackEdges ||= []).push(`${v.id}: ${e.from}(${e.fs})→${e.to}(${e.ts})`)); });
      host.remove();
      const deep = views.filter(v => v.parent).sort((a, b) => chain(b.id).length - chain(a.id).length || (b.nodeIds || []).length - (a.nodeIds || []).length)[0];
      return { overlaps: out, routes, layouts, checked: views.length + ' views', childView: deep ? deep.id : null };
    };
  }

  try { (D.kind === 'map' ? renderMap : renderDoc)(); } catch (err) { errors.push('render: ' + err.message); console.error(err); }

  /* ---------- self-check hook for `visual.py check` ---------- */
  if (Q.get('check')) {
    const report = () => {
      let res = { overlaps: [], checked: 0 };
      try {
        if (window.__mapAudit) res = window.__mapAudit();
        else { (window.__geos || []).forEach(([fig, geo, name]) => res.overlaps.push(...auditSvg(fig.querySelector('svg'), geo, 'diagram ' + name))); res.checked = (window.__geos || []).length + ' diagrams'; }
      } catch (err) { errors.push('check: ' + err.message); }
      res.errors = errors;
      const pre = document.createElement('pre'); pre.id = 'visual-check'; pre.hidden = true; pre.textContent = JSON.stringify(res); document.body.appendChild(pre);
    };
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(report, report);
  }
})();
</script>
