  arrow markers) and viewer UX (camera zoom/pan with reading depths, minimap, node focus panel,
  node finder, export) adapted from tt-a1i/archify (MIT, (c) 2026 tt-a1i, (c) 2025 Cocoon AI).
  See ../THIRD_PARTY_NOTICES.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>super-board skill map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<script>
  try { const t = localStorage.getItem('visual-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  :root {
    --bg: #020617; --bg-2: #0b1222; --panel: #0f172a; --panel-2: #111c33; --border: #1e293b; --border-2: #334155;
    --text: #f8fafc; --muted: #94a3b8; --dim: #64748b; --grid: rgba(148,163,184,.07); --mask: #0f172a;
    --arrow: #64748b; --shadow: 0 18px 48px rgba(0,0,0,.30);
    --dot: rgba(148,163,184,.16); --gridline: rgba(148,163,184,.045); --chrome: rgba(15,23,42,.82);
    --cyan: #22d3ee; --green: #34d399; --violet: #a78bfa; --amber: #fbbf24; --rose: #fb7185; --orange: #fb923c; --slate: #94a3b8; --fuchsia: #e879f9;
    --cyan-f: rgba(8,51,68,.45); --green-f: rgba(6,78,59,.45); --violet-f: rgba(76,29,149,.42); --amber-f: rgba(120,53,15,.38);
    --rose-f: rgba(136,19,55,.42); --orange-f: rgba(154,52,18,.35); --slate-f: rgba(30,41,59,.6); --fuchsia-f: rgba(112,26,117,.38);
    --add-bg: rgba(52,211,153,.10); --add-tx: #6ee7b7; --del-bg: rgba(251,113,133,.10); --del-tx: #fda4af;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f5f7; --bg-2: #eef0f4; --panel: #ffffff; --panel-2: #f8fafc; --border: #e5e7eb; --border-2: #cbd5e1;
      --text: #0f172a; --muted: #5b6474; --dim: #8a93a3; --grid: rgba(15,23,42,.05); --mask: #ffffff; --arrow: #94a3b8; --shadow: 0 12px 32px rgba(15,23,42,.08);
      --dot: #d5dbe3; --gridline: rgba(15,23,42,.035); --chrome: rgba(255,255,255,.9);
      --cyan: #0e7490; --green: #047857; --violet: #6d28d9; --amber: #b45309; --rose: #be123c; --orange: #c2410c; --slate: #475569; --fuchsia: #a21caf;
      --cyan-f: rgba(34,211,238,.13); --green-f: rgba(52,211,153,.16); --violet-f: rgba(167,139,250,.18); --amber-f: rgba(251,191,36,.18);
      --rose-f: rgba(251,113,133,.14); --orange-f: rgba(251,146,60,.15); --slate-f: rgba(148,163,184,.16); --fuchsia-f: rgba(232,121,249,.14);
      --add-bg: rgba(16,185,129,.10); --add-tx: #047857; --del-bg: rgba(225,29,72,.08); --del-tx: #be123c;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f4f5f7; --bg-2: #eef0f4; --panel: #ffffff; --panel-2: #f8fafc; --border: #e5e7eb; --border-2: #cbd5e1;
    --text: #0f172a; --muted: #5b6474; --dim: #8a93a3; --grid: rgba(15,23,42,.05); --mask: #ffffff; --arrow: #94a3b8; --shadow: 0 12px 32px rgba(15,23,42,.08);
      --dot: #d5dbe3; --gridline: rgba(15,23,42,.035); --chrome: rgba(255,255,255,.9);
    --cyan: #0e7490; --green: #047857; --violet: #6d28d9; --amber: #b45309; --rose: #be123c; --orange: #c2410c; --slate: #475569; --fuchsia: #a21caf;
    --cyan-f: rgba(34,211,238,.13); --green-f: rgba(52,211,153,.16); --violet-f: rgba(167,139,250,.18); --amber-f: rgba(251,191,36,.18);
    --rose-f: rgba(251,113,133,.14); --orange-f: rgba(251,146,60,.15); --slate-f: rgba(148,163,184,.16); --fuchsia-f: rgba(232,121,249,.14);
    --add-bg: rgba(16,185,129,.10); --add-tx: #047857; --del-bg: rgba(225,29,72,.08); --del-tx: #be123c;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 22px 22px; }
  a { color: var(--cyan); }
  code, .mono { font-family: var(--mono); font-size: .86em; }
  :not(pre) > code { overflow-wrap: anywhere; background: var(--panel-2); border: 1px solid var(--border); padding: .05em .35em; border-radius: 5px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 720px) { .wrap { padding: 0 32px; } }

  /* top bar */
  .bar { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(10px); background: color-mix(in srgb, var(--bg) 82%, transparent); border-bottom: 1px solid var(--border); }
  .bar .wrap { display: flex; align-items: center; gap: 14px; height: 50px; }
  .bar .brand { font: 700 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .bar nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  .bar nav a { color: var(--muted); text-decoration: none; font: 500 13px var(--sans); padding: 5px 10px; border-radius: 7px; white-space: nowrap; }
  .bar nav a:hover { color: var(--text); background: var(--panel); }
  .btn { background: var(--panel); border: 1px solid var(--border-2); color: var(--text); border-radius: 8px; height: 32px; padding: 0 12px; font: 500 13px var(--sans); cursor: pointer; }
  .btn:hover { border-color: var(--cyan); }
  .btn:focus-visible, button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  /* hero */
  header.hero { padding: 40px 0 8px; }
  .eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font: 600 12px var(--mono); color: var(--muted); }
  .kind { text-transform: uppercase; letter-spacing: .12em; font-weight: 700; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .kind.recap { color: var(--green); border-color: var(--green); background: var(--green-f); }
  .kind.plan { color: var(--cyan); border-color: var(--cyan); background: var(--cyan-f); }
  .kind.explore { color: var(--violet); border-color: var(--violet); background: var(--violet-f); }
  h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.15; letter-spacing: -.025em; margin: 14px 0 8px; font-weight: 700; }
  .sub { color: var(--muted); font-size: 16px; margin: 0 0 18px; max-width: 820px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat { display: flex; align-items: baseline; gap: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 7px 12px; }
  .stat b { font: 700 17px var(--mono); }
  .stat span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .stat.add b { color: var(--green); } .stat.del b { color: var(--rose); }

  section { padding: 26px 0 8px; scroll-margin-top: 60px; }
  h2 { font: 700 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  h2 .count { color: var(--dim); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; }
  .prose p { margin: 0 0 12px; max-width: 860px; } .prose p:last-child { margin-bottom: 0; }
  .prose ul { margin: 0 0 12px; padding-left: 20px; }
  .summary { padding: 20px 22px; font-size: 16px; }

  /* key changes + files */
  .split { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 980px) { .split { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } .split > aside { position: sticky; top: 64px; } }
  .changes { display: grid; gap: 10px; }
  .change { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 16px 18px; }
  .change .num { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font: 700 13px var(--mono); background: var(--panel-2); border: 1px solid var(--border-2); color: var(--muted); }
  .change h3 { margin: 2px 0 4px; font-size: 16px; line-height: 1.35; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .change .detail { color: var(--muted); font-size: 14.5px; }
  .tag { font: 700 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; }
  .t-added, .t-new, .t-add { color: var(--green); } .t-changed, .t-modified, .t-change { color: var(--cyan); } .t-removed, .t-delete { color: var(--rose); }
  .t-fix { color: var(--amber); } .t-refactor { color: var(--violet); } .t-docs, .t-chore { color: var(--slate); } .t-risk { color: var(--orange); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font: 500 12px var(--mono); color: var(--muted); background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .chip:hover { color: var(--text); border-color: var(--cyan); }

  .files { padding: 6px 0; overflow: hidden; }
  .files .head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 8px; font: 600 12px var(--mono); color: var(--muted); }
  .area { border-top: 1px solid var(--border); }
  .area > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 9px 16px; font: 600 12.5px var(--mono); color: var(--text); }
  .area > summary::-webkit-details-marker { display: none; }
  .area > summary::before { content: "▸"; color: var(--dim); transition: transform .15s; }
  .area[open] > summary::before { transform: rotate(90deg); }
  .area > summary .n { margin-left: auto; font-weight: 500; }
  .frow { display: grid; grid-template-columns: 20px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 5px 16px 5px 30px; font: 12.5px var(--mono); cursor: default; }
  .frow.link { cursor: pointer; } .frow.link:hover, .frow.hl { background: var(--panel-2); }
  .frow .st { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font-size: 10px; font-weight: 700; border: 1px solid currentColor; }
  .st.A { color: var(--green); } .st.M { color: var(--amber); } .st.D { color: var(--rose); } .st.R { color: var(--violet); }
  .frow .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .frow .p bdi { direction: ltr; } .frow .p .dir { color: var(--dim); }
  .frow .ad { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .plus { color: var(--green); } .minus { color: var(--rose); }
  .blocks { display: inline-flex; gap: 2px; } .blocks i { width: 7px; height: 7px; border-radius: 2px; background: var(--border-2); }
  .blocks i.g { background: var(--green); } .blocks i.r { background: var(--rose); }
  .fnote { grid-column: 2 / 4; color: var(--muted); font: 12.5px/1.45 var(--sans); margin-top: -2px; }

  /* diagrams */
  figure.dia { margin: 0 0 18px; padding: 18px 18px 14px; overflow: hidden; }
  @media (min-width: 1300px) { #diagram { position: relative; left: 50%; transform: translateX(-50%); width: min(1640px, calc(100vw - 64px)); } }
  figure.dia figcaption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 18px; margin-bottom: 10px; }
  figure.dia .ft { font-weight: 600; font-size: 16px; }
  figure.dia .fc { color: var(--muted); font-size: 14px; margin-top: 10px; }
  .canvas { position: relative; overflow: hidden; border-radius: 10px; border: 1px solid var(--border); background-color: var(--bg-2); touch-action: none; cursor: grab; outline: none;
    background-image: radial-gradient(circle, var(--dot) 1.1px, transparent 1.4px), linear-gradient(var(--gridline) 1px, transparent 1px), linear-gradient(90deg, var(--gridline) 1px, transparent 1px); }
  .canvas:focus-visible { box-shadow: 0 0 0 2px var(--cyan); }
  .canvas.grabbing, .stage.grabbing { cursor: grabbing; }
  .canvas svg { display: block; position: absolute; inset: 0; }
  .canvas.full { position: fixed; inset: 12px; z-index: 60; border-radius: 14px; box-shadow: var(--shadow); height: auto !important; }
  body.noscroll { overflow: hidden; }
  .cam-hint { position: absolute; left: 10px; bottom: 8px; font: 500 11px var(--mono); color: var(--dim); pointer-events: none; opacity: 0; transition: opacity .2s; }
  .canvas:hover .cam-hint { opacity: 1; }
  .ctl { position: absolute; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 11px; background: var(--chrome); border: 1px solid var(--border-2); box-shadow: var(--shadow); backdrop-filter: blur(10px); z-index: 4; }
  .ctl button { min-width: 30px; height: 28px; border: 0; background: none; color: var(--text); font: 600 13px var(--mono); border-radius: 8px; cursor: pointer; padding: 0 7px; }
  .ctl button:hover:not(:disabled) { background: var(--panel-2); color: var(--cyan); }
  .ctl button:disabled { opacity: .35; cursor: default; }
  .ctl .pct { min-width: 54px; font-weight: 500; color: var(--muted); }
  .ctl .sep { width: 1px; height: 18px; background: var(--border-2); margin: 0 3px; }
  .ctl .depth { font: 700 10px var(--mono); letter-spacing: .12em; color: var(--dim); padding: 0 8px; }
  .mini-ctl { opacity: .0; transition: opacity .2s; } .canvas:hover .mini-ctl, .canvas:focus-within .mini-ctl, .canvas.full .mini-ctl { opacity: 1; }
  @media (hover: none) { .mini-ctl { opacity: 1; } }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 600 11px var(--mono); color: var(--muted); align-items: center; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; border: 1.5px solid; margin-right: 6px; vertical-align: -1px; }
  svg .n-mask { fill: var(--mask); }
  svg .n-body { stroke-width: 1.5; transition: stroke-width .15s, filter .15s; }
  svg .n-label { fill: var(--text); font: 600 13px var(--mono); letter-spacing: -.01em; }
  svg .n-sub { fill: var(--muted); font: 10px var(--mono); }
  svg .e-label { fill: var(--muted); font: 600 10px var(--mono); }
  svg .e-lbg { fill: var(--bg-2); stroke: var(--border); }
  svg .g-label { font: 700 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
  svg .badge-tx { font: 700 8.5px var(--mono); letter-spacing: .08em; }
  svg .edge { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: stroke-width .15s, opacity .2s; }
  svg .halo { fill: none; stroke: var(--bg-2); stroke-width: 6; }
  svg .hitline { fill: none; stroke: transparent; stroke-width: 12; }
  svg .flowline { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 1.5 13; opacity: 0; pointer-events: none; }
  .flowing svg .flowline { opacity: .95; animation: flowdash 1.1s linear infinite; }
  .flowing svg .edge { opacity: .55; }
  @keyframes flowdash { to { stroke-dashoffset: -14.5; } }
  @media (prefers-reduced-motion: reduce) { .flowing svg .flowline { animation: none; opacity: 0; } .flowing svg .edge { opacity: 1; } }
  .ctl button.on { color: var(--cyan); background: var(--cyan-f); }
  svg .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -12; } }
  @media (prefers-reduced-motion: reduce) { svg .flow { animation: none; } }
  /* reading depths (archify): far out = shapes + names; closer = subs, verbs, edge labels */
  .depth-read { transition: opacity .18s; }
  [data-depth="map"] .depth-read { opacity: 0; pointer-events: none; }
  /* typed node styles (map) */
  svg .node { cursor: pointer; outline: none; }
  svg .node .n-ring { fill: none; stroke-width: 1.2; stroke-opacity: .38; }
  svg .node.pub .n-body { stroke-width: 2.6; }
  svg .node.pub .n-label { font-weight: 700; }
  svg .node.priv .n-body { stroke-width: 1; stroke-opacity: .7; fill-opacity: .5; }
  svg .node.priv .n-label { fill: var(--muted); font-weight: 500; font-size: 11.5px !important; }
  svg .node.priv .n-sub { display: none; }
  svg .node.priv .n-sigil { opacity: .7; }
  svg .node .n-stack { fill: var(--mask); stroke-width: 1; stroke-opacity: .45; }
  svg .node .ini-tx { font: 700 7.5px var(--mono); }
  svg .node .tab-tx { font: 800 8px var(--mono); letter-spacing: .14em; fill: var(--mask); }
  svg .node .verb-chip { fill: var(--mask); stroke-width: .9; stroke-opacity: .6; }
  svg .node .verb-tx { font: 600 9.5px var(--mono); }
  svg .node.subject .n-body { stroke-dasharray: none; filter: drop-shadow(0 0 10px color-mix(in srgb, currentColor 0%, transparent)); }
  svg .node:hover .n-body, svg .node:focus-visible .n-body { stroke-width: 3; }
  svg .node.priv:hover .n-body { stroke-opacity: 1; }
  svg .node.priv:hover .n-label { fill: var(--text); }
  svg .node:focus-visible .n-mask { stroke: var(--cyan); stroke-width: 3; }
  svg .edge-g.hov .edge, svg .edge-g.hot .edge { stroke-width: 2.6; }
  .focusing svg .node:not(.sel):not(.nb) { opacity: .28; }
  .focusing svg .edge-g:not(.hot) { opacity: .15; }
  .focusing svg .e-lab:not(.hot) { opacity: .15; }
  svg .node, svg .edge-g, svg .e-lab { transition: opacity .2s; }
  svg .node.sel .n-body { stroke-width: 3.2; }
  svg .node.sel .n-mask { stroke: var(--text); stroke-width: 1; stroke-dasharray: 3 3; }
  svg .node.flash .n-mask { animation: flash 1.3s ease-out; }
  @keyframes flash { 0%, 40% { stroke: var(--amber); stroke-width: 8; } 100% { stroke-width: 0; } }

  /* ================= map mode app shell ================= */
  body.map-mode { overflow: hidden; height: 100dvh; background-image: none; }
  .mapapp { display: grid; grid-template-columns: 0 minmax(0, 1fr) 0; grid-template-rows: 54px minmax(0, 1fr); height: 100dvh; max-width: none; padding: 0; transition: grid-template-columns .25s ease; }
  body.tree-open .mapapp { grid-template-columns: 248px minmax(0, 1fr) 0; }
  .mapapp:has(.panel:not([hidden])) { grid-template-columns: 0 minmax(0, 1fr) 380px; }
  body.tree-open .mapapp:has(.panel:not([hidden])) { grid-template-columns: 248px minmax(0, 1fr) 380px; }
  .mbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--border); background: var(--chrome); backdrop-filter: blur(12px); z-index: 10; min-width: 0; }
  .mbrand { display: flex; align-items: center; gap: 9px; font: 700 15px var(--sans); letter-spacing: -.01em; white-space: nowrap; }
  .mbrand i { width: 10px; height: 10px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 0 4px var(--cyan-f); }
  .crumbs { display: flex; align-items: center; gap: 4px; min-width: 0; flex: 1; overflow-x: auto; scrollbar-width: none; padding-left: 8px; border-left: 1px solid var(--border); }
  .crumb { font: 600 12.5px var(--mono); color: var(--muted); background: none; border: 0; padding: 4px 8px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
  button.crumb:hover { color: var(--text); background: var(--panel-2); }
  .crumb.cur { color: var(--text); background: var(--cyan-f); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cyan) 45%, transparent); cursor: default; }
  .crumb-sep { color: var(--dim); font: 12px var(--mono); }
  .ibtn { width: 34px; height: 34px; flex: none; border-radius: 9px; border: 1px solid var(--border-2); background: var(--panel); color: var(--text); cursor: pointer; font: 600 14px var(--mono); }
  .ibtn:hover { border-color: var(--cyan); color: var(--cyan); }
  .ibtn.sm { width: 26px; height: 26px; font-size: 12px; border-radius: 7px; }
  .pbtn { height: 34px; padding: 0 14px; border-radius: 9px; border: 0; background: var(--text); color: var(--bg); font: 600 13px var(--sans); cursor: pointer; white-space: nowrap; }
  .pbtn:hover { opacity: .88; }
  .menu { position: relative; }
  .menu-pop[hidden] { display: none; }
  .menu-pop { position: absolute; right: 0; top: 40px; min-width: 210px; padding: 5px; border-radius: 11px; background: var(--panel); border: 1px solid var(--border-2); box-shadow: var(--shadow); display: grid; z-index: 30; }
  .menu-pop button { text-align: left; background: none; border: 0; color: var(--text); font: 500 13px var(--sans); padding: 8px 10px; border-radius: 7px; cursor: pointer; }
  .menu-pop button:hover { background: var(--panel-2); color: var(--cyan); }

rces) or /super-collect <source…> with sentry, posthog, github, prs, architecture or a custom source's name; optional --since and --yes.", "how": "Fetches each source for the window (default 14 days), sends every candidate to one fresh verifier sub-agent, then files through super-collect-file.sh. Dry-run by default: it shows a plan table and files on confirm.", "source": ["_skills/vendor/super-board/skills/super-collect/SKILL.md"], "verbs": ["sentry", "posthog", "github", "prs", "architecture", "custom"], "sublabel": "sentry · posthog · github · prs · architecture · custom", "opensView": "super-collect", "author": "EricTechPro"}, {"id": "ui-refine-loop", "label": "/ui-refine-loop", "kind": "public", "what": "Unattended Impeccable check-then-fix loop on one page or component that ends in a draft PR with a Before | After table. Standalone: no board lane ever starts it.", "when": "Eric runs /ui-refine-loop <route | component | description> [\"what's wrong\"] [--rounds N], or says \"refine loop\" or \"polish this page with impeccable\".", "how": "Reads the target's code, grills Eric (at most 10 questions) into a taste file, then runs the saved ui-refine-loop workflow: each round fresh checkers rank typed problems and a fresh fixer chains Impeccable verbs, polish last. Default 5 rounds; a finish reviewer grades every fix. Commits are `💄 [ui] <slug>: …` and the PR body uses super-board-pr-body.sh's marker blocks.", "source": ["_skills/vendor/super-board/skills/ui-refine-loop/SKILL.md", "_skills/vendor/super-board/workflows/ui-refine-loop.js"], "verbs": ["<route|component>", "--rounds N"], "sublabel": "grill · check · fix · draft PR", "opensView": "ui-refine-loop", "author": "EricTechPro"}, {"id": "visual", "label": "/visual", "kind": "public", "what": "Turns the current work into one self-contained HTML page: a branch recap, a plan, or a map of a folder or architecture, with diagrams, a file map and annotated code.", "when": "Eric runs /visual, /visual recap [base], /visual plan [file] or /visual <path>; with no argument visual.py detect picks the mode.", "how": "Writes a data.json from git facts or the plan, then visual.py render injects it into an inline template with no build step. It screenshots the page headless to check it, and offers to publish only on a yes.", "source": ["_skills/vendor/super-board/skills/visual/SKILL.md"], "verbs": ["recap", "plan", "explore"], "sublabel": "recap · plan · explore", "opensView": "visual", "author": "EricTechPro", "credits": ["BuilderIO", "tt-a1i"]}, {"id": "sb-onboard", "label": "/super-board onboard", "kind": "public", "what": "An 8-step setup wizard (Checks · GitHub · Board · Branch · AGENTS.md · Policies · Bug sources · Review) that installs or repairs what the board needs and writes the config once.", "when": "Eric runs /super-board onboard (or /super-board:super-board onboard after a plugin install), on a new project, after an upgrade from 2.x, or to check and repair an existing setup.", "how": "One AskUserQuestion per step with the recommended option first; must-haves are fixed without asking by super-board-setup.py. Answers save to onboard-answers.json as they come, so a halt resumes, and repo files change only at step 8 after \"Write everything\". It ends by naming /super-board lint.", "source": ["_skills/vendor/super-board/skills/super-board/references/onboard.md", "_skills/vendor/super-board/scripts/super-board-setup.py"], "author": "EricTechPro", "opensView": "sb-onboard"}, {"id": "sb-lint", "label": "/super-board lint", "kind": "public", "what": "Pre-flight readiness check that walks Ready, Building, QA and Review, flags issues that fail any of 18 criteria, proposes a qa/bug/feature label, and dispatches a helper skill per flagged issue.", "when": "Eric runs /super-board lint before a run, typically after /super-collect filed new Backlog cards.", "how": "Criteria 13–18 cover what the loop needs: a parseable `## Blocked by` line, a fake with no follow-up card, too big (over ~400 changed lines or many areas), the ticket sections, a checklist AC, and lettered Context steps. Phase 4 routes each flagged pattern to one skill sub-agent while Eric keeps the pace.", "source": ["_skills/vendor/super-board/skills/super-board/references/lint.md"], "opensView": "sb-lint", "author": "EricTechPro"}, {"id": "sb-status", "label": "/super-board status", "kind": "public", "what": "Read-only snapshot of the active config, every column in board order (Backlog included), and in-flight workers.", "when": "Eric runs /super-board status to see where a run stands.", "how": "super-board-status.py reads the board and local in-flight state and prints the columns in the board's own order; it changes nothing.", "source": ["_skills/vendor/super-board/skills/super-board/references/status.md", "_skills/vendor/super-board/scripts/super-board-status.py"], "author": "EricTechPro"}, {"id": "sb-run", "label": "/super-board run", "kind": "public", "what": "The autonomous loop: repeated waves of the super-board-wave workflow from this session until the board drains or a halt gate fires. Also the resume command.", "when": "Eric runs /super-board run [--low|--high] [<slug>]; the default worker_backend \"workflow\" stays in-session, \"claude-p\" opts into the legacy headless runner.", "how": "Each wave: rate and usage guard, plan with super-board-wave-plan.sh (which refuses an old `variant: qa-only` config with exit 65), act on sweep/flag/stranded/resume, claim cards by assignee, launch the workflow, reconcile, report. Halts after 3 zero-progress waves, a high block rate, or a stop.", "source": ["_skills/vendor/super-board/skills/super-board/references/run-workflow.md", "_skills/vendor/super-board/skills/super-board/references/run.md"], "verbs": ["--low", "--high"], "opensView": "super-board-run", "author": "EricTechPro"}, {"id": "sb-stop", "label": "/super-board stop", "kind": "public", "what": "Graceful shutdown: stops the wave, posts \"stopped mid-flight\" comments, releases assignee claims, and removes the wave lock so the next run resumes.", "when": "Eric runs /super-board stop or says \"stop the run\" / \"pause the loop\".", "how": "Stops the workflow (or kills the legacy dispatcher via super-board-stop.sh), comments on every in-flight issue and PR, and strips bot_identity assignees. Resume is just `run` again.", "source": ["_skills/vendor/super-board/skills/super-board/references/stop.md", "_skills/vendor/super-board/scripts/super-board-stop.sh"], "author": "EricTechPro"}, {"id": "super-build", "label": "super-build", "kind": "lane", "what": "Builder lane: takes a pre-flighted Ready card into its own worktree, makes the smallest safe change test-first under the 400-line PR cap, opens a draft PR and moves the card to QA. It never merges.", "when": "Started by the board: the super-board-wave workflow runs it for Ready cards labelled feature or bug (or unlabelled) once pre-flight says proceed. Also runnable standalone as /super-build (legacy headless claude -p dispatch).", "how": "Follows run.md's Builder lifecycle. An explicit `Skills:` line wins, else the type label picks the chain, always plus ponytail first, verification-before-completion and a code-review of its own diff. Past the size cap mid-build it stops and proposes a /to-tickets split. Commits and PR blocks follow the writing standard via super-board-pr-body.sh.", "source": ["_skills/vendor/super-board/skills/super-build/SKILL.md", "_skills/vendor/super-board/skills/super-build/references/decision-policy.md", "_skills/vendor/super-board/skills/super-build/references/worker-preamble.md", "_skills/vendor/super-board/skills/super-board/references/run.md"], "opensView": "super-build", "author": "EricTechPro"}, {"id": "super-qa", "label": "super-qa", "kind": "lane", "what": "Tester lane: builds an issue-scoped test plan, runs a test-gap check on the Builder's diff, captures evidence and screenshots, then passes the card to Review or bounces it to Build.", "when": "Started by the board for cards in QA, and straight from Ready for cards labelled qa (they skip Building). Also runnable standalone as /super-qa, a BFS route-crawling bug-bash, or /super-qa <url> for a live site with no repo.", "how": "One observable test per AC plus the test-gap ledger, High gaps written red-first. On a qa card it creates the issue branch itself and files real defects as bug cards. It ticks the PR's ac block, writes visual and history rows with super-board-pr-body.sh, and posts `[qa] [report]` comments with screenshots pinned to a sha.", "source": ["_skills/vendor/super-board/skills/super-qa/SKILL.md", "_skills/vendor/super-board/skills/super-qa/references/iteration-preamble.md", "_skills/vendor/super-board/skills/super-board/references/run.md"], "opensView": "super-qa", "author": "EricTechPro"}, {"id": "super-review", "label": "super-review", "kind": "lane", "what": "Reviewer lane and standalone PR review: forms its own hypotheses first, remembers prior findings, classes every finding, and merges only through the merge gate.", "when": "Started by the board for cards in Review (always on the session model). Also runnable standalone when Eric says \"review this branch\" or \"is this merge-ready\".", "how": "Thread scan, prior-report round 1, own pass with code-review, codebase-design and ponytail-review, a rerun of the Tester's exact test command, then an adversarial truth-check on non-trivial diffs. One report comment is edited in place every round. A clean review merges through the gate pinned to the reviewed head SHA; exit 7 or 8 parks the card in Blocked with 🙋. Visual problems become a UI ticket, never a ui-refine-loop run. The truth-check sub-agents get a fixed verbatim brief, and Over-engineering is never a Blocker from any of them.", "source": ["_skills/vendor/super-board/skills/super-review/SKILL.md"], "opensView": "super-review", "author": "EricTechPro"}, {"id": "gh-board", "label": "GitHub Project board", "kind": "board", "what": "The configured GitHub Project with seven columns (Backlog, Ready, Building, QA, Review, Blocked, Done) and three routing labels (qa, bug, feature); the only loop state. There is no Skipped column.", "when": "Read and written on every wave, by every lane move, and by /super-collect filing into Backlog.", "how": "Cards move by `gh project item-edit`; assignees act as claim mutexes; PR threads start with their owner lane [builder] / [qa] / [reviewer] plus a label. A card dropped on purpose is closed as not planned and moved to Done with a 🤷 comment.", "source": ["_skills/vendor/super-board/skills/super-board/references/run.md", "_skills/vendor/super-board/skills/super-board/references/run-workflow.md"]}, {"id": "sb-config", "label": "super-board config", "kind": "board", "what": "Per-project JSON config: board, base branch, timezone, the seven columns, labels, merge_policy, migrations, worker backend, model tier, truth gate, plus `collect` (sources and custom[]) and `refine` blocks. No `variant` key.", "when": "Written once by onboard at step 8 (and migrated to v3 keys by super-board-setup.py fix); read at the start of every run, collect and ui-refine-loop setup.", "how": "Lives at `.claude/super-board/configs/<slug>.json` with `.claude/super-board/active` pointing at it, validated against config-schema.json.", "source": ["_skills/vendor/super-board/skills/super-board/references/config-schema.json"]}, {"id": "base-branch", "label": "repo · base branch", "kind": "board", "what": "The project's git repo and configured base branch (never assumed to be main); a card is Done only when its merge commit is an ancestor of it.", "when": "Changed only by a merge-gate squash-merge; read by /visual and branched from by every worktree.", "how": "Lanes and ui-refine-loop work on their own branches under .worktrees/ or .claude/worktrees/; the opt-in protected-push guard can block direct pushes to it.", "source": ["_skills/vendor/super-board/skills/super-review/SKILL.md", "_skills/vendor/super-board/skills/super-board/references/run.md"]}, {"id": "run-manifest", "label": "run manifest", "kind": "board", "what": "Per-run ledger at `docs/super-board/runs/<date>-<slug>.md`, one line per card per wave.", "when": "Appended during each wave's reconcile step.", "how": "Each line records card, lanes run, final status, column and detail: `| #N | <lanesRun> | <finalStatus> | <column> | <detail> |`.", "source": ["_skills/vendor/super-board/skills/super-board/references/run-workflow.md"]}, {"id": "qa-board", "label": "Super Ultimate QA board", "kind": "board", "what": "Separate GitHub Project (Queue, Testing, Done, Bug, Flaky, Skip) used by standalone /super-qa as its loop state.", "when": "Written when a standalone super-qa iteration finds a red spec; /super-collect bugs and qa-card defects also go through the same filer.", "how": "super-qa-file-bug.sh creates a `source:qa` issue with the evidence body and sets its Status to Bug (Flaky and Skip for the other outcomes).", "source": ["_skills/vendor/super-board/skills/super-qa/SKILL.md"]}, {"id": "taste-file", "label": "taste + direction file", "kind": "board", "what": "Per-project design taste file (default `docs/design/taste.md`) holding the grill's goal, direction, keep and avoid answers plus taste rules and slop tells.", "when": "Written after the grill and committed as the refine branch's first commit; read first by every checker, fixer and finish reviewer.", "how": "Starts from the neutral references/taste.md when absent; each target gets a `### <target>` block under Direction, with \"you pick\" answers marked (picked).", "source": ["_skills/vendor/super-board/skills/ui-refine-loop/references/grill.md", "_skills/vendor/super-board/skills/ui-refine-loop/references/taste.md"]}, {"id": "refine-ledger", "label": "refine ledger", "kind": "board", "what": "The only memory carried between refine rounds: one line per check with score /40, before-vs-now, and problem ids.", "when": "Appended by the workflow after every check; written to `<run>/ledger.md` at finish.", "how": "Checkers reuse ledger ids so a problem that survives three checks is called out; stop rules read it (two clean checks, two reverts in a row).", "source": ["_skills/vendor/super-board/skills/ui-refine-loop/references/ledger.md"]}, {"id": "draft-pr", "label": "refine draft PR", "kind": "board", "what": "The draft PR from `refine/<slug>` against the recorded base branch, with a Before | After table, score line and finish grades.", "when": "Opened once at the end of a ui-refine-loop run; never merged by the loop.", "how": "pr-shots.sh commits round-0 and final shots to `docs/ui-refine/<slug>/` and prints a Before | After table pinned to both shas; the body uses the writing standard's marker blocks (status, problem, solution, ac, history, visual, risk) and is humanized before `gh pr create --draft`.", "source": ["_skills/vendor/super-board/skills/ui-refine-loop/SKILL.md", "_skills/vendor/super-board/skills/ui-refine-loop/scripts/pr-shots.sh"]}, {"id": "gh-issues", "label": "open GitHub issues", "kind": "board", "what": "The repo's open issues that are not yet on the board and carry no `source:*` label.", "when": "Read by the /super-collect github source.", "how": "Fetched with `gh issue list --state open`; real work is adopted onto the board (`--adopt <n>`), never copied into a new issue.", "source": ["_skills/vendor/super-board/skills/super-collect/SKILL.md"]}, {"id": "claude-settings", "label": ".claude/settings.json", "kind": "board", "what": "The target project's Claude Code settings, where install.sh merges the guard hook block from settings-snippet.json.", "when": "Written by install.sh (backed up first, never adding a command twice); read by Claude Code at every session.", "how": "Wires PreToolUse, PostToolUse and SessionStart commands to the scripts copied into `.claude/hooks/`; `--protect-main` adds settings-protect-main.json.", "source": ["_skills/vendor/super-board/hooks/settings-snippet.json", "_skills/vendor/super-board/hooks/settings-protect-main.json", "_skills/vendor/super-board/install.sh"]}, {"id": "hooks", "label": "guard hooks", "kind": "hook", "what": "The pack's Claude Code hooks: four default guards, an opt-in push guard, post-merge worktree cleanup, and two dev-only hooks for the pack itself.", "when": "Installed by install.sh unless --no-hooks; each fires on its Claude Code event and matcher.", "how": "Python 3 stdlib scripts that read hook JSON on stdin, print a decision only when they block, and exit 0 on their own errors so a broken guard never stops work.", "source": ["_skills/vendor/super-board/hooks/README.md"], "opensView": "hooks"}, {"id": "guard-worktree-path", "label": "guard-worktree-path", "kind": "hook", "what": "Denies `git worktree add|move` whose target resolves outside `<repo>/.claude/worktrees/`.", "when": "PreToolUse, matcher Bash, on every shell command.", "how": "Parses the command, honouring `cd X &&` and `git -C X`, resolves the target path, and blocks when it escapes the worktrees folder.", "source": ["_skills/vendor/super-board/hooks/guard-worktree-path.py"]}, {"id": "guard-secrets", "label": "guard-secrets", "kind": "hook", "what": "Denies reading or piping dotenv files, SSH keys, .npmrc, credentials(.json), service-account JSON and .pem files; .env.example stays readable.", "when": "PreToolUse, matcher Bash|Read|Grep.", "how": "Matches file paths in Read/Grep input and in shell commands against secret-file patterns and blocks the call. One plain call to super-board-env-check.sh (no pipe, chain or redirect) is allowed, since it prints only present / empty / missing.", "source": ["_skills/vendor/super-board/hooks/guard-secrets.py"]}, {"id": "guard-key-literals", "label": "guard-key-literals", "kind": "hook", "what": "Stops a live-looking API key from being written into a file, and flags one already on disk.", "when": "PreToolUse on Edit|MultiEdit|Write|NotebookEdit|Bash, and PostToolUse on Edit|MultiEdit|Write|NotebookEdit.", "how": "Scans the content being written for key-shaped literals and reports line numbers only, never the value.", "source": ["_skills/vendor/super-board/hooks/guard-key-literals.py"]}, {"id": "guard-delete-outside", "label": "guard-delete-outside", "kind": "hook", "what": "Denies rm, rmdir, unlink, find -delete / -exec rm and git clean whose target resolves outside $CLAUDE_PROJECT_DIR, and always `/` or `~` itself.", "when": "PreToolUse, matcher Bash.", "how": "Resolves each target (honouring cd, git -C, ~ and $HOME); temp dirs stay allowed, and a path known only at run time is allowed.", "source": ["_skills/vendor/super-board/hooks/guard-delete-outside.py"]}, {"id": "guard-protected-push", "label": "guard-protected-push", "kind": "hook", "what": "Opt-in guard that denies a git push that would update or delete main, master, any configured base_branch, or a name in SB_PROTECTED_BRANCHES.", "when": "PreToolUse, matcher Bash, only after onboard's Policies yes (step 6) or `./install.sh --protect-main`.", "how": "Catches force pushes, explicit refspecs, --delete, --all/--mirror and a bare push while the base is checked out; feature-branch force pushes stay allowed. SB_ALLOW_PROTECTED_PUSH=1 turns it off for a session.", "source": ["_skills/vendor/super-board/hooks/guard-protected-push.py", "_skills/vendor/super-board/hooks/settings-protect-main.json"]}, {"id": "cleanup-wt", "label": "cleanup-wt", "kind": "hook", "what": "Removes worktrees and local branches already merged into a base branch; never deletes unmerged work.", "when": "SessionStart with `--auto --fetch` when a base tip moved since the last session, and after every merge when the merge gate calls it with `--post-merge`.", "how": "Wip-commits a dirty worktree on a merged branch and keeps its branch, never touches bases or its own worktree, and writes a recovery TSV under `<git-common-dir>/cleanup-wt/` before acting.", "source": ["_skills/vendor/super-board/hooks/cleanup-wt.py", "_skills/vendor/super-board/scripts/super-board-merge-gate.sh"]}, {"id": "gate-skill-evals", "label": "gate-skill-evals (dev)", "kind": "hook", "what": "Dev-only Stop hook that blocks ending a session when a skill changed and no `claude plugin eval` result is newer than the change.", "when": "Stop event in the pack's own `.claude/settings.json` (and EricOS if added by hand); never installed into target projects.", "how": "A changed SKILL.md always counts; a changed reference, script or workflow counts when the skill has an eval case. SKILL_EVAL_GATE=off, a running eval or `.claude/eval-gate-ignore` globs stand it down.", "source": ["_skills/vendor/super-board/hooks/dev/gate-skill-evals.py", "_skills/vendor/super-board/.claude/settings.json"]}, {"id": "readme-sync", "label": "readme-sync (dev)", "kind": "hook", "what": "Dev-only hooks that keep README.md's skill tables in step with skills/*/SKILL.md and families.json.", "when": "PostToolUse on Edit|Write|MultiEdit in the pack repo, and as a git pre-commit hook when it is symlinked in.", "how": "Runs super-board-readme-sync.py; the pre-commit version stops the commit when README.md had to change so it can be staged.", "source": ["_skills/vendor/super-board/.claude/settings.json", "_skills/vendor/super-board/hooks/pre-commit-readme.sh", "_skills/vendor/super-board/scripts/super-board-readme-sync.py"]}, {"id": "wave-plan", "label": "super-board-wave-plan.sh", "kind": "script", "what": "Read-only planner that computes the next wave from board state: cards (each with its lane and labels) plus the sweep, flag, stranded and resume lists.", "when": "Run by the orchestrator at the start of every wave, after the rate and usage guards pass.", "how": "Reads the board and `## Blocked by` dependencies (via super-board-deps.sh); a Ready card labelled qa gets lane qa, every other Ready card lane build. `resume` lists 🙋 cards a human approved with `done`. A `variant: qa-only` config is refused with exit 65.", "source": ["_skills/vendor/super-board/scripts/super-board-wave-plan.sh", "_skills/vendor/super-board/scripts/super-board-deps.sh"]}, {"id": "wave-js", "label": "super-board-wave.js", "kind": "script", "what": "Saved Workflow that drains one wave: a Pre-flight phase for cards about to be built, a haiku classify router, then Build, QA and Review lane agents per card.", "when": "Launched by /super-board run with {configPath, cards (with lane and labels), humanApprovesMerge, tier}; a stale `variant` other than full is refused.", "how": "Pre-flights Ready build cards in batches of 5 and never builds a card without a proceed verdict. The classifier keeps a card's qa/bug/feature label and adds feature or bug to unlabelled ones, never qa. A qa card goes Ready → QA. Model ladder by tier and complexity; Review always on the session model.", "source": ["_skills/vendor/super-board/workflows/super-board-wave.js"]}, {"id": "merge-gate", "label": "super-board-merge-gate.sh", "kind": "script", "what": "The only path to the base branch: takes an atomic mkdir lock, applies merge_policy, re-proves the branch against the current base inside the lock, runs allowed DB migrations, then squash-merges.", "when": "Called by the Reviewer once a review passes (and human_approves_merge is not set).", "how": "super-board-merge-policy.py decides who merges: money, auth, destructive schema or a diff over auto_max_lines (400 changed lines, lockfiles/generated/snapshots/migration SQL excluded) exits 7; a migration it may not run or a declared human step exits 8. Otherwise it merges with `--match-head-commit` (exit 6 when the head moved) and runs cleanup-wt --post-merge.", "source": ["_skills/vendor/super-board/scripts/super-board-merge-gate.sh", "_skills/vendor/super-board/scripts/super-board-merge-policy.py"]}, {"id": "file-bug", "label": "super-qa-file-bug.sh", "kind": "script", "what": "Files one finding as a GitHub issue with a validated body onto the Super Ultimate QA board.", "when": "Called by standalone super-qa on a red spec, and by super-collect-file.sh for bug, feature and fix tickets.", "how": "Rejects bodies missing the ticket-format sections (Problem · Context · Fix · Acceptance Criteria · Risk, bugs with the folded Evidence table) or holding placeholders; adds type, source, priority and area labels and sets the project Status, falling back through Bug, Ready, Todo, Backlog, Triage.", "source": ["_skills/vendor/super-board/scripts/super-qa-file-bug.sh"]}, {"id": "file-refactor", "label": "review-file-refactor.sh", "kind": "script", "what": "Files a deepening opportunity as a `refactor` card, deduped by fingerprint.", "when": "Called by super-review for shape findings that must not block a merge, and by super-collect-file.sh for architecture tickets.", "how": "A body with an `## Acceptance criteria` section goes straight to Ready; otherwise it lands in the holding column for lint. It appends `## Blocked by` when missing.", "source": ["_skills/vendor/super-board/scripts/super-review-file-refactor.sh"]}, {"id": "collect-file", "label": "super-collect-file.sh", "kind": "script", "what": "Single filing entry point for /super-collect that routes each verified ticket to the pack's filers.", "when": "Called once per candidate the verifier marked file or needs-triage (dry-run without --yes, real filing with it), or with --adopt <n>.", "how": "bug/feature/fix go to super-qa-file-bug.sh, refactor to super-review-file-refactor.sh, every body in the writing-standard ticket format. It enforces per-source fingerprints (custom `custom|<name>|<key>`), exact-fingerprint dedupe and the board's holding column.", "source": ["_skills/vendor/super-board/skills/super-collect/scripts/super-collect-file.sh"]}, {"id": "collect-sentry", "label": "sentry fetcher", "kind": "script", "what": "The sentry source: lists unresolved Sentry issues in the window and pulls event and tag evidence.", "when": "Run when /super-collect includes sentry and the config has a sentry block.", "how": "`collect_sentry.py list --since <w>` calls the Sentry REST API with S ding markup or styles.", "when": "Run by the isolated detector sub-agent in every check, alongside the audit.", "how": "Invoked as `scripts/impeccable detect --json` (v4.4+) or `node scripts/detect.mjs --json` (v4.0.x), as found by refine-setup.sh detect; exit 2 means findings, which are checked in source for false positives.", "source": ["_skills/vendor/super-board/skills/ui-refine-loop/references/checker-brief.md", "_skills/vendor/super-board/skills/ui-refine-loop/scripts/refine-setup.sh"]}, {"id": "install-sh", "label": "install.sh", "kind": "script", "what": "Installs the pack into a target project: skills, .claude/bin scripts, workflows and the guard hooks, with grouped emoji output.", "when": "Run by get.sh, by super-board-setup.py fix during onboard, or by hand: `./install.sh [--no-hooks] [--protect-main] [target]`.", "how": "Copies hooks/*.py to `.claude/hooks/` (never hooks/dev/) and merges the hook block through super-board-settings.py; `--no-hooks --protect-main` installs only the push guard. It records an older install in `.claude/super-board/upgrade.json` and ends with one next step: /super-board onboard.", "source": ["_skills/vendor/super-board/install.sh"], "opensView": "install"}, {"id": "visual-py", "label": "visual.py", "kind": "script", "what": "The /visual helper: detect picks the mode, facts collects git data, render injects data.json into the inline template.", "when": "Run by /visual at every step: detect with no argument, facts in recap mode, render after data.json is written.", "how": "render prints `{out, missingHunks}`; grounded hunks come from git via `hunks[].file + contains`, and output lands in a gitignored `_tmp/<date>-visual/` or `.visual/`.", "source": ["_skills/vendor/super-board/skills/visual/scripts/visual.py"]}, {"id": "grilling", "label": "grilling", "kind": "external", "what": "Interview pattern that walks a design tree in rounds: numbered questions, each with a recommended answer, until the frontier is empty.", "when": "Reach attpocock"}, {"id": "to-spec", "label": "to-spec", "kind": "external", "what": "Turns the current conversation into a spec and publishes it to the issue tracker, no interview.", "when": "Reached from ask-matt for multi-session builds; listed in super-build's skill map.", "how": "Writes the spec from a template and applies the `ready-for-agent` label; needs the tracker config from setup-matt-pocock-skills.", "source": [".agents/skills/to-spec/SKILL.md"], "external": true, "origin": "mattpocock-skills", "opensView": "to-spec", "author": "mattpocock"}, {"id": "to-tickets", "label": "to-tickets", "kind": "external", "what": "Breaks a plan or spec into tracer-bullet tickets, each declaring its blocking edges.", "when": "Reached from ask-matt after to-spec, and from /super-board lint to split a too-big ticket (criterion 15) into vertical slices; its `## Blocked by` template is why lint criterion 13 exists.", "how": "Publishes blockers first so edges reference real ids, as files locally or native blocking links on a real tracker.", "source": [".agents/skills/to-tickets/SKILL.md"], "external": true, "origin": "mattpocock-skills", "opensView": "to-tickets", "author": "mattpocock"}, {"id": "triage", "label": "triage", "kind": "external", "what": "Moves raw issues and external PRs through a state machine of triage roles into agent-ready briefs.", "when": "Reached from ask-matt when bugs and requests pile up that you did not create.", "how": "Categorise, verify, grill if needed, write the brief; every comment carries an AI disclaimer and labels come from setup-matt-pocock-skills.", "source": [".agents/skills/triage/SKILL.md"], "external": true, "origin": "mattpocock-skills", "opensView": "triage", "author": "mattpocock"}, {"id": "wayfinder", "label": "wayfinder", "kind": "external", "what": "Charts a shared map of decision tickets for a huge, foggy effort and resolves them one at a time.", "when": "Reached from ask-matt for greenfield projects or builds too big for one session.", "how": "Tickets are research, prototype, grilling or task, HITL or AFK; it hands off to to-spec when the map clears instead of building.", "source": [".agents/skills/wayfinder/SKILL.md"], "external": true, "origin": "mattpocock-skills", "opensView": "wayfinder", "author": "mattpocock"}, {"id": "verbs-group", "label": "impeccable fix verbs", "kind": "verb", "what": "The 15 Impeccable commands the ui-refine-loop fixer may chain, one per problem type, with polish always last.", "when": "Each fix round, after the checker returns ranked, typed P0–P3 problems.", "how": "The workflow attaches routing.md's default command per type and suggests a chain (severity order, structural before surface, additive verbs only when the direction asks); the fixer reads each playbook and craft-floor, then makes the final call.", "source": ["_skills/vendor/super-board/skills/ui-refine-loop/references/routing.md", "_skills/vendor/super-board/workflows/ui-refine-loop.js", "_skills/vendor/super-board/skills/ui-refine-loop/references/fixer-brief.md"], "opensView": "impeccable-verbs", "author": "pbakaus"}, {"id": "late-verbs", "label": "motion + perf verbs", "kind": "verb", "what": "The last tier of the chain before polish: animate, delight and optimize.", "when": "When a problem is typed needs-motion, personality or performance.", "how": "routing.md runs these after the structural, surface and fix tiers; animate and delight are additive, so they run only when the brief or taste direction asks for more.", "source": ["_skills/vendor/super-board/skills/ui-refine-loop/references/routing.md"], "opensView": "late-verbs", "author": "pbakaus"}, {"id": "v-critique", "label": "critique", "kind": "verb", "what": "UX design review with scoring; the loop uses Assessment A only, scored /20 across specificity, hierarchy, typography, color and composition.", "when": "Every check, run by the isolated design reviewer sub-agent in parallel with the detector.", "how": "Reads critique.md (Assessment A) and craft-floor.md, every shot and crop in both themes and widths, then the scope files; returns up to 8 typed problems. No Nielsen heuristics.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/critique.md"], "author": "pbakaus"}, {"id": "v-audit", "label": "audit", "kind": "verb", "what": "Technical quality check scored /20 across accessibility, performance, responsive, theming and implementation integrity.", "when": "Every check, run by the isolated detector sub-agent after impeccable detect.", "how": "Reads audit.md, scores five dimensions 0–4, and turns each verified detector cluster or audit gap into a typed problem; it never sees the screenshots or the design review.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/audit.md"], "author": "pbakaus"}, {"id": "v-polish", "label": "polish", "kind": "verb", "what": "Final quality pass over everything the round touched: small misalignments and inconsistencies, no structural change.", "when": "Always the last command of every fix round, even when no problem was typed polish.", "how": "Runs once over all touched files after the routed chain; then checks must be green before the round's single commit.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/polish.md"], "author": "pbakaus"}, {"id": "v-distill", "label": "distill", "kind": "verb", "what": "Strips a surface to its essence, removing duplicate actions and competing chrome.", "when": "Routed for problems typed `cluttered`.", "how": "Structural tier, so it runs first in the chain alongside extract; follows reference/distill.md as a refinement of the existing design.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/distill.md"], "author": "pbakaus"}, {"id": "v-bolder", "label": "bolder", "kind": "verb", "what": "Amplifies a safe, bland design so it has more presence.", "when": "Routed for `bland`, only when the brief or taste direction asks for more.", "how": "Additive surface-tier verb; skipped with a reason like \"direction says calmer\", and dropped when it pulls against quieter on the same element.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/bolder.md"], "author": "pbakaus"}, {"id": "v-quieter", "label": "quieter", "kind": "verb", "what": "Tones down an aggressive design: fewer colors, weights, borders, shadows or badges.", "when": "Routed for problems typed `too-loud`.", "how": "Surface tier after layout/adapt; when it conflicts with bolder on one element the higher-severity problem wins.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/quieter.md"], "author": "pbakaus"}, {"id": "v-colorize", "label": "colorize", "kind": "verb", "what": "Adds strategic color where gray or flat UI should carry meaning.", "when": "Routed for `dull-color`, only when the direction asks for more.", "how": "Additive surface-tier verb; changes must hold in light and dark and use tokens, not raw values.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/colorize.md"], "author": "pbakaus"}, {"id": "v-layout", "label": "layout", "kind": "verb", "what": "Fixes spacing, rhythm, grouping, alignment and visual hierarchy.", "when": "Routed for problems typed `spacing-hierarchy`.", "how": "Second tier, after distill/extract; a cramped look caused by a copied card is rerouted to extract by the fixer.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/layout.md"], "author": "pbakaus"}, {"id": "v-typeset", "label": "typeset", "kind": "verb", "what": "Improves typography: fonts, type scale, weights, line length and figures.", "when": "Routed for problems typed `typography`.", "how": "Surface tier with colorize, quieter and bolder; follows reference/typeset.md within the taste file's type rules.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/typeset.md"], "author": "pbakaus"}, {"id": "v-adapt", "label": "adapt", "kind": "verb", "what": "Adapts the surface to other screen sizes: breakpoints, touch targets, no sideways scroll at 390.", "when": "Routed for problems typed `responsive`.", "how": "Second tier with layout; the after shots at 390 in both themes prove it.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/adapt.md"], "author": "pbakaus"}, {"id": "v-optimize", "label": "optimize", "kind": "verb", "what": "Diagnoses and fixes UI performance: jank, layout shift, heavy images or bundles.", "when": "Routed for problems typed `performance`.", "how": "Last tier with animate and delight, before polish; follows reference/optimize.md.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/optimize.md"], "author": "pbakaus"}, {"id": "v-onboard", "label": "onboard", "kind": "verb", "what": "Designs first-run flows and empty states that point to the next action.", "when": "Routed for problems typed `first-run-empty`.", "how": "Fix tier with clarify and harden; no dense fixture means no dense shots, never fabricated data.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/onboard.md"], "author": "pbakaus"}, {"id": "v-clarify", "label": "clarify", "kind": "verb", "what": "Improves UX copy: labels, errors, status words and instructions.", "when": "Routed for `confusing-copy` in the refine loop; also dispatched by /super-board lint for copy or error-message ACs.", "how": "Fix tier; refinement keeps the meaning of factual copy and never adds claims.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/clarify.md"], "author": "pbakaus"}, {"id": "v-harden", "label": "harden", "kind": "verb", "what": "Production-readiness: long content, errors, loading, i18n, overflow, and accessibility (contrast, focus, names, keyboard).", "when": "Routed for problems typed `edge-cases` or `accessibility`.", "how": "Fix tier; the only verb two problem types share in routing.md.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/harden.md"], "author": "pbakaus"}, {"id": "v-animate", "label": "animate", "kind": "verb", "what": "Adds purposeful motion and state-change feedback.", "when": "Routed for `needs-motion`, only when the brief or direction asks for motion.", "how": "Additive last-tier verb; delight may call it.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/animate.md"], "author": "pbakaus"}, {"id": "v-delight", "label": "delight", "kind": "verb", "what": "Adds personality and memorable touches to a correct but lifeless surface.", "when": "Routed for `personality`, only when the brief asks for character.", "how": "Additive last-tier verb that calls animate for motion; followed by polish.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/delight.md"], "author": "pbakaus"}, {"id": "v-extract", "label": "extract", "kind": "verb", "what": "Pulls repeated UI into shared tokens and components.", "when": "Routed for `drift`: the same pattern copied 3+ times, raw values next to tokens, one-off components.", "how": "Structural tier, first in the chain; shared components change only behind a new prop that defaults to today's behaviour.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/extract.md"], "author": "pbakaus"}, {"id": "v-shape", "label": "shape", "kind": "verb", "what": "Plans UX/UI for a feature before code is written.", "when": "Dispatched by /super-board lint for feature tickets with undefined UX; never typed as a refine-loop problem.", "how": "Requires init's PRODUCT.md; a redesign need found in the loop goes to openQuestions instead.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/shape.md"], "author": "pbakaus"}, {"id": "v-init", "label": "init", "kind": "verb", "what": "Captures durable product context in PRODUCT.md.", "when": "Suggested by /impeccable when PRODUCT.md is missing; not run by the refine loop.", "how": "Shape and document require it; its context feeds live mode.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/init.md"], "author": "pbakaus"}, {"id": "v-document", "label": "document", "kind": "verb", "what": "Generates DESIGN.md from existing project code.", "when": "When DESIGN.md is missing; the refine loop reads DESIGN.md if present but never runs this.", "how": "Requires init; doctor feeds it when files go stale.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/document.md"], "author": "pbakaus"}, {"id": "v-live", "label": "live", "kind": "verb", "what": "Visual variant mode: pick elements in the browser and generate alternatives.", "when": "Interactive iteration only; the refine loop forbids it as a problem type.", "how": "Fed by init's context and calls polish on the chosen variant.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/live.md"], "author": "pbakaus"}, {"id": "v-overdrive", "label": "overdrive", "kind": "verb", "what": "Pushes a design past conventional limits for a wow factor.", "when": "Interactive only; the refine loop never types a problem as overdrive.", "how": "A redesign-scale command, so the checker sends such needs to openQuestions.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/overdrive.md"], "author": "pbakaus"}, {"id": "preflight", "label": "super-board-preflight.sh", "kind": "script", "what": "Builder pre-flight check: is a Ready card already done, already in progress, overlapping an open PR's files, or unclear?", "when": "Run once per batch of up to 5 Ready build cards by the wave's Pre-flight agent (or by the Builder as step 0 on the legacy backend), before any worktree.", "how": "Prints mechanical verdicts and near-miss candidates; the agent adds 'too big' and semantic matches, then returns proceed, hold, sequence or skipped. Hold and sequence move the card to Blocked with the block template; skipped leaves it in Ready.", "source": ["_skills/vendor/super-board/scripts/super-board-preflight.sh", "_skills/vendor/super-board/skills/super-board/references/run.md"]}, {"id": "pr-body", "label": "super-board-pr-body.sh", "kind": "script", "what": "Rewrites one marker block of a PR body (redcheck, status, problem, solution, ac, history, visual, risk) without clobbering other lanes' blocks.", "when": "Called by every lane when it updates its part of the PR, and with --skeleton by ui-refine-loop for a fresh body.", "how": "`--pr N --block <name> --expect-head <sha>` with --body-file or --append-file (history rows); `--time` prints local time in the config's timezone.", "source": ["_skills/vendor/super-board/scripts/super-board-pr-body.sh", "_skills/vendor/super-board/skills/super-board/references/writing-standard.md"]}, {"id": "needs-you", "label": "Blocked · 🙋 needs you", "kind": "board", "what": "A card parked in Blocked with the 🙋 template and the `needs-you` label: a step only a human may take. There is no separate column.", "when": "The merge gate exits 7 (merge_policy: money, auth, destructive schema, over 400 lines) or 8 (a migration the robot may not run, or a declared human step).", "how": "The comment opens \"🙋 Your turn on #N\" with the exact commands as checkboxes; a human merges it, or comments `done` / labels `needs-you:done` so the planner's resume list sends it back to Review.", "source": ["_skills/vendor/super-board/skills/super-board/references/block-template.md", "_skills/vendor/super-board/skills/super-board/references/run.md"]}, {"id": "setup-py", "label": "super-board-setup.py", "kind": "script", "what": "The deterministic half of onboard: finds what is missing or old and fixes the must-haves, and handles boards and branches.", "when": "Run by onboard step 1 (check / fix), step 3 (board-rank, board-migrate, names) and step 4 (branch).", "how": "`fix` installs or refreshes skills, scripts, workflows, guard hooks and settings (via install.sh), removes super-refine / cleanup-wt / arch-loop folders, migrates config keys to v3, runs git init and adds Matt Pocock's skills, all backed up first. `board-migrate` adds missing columns and the three labels and moves Skipped cards to Done.", "source": ["_skills/vendor/super-board/scripts/super-board-setup.py"]}, {"id": "agents-md-py", "label": "super-board-agents-md.py", "kind": "script", "what": "The deterministic half of the AGENTS.md step: detect, backup, the managed super-board block, the CLAUDE.md pointer, coverage and size checks.", "when": "Run by onboard step 5 to stage the merge and at step 8 to write it; install.sh refreshes the managed block on re-install.", "how": "The agent merges rules semantically (duplicates once, conflicts asked one by one); the script proves every rule unit maps to a line (`coverage`), keeps AGENTS.md ≤ 200 lines with one marker pair, and writes atomically.", "source": ["_skills/vendor/super-board/scripts/super-board-agents-md.py", "_skills/vendor/super-board/skills/super-board/references/agents-md-block.md", "_skills/vendor/super-board/skills/super-board/references/onboard.md"]}, {"id": "agents-file", "label": "AGENTS.md + CLAUDE.md", "kind": "board", "what": "The project's instruction files: AGENTS.md as the single source of truth with a managed super-board block, and CLAUDE.md as `@AGENTS.md` plus Claude-only rules.", "when": "Written at onboard step 8 when Eric chose to move his rules (or only add the section); the block is rewritten on re-install.", "how": "The block sits between `<!-- super-board:begin -->` and `<!-- super-board:end -->`, rendered from agents-md-block.md with a Writing table that links the writing standard; nothing outside the markers is touched.", "source": ["_skills/vendor/super-board/skills/super-board/references/agents-md-block.md", "_skills/vendor/super-board/skills/super-board/references/onboard.md"]}, {"id": "settings-py", "label": "super-board-settings.py", "kind": "script", "what": "Merges hook blocks and permission allow rules into .claude/settings.json without losing anything.", "when": "Run by install.sh for the guard hooks, and by onboard step 6/8 for the permission lines and the protect-main hook.", "how": "`hooks <settings> <snippet>` and `allow <settings> <rules…>` keep every existing key, back the file up, write atomically, and leave an invalid settings.json untouched; `--dry-run` prints the diff onboard shows as \"N lines\".", "source": ["_skills/vendor/super-board/scripts/super-board-settings.py"]}, {"id": "env-check", "label": "super-board-env-check.sh", "kind": "script", "what": "Says which env keys exist (present, empty or missing) without ever printing a value.", "when": "Run by onboard to detect SENTRY_AUTH_TOKEN, POSTHOG_PERSONAL_API_KEY or migration DB URLs, and allowed in permissions for runs.", "how": "Reads .env.local or .env itself and prints one word per key; guard-secrets lets a plain call through while still blocking cat, grep or source on dotenv files.", "source": ["_skills/vendor/super-board/scripts/super-board-env-check.sh", "_skills/vendor/super-board/hooks/guard-secrets.py"]}, {"id": "collect-custom", "label": "custom source fetcher", "kind": "script", "what": "The custom source: extra sources a project added in onboard (an http API, a CLI command, or an MCP server), stored in collect.custom[].", "when": "Run by onboard step 7 (classify, ping, add) and by /super-collect for every custom source (list, normalize).", "how": "`collect_custom.py` classifies the typed text, pings read-only before saving, refuses commands that look like they change something, and turns output into candidates with fp `custom|<name>|<key>`. MCP reads go through the agent and `normalize`.", "source": ["_skills/vendor/super-board/skills/super-collect/scripts/collect_custom.py"]}, {"id": "get-sh", "label": "get.sh", "kind": "script", "what": "One-line installer: `curl -fsSL …/get.sh | bash` fetches the latest super-board release and runs install.sh.", "when": "Eric (or a user) runs it in a project folder to install or upgrade; options --target, --ref, --no-helper-skills, and --no-hooks / --protect-main passed through.", "how": "Downloads the release tarball, runs install.sh, adds Matt Pocock's skills via `npx skills@latest add mattpocock/skills` unless told not to, and prints the next step once.", "source": ["_skills/vendor/super-board/get.sh"]}, {"id": "plugin-mkt", "label": "plugin marketplace install", "kind": "board", "what": "The Claude Code plugin form of the pack (marketplace.json + plugin.json): ships the seven skills only.", "when": "A user adds the marketplace and installs the plugin instead of running get.sh.", "how": "Skills carry the plugin prefix (/super-board:super-board onboard); onboard step 1 then installs the guard hooks, .claude/bin scripts and workflows a plugin cannot ship from the plugin's own copy.", "source": ["_skills/vendor/super-board/.claude-plugin/marketplace.json", "_skills/vendor/super-board/.claude-plugin/plugin.json"]}, {"id": "onboard-answers", "label": "onboard answers file", "kind": "board", "what": "`.claude/super-board/onboard-answers.json`: every onboard answer, saved the moment it is given (gitignored).", "when": "Written after each answer; read when onboard re-runs or resumes after a halt.", "how": "Atomic writes; `last_step` drives the \"Continue where you left off?\" screen, and a finished setup's values fill the step-8 table on re-run.", "source": ["_skills/vendor/super-board/skills/super-board/references/onboard.md"]}, {"id": "upgrade-json", "label": "upgrade record", "kind": "board", "what": "`.claude/super-board/upgrade.json`: the version an install replaced, so onboard knows to upgrade a 2.x setup.", "when": "Written by install.sh (or get.sh) when it finds an older install         const lk0 = Math.log(from.k), lk1 = Math.log(dest.k);

      if (r.y - m < cy - hh) ny = r.y - m + hh; else if (r.y + r.h + m > cy + hh) ny = r.y + r.h + m - hh;

    onWheel(e) {

      e.preventDefault();

    }
    onDown(e) {
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      if (e.target.closest('.ctl, .minimap, button, a, input')) return;
      this.ptrs.set(e.pointerId, [e.clientX, e.clientY]);
      this.start = { x: e.clientX, y: e.clientY, s: { ...this.s }, dist: this.pinchDist() };

    pinchDist() { const p = [...this.ptrs.values()]; return p.length > 1 ? Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]) : 0; }

        const p = [...this.ptrs.values()], r = this.el.getBoundingClientRect();
        this.s = { ...this.start.s }; this.zoomAt(d / this.start.dist, (p[0][0] + p[1][0]) / 2 - r.left, (p[0][1] + p[1][1]) / 2 - r.top);
        this.dragged = true; return;
      }
      const dx = e.clientX - this.start.x, dy = e.clientY - this.start.y;
