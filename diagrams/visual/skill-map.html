<title>super-board skill map</title>

<style>
  /* Clean flowchart (GitHub Primer-like): light first, dark when the system or the toggle asks. */
  :root {
    --bg: #ffffff; --bg-2: #f6f8fa; --panel: #ffffff; --panel-2: #f6f8fa; --border: #d8dee4; --border-2: #d1d9e0;
    --text: #1f2328; --muted: #59636e; --dim: #818b98; --grid: rgba(31,35,40,.06); --mask: #ffffff; --arrow: #8c959f;
    --shadow: 0 8px 24px rgba(31,35,40,.10); --dot: #e6eaef; --gridline: transparent; --chrome: rgba(255,255,255,.94);
    --accent: #0969da; --accent-fg: #ffffff; --lane: rgba(31,35,40,.025);
    --cyan: #0969da; --green: #1a7f37; --violet: #8250df; --amber: #9a6700; --rose: #cf222e; --orange: #bc4c00; --slate: #59636e; --fuchsia: #bf3989;
    --k-public: #0969da; --k-lane: #0f766e; --k-ext: #8250df; --k-verb: #bf3989; --k-script: #6e7781; --k-hook: #cf222e; --k-board: #9a6700;
    --w-calls: #424a53; --w-feeds: #0969da; --w-triggers: #8250df; --w-state: #afb8c1; --w-guard: #cf222e;
    --add-bg: rgba(26,127,55,.10); --add-tx: #1a7f37; --del-bg: rgba(207,34,46,.08); --del-tx: #cf222e;
    color-scheme: light;
    --accent-f: color-mix(in srgb, var(--accent) 12%, var(--panel));
    --cyan-f: color-mix(in srgb, var(--cyan) 9%, var(--panel));
    --green-f: color-mix(in srgb, var(--green) 9%, var(--panel));
    --violet-f: color-mix(in srgb, var(--violet) 9%, var(--panel));
    --amber-f: color-mix(in srgb, var(--amber) 10%, var(--panel));
    --rose-f: color-mix(in srgb, var(--rose) 8%, var(--panel));
    --orange-f: color-mix(in srgb, var(--orange) 9%, var(--panel));
    --slate-f: color-mix(in srgb, var(--slate) 8%, var(--panel));
    --fuchsia-f: color-mix(in srgb, var(--fuchsia) 8%, var(--panel));
    --k-public-f: color-mix(in srgb, var(--k-public) 8%, var(--panel));
    --k-lane-f: color-mix(in srgb, var(--k-lane) 8%, var(--panel));
    --k-ext-f: color-mix(in srgb, var(--k-ext) 7%, var(--panel));
    --k-verb-f: color-mix(in srgb, var(--k-verb) 7%, var(--panel));
    --k-script-f: color-mix(in srgb, var(--k-script) 5%, var(--panel));
    --k-hook-f: color-mix(in srgb, var(--k-hook) 12%, var(--panel));
    --k-board-f: color-mix(in srgb, var(--k-board) 9%, var(--panel));
    --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {

    --bg: #0d1117; --bg-2: #010409; --panel: #0d1117; --panel-2: #151b23; --border: #262c36; --border-2: #3d444d;
    --text: #f0f6fc; --muted: #9198a1; --dim: #656c76; --grid: rgba(240,246,252,.05); --mask: #0d1117; --arrow: #656c76;
    --shadow: 0 10px 30px rgba(1,4,9,.55); --dot: #161b22; --gridline: transparent; --chrome: rgba(13,17,23,.92);
    --accent: #4493f8; --accent-fg: #ffffff; --lane: rgba(240,246,252,.025);
    --cyan: #4493f8; --green: #3fb950; --violet: #ab7df8; --amber: #d29922; --rose: #f85149; --orange: #db6d28; --slate: #9198a1; --fuchsia: #db61a2;
    --k-public: #4493f8; --k-lane: #2dd4bf; --k-ext: #ab7df8; --k-verb: #f778ba; --k-script: #9198a1; --k-hook: #f85149; --k-board: #d29922;
    --w-calls: #b7bdc8; --w-feeds: #4493f8; --w-triggers: #ab7df8; --w-state: #4d5562; --w-guard: #f85149;
    --add-bg: rgba(63,185,80,.13); --add-tx: #56d364; --del-bg: rgba(248,81,73,.12); --del-tx: #ff7b72;
    color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --bg-2: #010409; --panel: #0d1117; --panel-2: #151b23; --border: #262c36; --border-2: #3d444d;
    --text: #f0f6fc; --muted: #9198a1; --dim: #656c76; --grid: rgba(240,246,252,.05); --mask: #0d1117; --arrow: #656c76;
    --shadow: 0 10px 30px rgba(1,4,9,.55); --dot: #161b22; --gridline: transparent; --chrome: rgba(13,17,23,.92);
    --accent: #4493f8; --accent-fg: #ffffff; --lane: rgba(240,246,252,.025);
    --cyan: #4493f8; --green: #3fb950; --violet: #ab7df8; --amber: #d29922; --rose: #f85149; --orange: #db6d28; --slate: #9198a1; --fuchsia: #db61a2;
    --k-public: #4493f8; --k-lane: #2dd4bf; --k-ext: #ab7df8; --k-verb: #f778ba; --k-script: #9198a1; --k-hook: #f85149; --k-board: #d29922;
    --w-calls: #b7bdc8; --w-feeds: #4493f8; --w-triggers: #ab7df8; --w-state: #4d5562; --w-guard: #f85149;
    --add-bg: rgba(63,185,80,.13); --add-tx: #56d364; --del-bg: rgba(248,81,73,.12); --del-tx: #ff7b72;

  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 22px 22px; }
  a { color: var(--cyan); }
  code, .mono { font-family: var(--mono); font-size: .86em; }
  :not(pre) > code { overflow-wrap: anywhere; background: var(--panel-2); border: 1px solid var(--border); padding: .05em .35em; border-radius: 5px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 720px) { .wrap { padding: 0 32px; } }

  /* top bar */
  .bar { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(10px); background: color-mix(in srgb, var(--bg) 82%, transparent); border-bottom: 1px solid var(--border); }
  .bar .wrap { display: flex; align-items: center; gap: 14px; height: 50px; }
  .bar .brand { font: 700 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .bar nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  .bar nav a { color: var(--muted); text-decoration: none; font: 500 13px var(--sans); padding: 5px 10px; border-radius: 7px; white-space: nowrap; }
  .bar nav a:hover { color: var(--text); background: var(--panel); }
  .btn { background: var(--panel); border: 1px solid var(--border-2); color: var(--text); border-radius: 8px; height: 32px; padding: 0 12px; font: 500 13px var(--sans); cursor: pointer; }
  .btn:hover { border-color: var(--cyan); }
  .btn:focus-visible, button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  /* hero */
  header.hero { padding: 40px 0 8px; }
  .eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font: 600 12px var(--mono); color: var(--muted); }
  .kind { text-transform: uppercase; letter-spacing: .12em; font-weight: 700; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .kind.recap { color: var(--green); border-color: var(--green); background: var(--green-f); }
  .kind.plan { color: var(--cyan); border-color: var(--cyan); background: var(--cyan-f); }
  .kind.explore { color: var(--violet); border-color: var(--violet); background: var(--violet-f); }
  h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.15; letter-spacing: -.025em; margin: 14px 0 8px; font-weight: 700; }
  .sub { color: var(--muted); font-size: 16px; margin: 0 0 18px; max-width: 820px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat { display: flex; align-items: baseline; gap: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 7px 12px; }
  .stat b { font: 700 17px var(--mono); }
  .stat span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .stat.add b { color: var(--green); } .stat.del b { color: var(--rose); }

  section { padding: 26px 0 8px; scroll-margin-top: 60px; }
  h2 { font: 700 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  h2 .count { color: var(--dim); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; }
  .prose p { margin: 0 0 12px; max-width: 860px; } .prose p:last-child { margin-bottom: 0; }
  .prose ul { margin: 0 0 12px; padding-left: 20px; }
  .summary { padding: 20px 22px; font-size: 16px; }

  /* key changes + files */
  .split { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 980px) { .split { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } .split > aside { position: sticky; top: 64px; } }
  .changes { display: grid; gap: 10px; }
  .change { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 16px 18px; }
  .change .num { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font: 700 13px var(--mono); background: var(--panel-2); border: 1px solid var(--border-2); color: var(--muted); }
  .change h3 { margin: 2px 0 4px; font-size: 16px; line-height: 1.35; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .change .detail { color: var(--muted); font-size: 14.5px; }
  .tag { font: 700 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; }
  .t-added, .t-new, .t-add { color: var(--green); } .t-changed, .t-modified, .t-change { color: var(--cyan); } .t-removed, .t-delete { color: var(--rose); }
  .t-fix { color: var(--amber); } .t-refactor { color: var(--violet); } .t-docs, .t-chore { color: var(--slate); } .t-risk { color: var(--orange); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font: 500 12px var(--mono); color: var(--muted); background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .chip:hover { color: var(--text); border-color: var(--cyan); }

  .files { padding: 6px 0; overflow: hidden; }
  .files .head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 8px; font: 600 12px var(--mono); color: var(--muted); }
  .area { border-top: 1px solid var(--border); }
  .area > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 9px 16px; font: 600 12.5px var(--mono); color: var(--text); }
  .area > summary::-webkit-details-marker { display: none; }
  .area > summary::before { content: "▸"; color: var(--dim); transition: transform .15s; }
  .area[open] > summary::before { transform: rotate(90deg); }
  .area > summary .n { margin-left: auto; font-weight: 500; }
  .frow { display: grid; grid-template-columns: 20px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 5px 16px 5px 30px; font: 12.5px var(--mono); cursor: default; }
  .frow.link { cursor: pointer; } .frow.link:hover, .frow.hl { background: var(--panel-2); }
  .frow .st { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font-size: 10px; font-weight: 700; border: 1px solid currentColor; }
  .st.A { color: var(--green); } .st.M { color: var(--amber); } .st.D { color: var(--rose); } .st.R { color: var(--violet); }
  .frow .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .frow .p bdi { direction: ltr; } .frow .p .dir { color: var(--dim); }
  .frow .ad { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .plus { color: var(--green); } .minus { color: var(--rose); }
  .blocks { display: inline-flex; gap: 2px; } .blocks i { width: 7px; height: 7px; border-radius: 2px; background: var(--border-2); }
  .blocks i.g { background: var(--green); } .blocks i.r { background: var(--rose); }
  .fnote { grid-column: 2 / 4; color: var(--muted); font: 12.5px/1.45 var(--sans); margin-top: -2px; }

  /* diagrams */
  figure.dia { margin: 0 0 18px; padding: 18px 18px 14px; overflow: hidden; }
  @media (min-width: 1300px) { #diagram { position: relative; left: 50%; transform: translateX(-50%); width: min(1640px, calc(100vw - 64px)); } }
  figure.dia figcaption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 18px; margin-bottom: 10px; }
  figure.dia .ft { font-weight: 600; font-size: 16px; }
  figure.dia .fc { color: var(--muted); font-size: 14px; margin-top: 10px; }
  .canvas { position: relative; overflow: hidden; border-radius: 10px; border: 1px solid var(--border); background-color: var(--bg-2); touch-action: none; cursor: grab; outline: none;
    background-image: radial-gradient(circle, var(--dot) 1.1px, transparent 1.4px), linear-gradient(var(--gridline) 1px, transparent 1px), linear-gradient(90deg, var(--gridline) 1px, transparent 1px); }
  .canvas:focus-visible { box-shadow: 0 0 0 2px var(--cyan); }
  .canvas.grabbing, .stage.grabbing { cursor: grabbing; }
  .canvas svg { display: block; position: absolute; inset: 0; }
  .canvas.full { position: fixed; inset: 12px; z-index: 60; border-radius: 14px; box-shadow: var(--shadow); height: auto !important; }
  body.noscroll { overflow: hidden; }
  .cam-hint { position: absolute; left: 10px; bottom: 8px; font: 500 11px var(--mono); color: var(--dim); pointer-events: none; opacity: 0; transition: opacity .2s; }
  .canvas:hover .cam-hint { opacity: 1; }
  .ctl { position: absolute; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 11px; background: var(--chrome); border: 1px solid var(--border-2); box-shadow: var(--shadow); backdrop-filter: blur(10px); z-index: 4; }
  .ctl button { min-width: 30px; height: 28px; border: 0; background: none; color: var(--text); font: 600 13px var(--mono); border-radius: 8px; cursor: pointer; padding: 0 7px; }
  .ctl button:hover:not(:disabled) { background: var(--panel-2); color: var(--cyan); }
  .ctl button:disabled { opacity: .35; cursor: default; }
  .ctl .pct { min-width: 54px; font-weight: 500; color: var(--muted); }
  .ctl .sep { width: 1px; height: 18px; background: var(--border-2); margin: 0 3px; }
  .ctl .depth { font: 700 10px var(--mono); letter-spacing: .12em; color: var(--dim); padding: 0 8px; }
  .mini-ctl { opacity: .0; transition: opacity .2s; } .canvas:hover .mini-ctl, .canvas:focus-within .mini-ctl, .canvas.full .mini-ctl { opacity: 1; }
  @media (hover: none) { .mini-ctl { opacity: 1; } }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 600 11px var(--mono); color: var(--muted); align-items: center; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; border: 1.5px solid; margin-right: 6px; vertical-align: -1px; }
  svg .n-mask { fill: var(--mask); }
  svg .n-body { stroke-width: 1.5; transition: stroke-width .15s, filter .15s; }
  svg .n-label { fill: var(--text); font: 600 13px var(--mono); letter-spacing: -.01em; }
  svg .n-sub { fill: var(--muted); font: 10px var(--mono); }
  svg .e-label { fill: var(--muted); font: 600 10px var(--mono); }
  svg .e-lbg { fill: var(--bg-2); stroke: var(--border); }
  svg .g-label { font: 700 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
  svg .badge-tx { font: 700 8.5px var(--mono); letter-spacing: .08em; }
  svg .edge { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: stroke-width .15s, opacity .2s; }
  svg .halo { fill: none; stroke: var(--bg-2); stroke-width: 6; }
  svg .hitline { fill: none; stroke: transparent; stroke-width: 12; }
  svg .flowline { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 10 70; opacity: 0; pointer-events: none; }
  .flowing svg .flowline { opacity: .9; animation: flowdash 2.4s linear infinite; }
  .flowing svg .edge { opacity: .8; }
  @keyframes flowdash { to { stroke-dashoffset: -160; } }
  /* intake badges and the view tour: a ticket dot rides the loop while flow is on */
  svg .intake-chip { fill: #fff; stroke: var(--border-2); stroke-width: 1.2; }
  svg .intake-tx { fill: var(--muted); font: 600 10.5px var(--sans); }
  svg .intake-chip.dashed { fill: var(--panel); stroke: var(--w-feeds); stroke-dasharray: 3 3; }
  svg .intake-mark { fill: #1b1f23; font: 700 13px var(--sans); }
  svg .intake-chip.dashed + .intake-mark { fill: var(--w-feeds); }
  svg .tour, svg .tour-glow { display: none; pointer-events: none; }
  .flowing svg .tour, .flowing svg .tour-glow { display: inline; }
  svg .tour-glow { fill: none; stroke-width: 7; stroke-linecap: round; filter: blur(2.5px); }
  svg .tour-dot { fill: var(--w-feeds); stroke: var(--bg-2); stroke-width: 1.5; filter: drop-shadow(0 0 6px var(--w-feeds)); }
  svg .tour-packet { fill: var(--w-feeds); }
  .flowing svg .node.tour-stop { transform-box: fill-box; transform-origin: center; animation: tour-pulse 8s ease-in-out infinite; }
  @keyframes tour-pulse { 0%, 9%, 100% { transform: none; filter: none; } 4% { transform: scale(1.04); filter: drop-shadow(0 0 10px color-mix(in srgb, var(--w-feeds) 60%, transparent)); } }
  .flowing svg .edge-g.back .edge { animation: march 1.1s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -22; } }
  @media (prefers-reduced-motion: reduce) { svg .tour, svg .tour-glow { display: none !important; } .flowing svg .node.tour-stop, .flowing svg .edge-g.back .edge { animation: none; } }
  @media (prefers-reduced-motion: reduce) { .flowing svg .flowline { animation: none; opacity: 0; } .flowing svg .edge { opacity: 1; } }
  .ctl button.on { color: var(--cyan); background: var(--cyan-f); }
  svg .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -12; } }
  @media (prefers-reduced-motion: reduce) { svg .flow { animation: none; } }
  /* reading depths (archify): far out = shapes + names; closer = subs, verbs, edge labels */
  .depth-read { transition: opacity .18s; }
  [data-depth="map"] .depth-read { opacity: 0; pointer-events: none; }
  /* typed node styles (map) */
  svg .node { cursor: pointer; outline: none; }
  svg .node .n-ring { fill: none; stroke-width: 1.2; stroke-opacity: .38; }
  svg .node.pub .n-body { stroke-width: 2.6; }
  svg .node.pub .n-label { font-weight: 700; }
  svg .node.priv .n-body { stroke-width: 1; stroke-opacity: .7; fill-opacity: .5; }
  svg .node.priv .n-label { fill: var(--muted); font-weight: 500; font-size: 11.5px !important; }
  svg .node.priv .n-sub { display: none; }
  svg .node.priv .n-sigil { opacity: .7; }
  svg .node .n-stack { fill: var(--mask); stroke-width: 1; stroke-opacity: .45; }
  svg .node .ini-tx { font: 700 7.5px var(--mono); }
  svg .node .tab-tx { font: 800 8px var(--mono); letter-spacing: .14em; fill: var(--mask); }
  svg .node .verb-chip { fill: var(--mask); stroke-width: .9; stroke-opacity: .6; }
  svg .node .verb-tx { font: 600 9.5px var(--mono); }
  svg .node.subject .n-body { stroke-dasharray: none; filter: drop-shadow(0 0 10px color-mix(in srgb, currentColor 0%, transparent)); }
  svg .node:hover .n-body, svg .node:focus-visible .n-body { stroke-width: 3; }
  svg .node.priv:hover .n-body { stroke-opacity: 1; }
  svg .node.priv:hover .n-label { fill: var(--text); }
  svg .node:focus-visible .n-mask { stroke: var(--cyan); stroke-width: 3; }
  svg .edge-g.hov .edge, svg .edge-g.hot .edge { stroke-width: 2.6; }
  .focusing svg .node:not(.sel):not(.nb) { opacity: .28; }
  .focusing svg .edge-g:not(.hot) { opacity: .15; }
  .focusing svg .e-lab:not(.hot) { opacity: .15; }
  svg .node, svg .edge-g, svg .e-lab { transition: opacity .2s; }
  svg .node.sel .n-body { stroke-width: 3.2; }
  svg .node.sel .n-mask { stroke: var(--accent); stroke-width: 2; }

  .links { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 22px; }

  /* phone: still a map; the header folds to one line and details slide up from the bottom */
  @media (max-width: 820px) {

  .diff td.ln { color: var(--dim); text-align: right; user-select: none; width: 1%; padding: 0 8px; }

  .diff td.mk { width: 1%; padding: 0 4px; }
  .diff tr.add { background: var(--add-bg); } .diff tr.add td.code, .diff tr.add td.sg { color: var(--add-tx); }
  .diff tr.del { background: var(--del-bg); } .diff tr.del td.code, .diff tr.del td.sg { color: var(--del-tx); }
  .diff tr.hdr td { color: var(--violet); background: var(--panel-2); padding: 3px 10px; }
  .diff.newfile tr.add { background: none; } .diff.newfile tr.add td.code { color: var(--text); } .diff.newfile td.sg, .diff.newfile td.ln.o { display: none; }
  .diff tr.noted td.code { box-shadow: inset 2px 0 0 var(--amber); }
  .pin { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--amber); color: #111; font: 700 10px var(--mono); }
  .notes { border-top: 1px solid var(--border); padding: 12px 16px; display: grid; gap: 10px; align-content: start; }
  @media (min-width: 1000px) { .notes { border-left: 1px solid var(--border); } }
  .note { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 14px; color: var(--muted); }
  .note b { color: var(--text); font-weight: 600; }
  .more { padding: 8px 18px; color: var(--dim); font: 12px var(--mono); border-top: 1px solid var(--border); }

  /* risks / tests / questions */

  @media (min-width: 900px) { .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

  .lvl { font: 700 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; margin-top: 2px; }
  .lvl.high { color: var(--rose); } .lvl.med, .lvl.medium { color: var(--amber); } .lvl.low { color: var(--green); }
  .li input { width: 16px; height: 16px; margin-top: 3px; accent-color: var(--green); }
  .li .cmd { display: block; margin-top: 4px; color: var(--muted); }
  .q { padding: 14px 18px; border-top: 1px solid var(--border); } .q:first-child { border-top: none; }
  .q .qq { font-weight: 600; } .q .qd { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .q .qd b { color: var(--green); font-weight: 600; }
  footer { padding: 34px 0 44px; color: var(--dim); font: 12px var(--mono); }
  .empty { color: var(--dim); padding: 14px 18px; }

//github.com/EricTechPro/super-board/blob/main/skills/super-board/references/run.md"], "verbs": ["--low", "--high"], "opensView": "super-board-run", "author": "EricTechPro"}, {"id": "sb-stop", "label": "/super-board stop", "kind": "public", "what": "Graceful shutdown: stops the wave, posts \"stopped mid-flight\" comments, releases assignee claims, and removes the wave lock so the next run resumes.", "when": "Eric runs /super-board stop or says \"stop the run\" / \"pause the loop\".", "how": "Stops the workflow (or kills the legacy dispatcher via super-board-stop.sh), comments on every in-flight issue and PR, and strips bot_identity assignees. Resume is just `run` again.", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/super-board/references/stop.md", "https://github.com/EricTechPro/super-board/blob/main/scripts/super-board-stop.sh"], "author": "EricTechPro"}, {"id": "super-build", "label": "super-build", "kind": "lane", "what": "Builder lane: takes a pre-flighted Ready card into its own worktree, makes the smallest safe change test-first under the 400-line PR cap, opens a draft PR and moves the card to QA. It never merges.", "when": "Started by the board: the super-board-wave workflow runs it for Ready cards labelled feature or bug (or unlabelled) once pre-flight says proceed. Also runnable standalone as /super-build (legacy headless claude -p dispatch).", "how": "Follows run.md's Builder lifecycle. An explicit `Skills:` line wins, else the type label picks the chain, always plus ponytail first, verification-before-completion and a code-review of its own diff. Past the size cap mid-build it stops and proposes a /to-tickets split. Commits and PR blocks follow the writing standard via super-board-pr-body.sh.", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/super-build/SKILL.md", "https://github.com/EricTechPro/super-board/blob/main/skills/super-build/references/decision-policy.md", "https://github.com/EricTechPro/super-board/blob/main/skills/super-build/references/worker-preamble.md", "https://github.com/EricTechPro/super-board/blob/main/skills/super-board/references/run.md"], "opensView": "super-build", "author": "EricTechPro"}, {"id": "super-qa", "label": "super-qa", "kind": "lane", "what": "Tester lane: builds an issue-scoped test plan, runs a test-gap check on the Builder's diff, captures evidence and screenshots, then passes the card to Review or bounces it to Build.", "when": "Started by the board for cards in QA, and straight from Ready for cards labelled qa (they skip Building). Also runnable standalone as /super-qa, a BFS route-crawling bug-bash, or /super-qa <url> for a live site with no repo.", "how": "One observable test per AC plus the test-gap ledger, High gaps written red-first. On a qa card it creates the issue branch itself and files real defects as bug cards. It ticks the PR's ac block, writes visual and history rows with super-board-pr-body.sh, and posts `[qa] [report]` comments with screenshots pinned to a sha.", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/super-qa/SKILL.md", "https://github.com/EricTechPro/super-board/blob/main/skills/super-qa/references/iteration-preamble.md", "https://github.com/EricTechPro/super-board/blob/main/skills/super-board/references/run.md"], "opensView": "super-qa", "author": "EricTechPro"}, {"id": "super-review", "label": "super-review", "kind": "lane", "what": "Reviewer lane and standalone PR review: forms its own hypotheses first, remembers prior findings, classes every finding, and merges only through the merge gate.", "when": "Started by the board for cards in Review (always on the session model). Also runnable standalone when Eric says \"review this branch\" or \"is this merge-ready\".", "how": "Thread scan, prior-report round 1, own pass with code-review, codebase-design and ponytail-review, a rerun of the Tester's exact test command, then an adversarial truth-check on non-trivial diffs. One report comment is edited in place every round. A clean review merges through the gate pinned to the reviewed head SHA; exit 7 or 8 parks the card in Blocked with 🙋. Visual problems become a UI ticket, never a ui-refine-loop run. The truth-check sub-agents get a fixed verbatim brief, and Over-engineering is never a Blocker from any of them.", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/super-review/SKILL.md"], "opensView": "super-review", "author": "EricTechPro"}, {"id": "gh-board", "label": "GitHub Project board", "kind": "board", "what": "The configured GitHub Project with seven columns (Backlog, Ready, Building, QA, Review, Blocked, Done) and three routing labels (qa, bug, feature); the only loop state. There is no Skipped column.", "when": "Read and written on every wave, by every lane move, and by /super-collect filing into Backlog.", "how": "Cards move by `gh project item-edit`; assignees act as claim mutexes; PR threads start with their owner lane [builder] / [qa] / [reviewer] plus a label. A card dropped on purpose is closed as not planned and moved to Done with a 🤷 comment.", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/super-board/references/run.md", "https://github.com/EricTechPro/super-board/blob/main/skills/super-board/references/run-workflow.md"]}, {"id": "sb-config", "label": "super-board config", "kind": "board", "what": "Per-project JSON config: board, base branch, timezone, the seven columns, labels, merge_policy, migrations, worker backend, model tier, truth gate, plus `collect` (sources and custom[]) and `refine` blocks. No `variant` key.", "when": "Written once by onboard at step 8 (and migrated to v3 keys by super-board-setup.py fix); read at the start of every run, collect and ui-refine-loop setup.", "how": "Lives at `.claude/super-board/configs/<slug>.json` with `.claude/super-board/active` pointing at it, validated against config-schema.json.", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/super-board/references/config-schema.json"]}, {"id": "base-branch", "label": "repo · base branch", "kind": "board", "what": "The project's git repo and configured base branch (never assumed to be main); a card is Done only when its merge commit is an ancestor of it.", "when": "Changed only by a merge-gate squash-merge; read by /visual and branched from by every worktree.", "how": "Lanes and ui-refine-loop work on their own branches under .worktrees/ or .claude/worktrees/; the opt-in protected-push guard can block direct pushes to it.", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/super-review/SKILL.md", "https://github.com/EricTechPro/super-board/blob/main/skills/super-board/references/run.md"]}, {"id": "run-manifest", "label": "run manifest", "kind": "board", "what": "Per-run ledger at `docs/super-board/runs/<date>-<slug>.md`, one line per card per wave.", "when": "Appended during each wave's reconcile step.", "how": "Each line records card, lanes run, final status, column and detail: `| #N | <lanesRun> | <finalStatus> | <column> | <detail> |`.", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/super-board/references/run-workflow.md"]}, {"id": "qa-board", "label": "Super Ultimate QA board", "kind": "board", "what": "Separate GitHub Project (Queue, Testing, Done, Bug, Flaky, Skip) used by standalone /super-qa as its loop state.", "when": "Written when a standalone super-qa iteration finds a red spec; /super-collect bugs and qa-card defects also go through the same filer.", "how": "super-qa-file-bug.sh creates a `source:qa` issue with the evidence body and sets its Status to Bug (Flaky and Skip for the other outcomes).", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/super-qa/SKILL.md"]}, {"id": "taste-file", "label": "taste + direction file", "kind": "board", "what": "Per-project design taste file (default `docs/design/taste.md`) holding the grill's goal, direction, keep and avoid answers plus taste rules and slop tells.", "when": "Written after the grill and committed as the refine branch's first commit; read first by every checker, fixer and finish reviewer.", "how": "Starts from the neutral references/taste.md when absent; each target gets a `### <target>` block under Direction, with \"you pick\" answers marked (picked).", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/ui-refine-loop/references/grill.md", "https://github.com/EricTechPro/super-board/blob/main/skills/ui-refine-loop/references/taste.md"]}, {"id": "refine-ledger", "label": "refine ledger", "kind": "board", "what": "The only memory carried between refine rounds: one line per check with score /40, before-vs-now, and problem ids.", "when": "Appended by the workflow after every check; written to `<run>/ledger.md` at finish.", "how": "Checkers reuse ledger ids so a problem that survives three checks is called out; stop rules read it (two clean checks, two reverts in a row).", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/ui-refine-loop/references/ledger.md"]}, {"id": "draft-pr", "label": "refine draft PR", "kind": "board", "what": "The draft PR from `refine/<slug>` against the recorded base branch, with a Before | After table, score line and finish grades.", "when": "Opened once at the end of a ui-refine-loop run; never merged by the loop.", "how": "pr-shots.sh commits round-0 and final shots to `docs/ui-refine/<slug>/` and prints a Before | After table pinned to both shas; the body uses the writing standard's marker blocks (status, problem, solution, ac, history, visual, risk) and is humanized before `gh pr create --draft`.", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/ui-refine-loop/SKILL.md", "https://github.com/EricTechPro/super-board/blob/main/skills/ui-refine-loop/scripts/pr-shots.sh"]}, {"id": "gh-issues", "label": "open GitHub issues", "kind": "board", "what": "The repo's open issues that are not yet on the board and carry no `source:*` label.", "when": "Read by the /super-collect github source.", "how": "Fetched with `gh issue list --state open`; real work is adopted onto the board (`--adopt <n>`), never copied into a new issue.", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/super-collect/SKILL.md"]}, {"id": "claude-settings", "label": ".claude/settings.json", "kind": "board", "what": "The target project's Claude Code settings, where install.sh merges the guard hook block from settings-snippet.json.", "when": "Written by install.sh (backed up first, never adding a command twice); read by Claude Code at every session.", "how": "Wires PreToolUse, PostToolUse and SessionStart commands to the scripts copied into `.claude/hooks/`; `--protect-main` adds settings-protect-main.json.", "source": ["https://github.com/EricTechPro/super-board/blob/main/hooks/settings-snippet.json", "https://github.com/EricTechPro/super-board/blob/main/hooks/settings-protect-main.json", "https://github.com/EricTechPro/super-board/blob/main/install.sh"]}, {"id": "hooks", "label": "guard hooks", "kind": "hook", "what": "The pack's Claude Code hooks: four default guards, an opt-in push guard, post-merge worktree cleanup, and two dev-only hooks for the pack itself.", "when": "Installed by install.sh unless --no-hooks; each fires on its Claude Code event and matcher.", "how": "Python 3 stdlib scripts that read hook JSON on stdin, print a decision only when they block, and exit 0 on their own errors so a broken guard never stops work.", "source": ["https://github.com/EricTechPro/super-board/blob/main/hooks/README.md"], "opensView": "hooks"}, {"id": "guard-worktree-path", "label": "guard-worktree-path", "kind": "hook", "what": "Denies `git worktree add|move` whose target resolves outside `<repo>/.claude/worktrees/`.", "when": "PreToolUse, matcher Bash, on every shell command.", "how": "Parses the command, honouring `cd X &&` and `git -C X`, resolves the target path, and blocks when it escapes the worktrees folder.", "source": ["https://github.com/EricTechPro/super-board/blob/main/hooks/guard-worktree-path.py"]}, {"id": "guard-secrets", "label": "guard-secrets", "kind": "hook", "what": "Denies reading or piping dotenv files, SSH keys, .npmrc, credentials(.json), service-account JSON and .pem files; .env.example stays readable.", "when": "PreToolUse, matcher Bash|Read|Grep.", "how": "Matches file paths in Read/Grep input and in shell commands against secret-file patterns and blocks the call. One plain call to super-board-env-check.sh (no pipe, chain or redirect) is allowed, since it prints only present / empty / missing.", "source": ["https://github.com/EricTechPro/super-board/blob/main/hooks/guard-secrets.py"]}, {"id": "guard-key-literals", "label": "guard-key-literals", "kind": "hook", "what": "Stops a live-looking API key from being written into a file, and flags one already on disk.", "when": "PreToolUse on Edit|MultiEdit|Write|NotebookEdit|Bash, and PostToolUse on Edit|MultiEdit|Write|NotebookEdit.", "how": "Scans the content being written for key-shaped literals and reports line numbers only, never the value.", "source": ["https://github.com/EricTechPro/super-board/blob/main/hooks/guard-key-literals.py"]}, {"id": "guard-delete-outside", "label": "guard-delete-outside", "kind": "hook", "what": "Denies rm, rmdir, unlink, find -delete / -exec rm and git clean whose target resolves outside $CLAUDE_PROJECT_DIR, and always `/` or `~` itself.", "when": "PreToolUse, matcher Bash.", "how": "Resolves each target (honouring cd, git -C, ~ and $HOME); temp dirs stay allowed, and a path known only at run time is allowed.", "source": ["https://github.com/EricTechPro/super-board/blob/main/hooks/guard-delete-outside.py"]}, {"id": "guard-protected-push", "label": "guard-protected-push", "kind": "hook", "what": "Opt-in guard that denies a git push that would update or delete main, master, any configured base_branch, or a name in SB_PROTECTED_BRANCHES.", "when": "PreToolUse, matcher Bash, only after onboard's Policies yes (step 6) or `./install.sh --protect-main`.", "how": "Catches force pushes, explicit refspecs, --delete, --all/--mirror and a bare push while the base is checked out; feature-branch force pushes stay allowed. SB_ALLOW_PROTECTED_PUSH=1 turns it off for a session.", "source": ["https://github.com/EricTechPro/super-board/blob/main/hooks/guard-protected-push.py", "https://github.com/EricTechPro/super-board/blob/main/hooks/settings-protect-main.json"]}, {"id": "cleanup-wt", "label": "cleanup-wt", "kind": "hook", "what": "Removes worktrees and local branches already merged into a base branch; never deletes unmerged work.", "when": "SessionStart with `--auto --fetch` when a base tip moved since the last session, and after every merge when the merge gate calls it with `--post-merge`.", "how": "Wip-commits a dirty worktree on a merged branch and keeps its branch, never touches bases or its own worktree, and writes a recovery TSV under `<git-common-dir>/cleanup-wt/` before acting.", "source": ["https://github.com/EricTechPro/super-board/blob/main/hooks/cleanup-wt.py", "https://github.com/EricTechPro/super-board/blob/main/scripts/super-board-merge-gate.sh"]}, {"id": "gate-skill-evals", "label": "gate-skill-evals (dev)", "kind": "hook", "what": "Dev-only Stop hook that blocks ending a session when a skill changed and no `claude plugin eval` result is newer than the change.", "when": "Stop event in the pack's own `.claude/settings.json` (and EricOS if added by hand); never installed into target projects.", "how": "A changed SKILL.md always counts; a changed reference, script or workflow counts when the skill has an eval case. SKILL_EVAL_GATE=off, a running eval or `.claude/eval-gate-ignore` globs stand it down.", "source": ["https://github.com/EricTechPro/super-board/blob/main/hooks/dev/gate-skill-evals.py", "https://github.com/EricTechPro/super-board/blob/main/.claude/settings.json"]}, {"id": "readme-sync", "label": "readme-sync (dev)", "kind": "hook", "what": "Dev-only hooks that keep README.md's skill tables in step with skills/*/SKILL.md and families.json.", "when": "PostToolUse on Edit|Write|MultiEdit in the pack repo, and as a git pre-commit hook when it is symlinked in.", "how": "Runs super-board-readme-sync.py; the pre-commit version stops the commit when README.md had to change so it can be staged.", "source": ["https://github.com/EricTechPro/super-board/blob/main/.claude/settings.json", "https://github.com/EricTechPro/super-board/blob/main/hooks/pre-commit-readme.sh", "https://github.com/EricTechPro/super-board/blob/main/scripts/super-board-readme-sync.py"]}, {"id": "wave-plan", "label": "super-board-wave-plan.sh", "kind": "script", "what": "Read-only planner that computes the next wave from board state: cards (each with its lane and labels) plus the sweep, flag, stranded and resume lists.", "when": "Run by the orchestrator at the start of every wave, after the rate and usage guards pass.", "how": "Reads the board and `## Blocked by` dependencies (via super-board-deps.sh); a Ready card labelled qa gets lane qa, every other Ready card lane build. `resume` lists 🙋 cards a human approved with `done`. A `variant: qa-only` config is refused with exit 65.", "source": ["https://github.com/EricTechPro/super-board/blob/main/scripts/super-board-wave-plan.sh", "https://github.com/EricTechPro/super-board/blob/main/scripts/super-board-deps.sh"]}, {"id": "wave-js", "label": "super-board-wave.js", "kind": "script", "what": "Saved Workflow that drains one wave: a Pre-flight phase for cards about to be built, a haiku classify router, then Build, QA and Review lane agents per card.", "when": "Launched by /super-board run with {configPath, cards (with lane and labels), humanApprovesMerge, tier}; a stale `variant` other than full is refused.", "how": "Pre-flights Ready build cards in batches of 5 and never builds a card without a proceed verdict. The classifier keeps a card's qa/bug/feature label and adds feature or bug to unlabelled ones, never qa. A qa card goes Ready → QA. Model ladder by tier and complexity; Review always on the session model.", "source": ["https://github.com/EricTechPro/super-board/blob/main/workflows/super-board-wave.js"]}, {"id": "merge-gate", "label": "super-board-merge-gate.sh", "kind": "script", "what": "The only path to the base branch: takes an atomic mkdir lock, applies merge_policy, re-proves the branch against the current base inside the lock, runs allowed DB migrations, then squash-merges.", "when": "Called by the Reviewer once a review passes (and human_approves_merge is not set).", "how": "super-board-merge-policy.py decides who merges: money, auth, destructive schema or a diff over auto_max_lines (400 changed lines, lockfiles/generated/snapshots/migration SQL excluded) exits 7; a migration it may not run or a declared human step exits 8. Otherwise it merges with `--match-head-commit` (exit 6 when the head moved) and runs cleanup-wt --post-merge.", "source": ["https://github.com/EricTechPro/super-board/blob/main/scripts/super-board-merge-gate.sh", "https://github.com/EricTechPro/super-board/blob/main/scripts/super-board-merge-policy.py"]}, {"id": "file-bug", "label": "super-qa-file-bug.sh", "kind": "script", "what": "Files one finding as a GitHub issue with a validated body onto the Super Ultimate QA board.", "when": "Called by standalone super-qa on a red spec, and by super-collect-file.sh for bug, feature and fix tickets.", "how": "Rejects bodies missing the ticket-format sections (Problem · Context · Fix · Acceptance Criteria · Risk, bugs with the folded Evidence table) or holding placeholders; adds type, source, priority and area labels and sets the project Status, falling back through Bug, Ready, Todo, Backlog, Triage.", "source": ["https://github.com/EricTechPro/super-board/blob/main/scripts/super-qa-file-bug.sh"]}, {"id": "file-refactor", "label": "review-file-refactor.sh", "kind": "script", "what": "Files a deepening opportunity as a `refactor` card, deduped by fingerprint.", "when": "Called by super-review for shape findings that must not block a merge, and by super-collect-file.sh for architecture tickets.", "how": "A body with an `## Acceptance criteria` section goes straight to Ready; otherwise it lands in the holding column for lint. It appends `## Blocked by` when missing.", "source": ["https://github.com/EricTechPro/super-board/blob/main/scripts/super-review-file-refactor.sh"]}, {"id": "collect-file", "label": "super-collect-file.sh", "kind": "script", "what": "Single filing entry point for /super-collect that routes each verified ticket to the pack's filers.", "when": "Called once per candidate the verifier marked file or needs-triage (dry-run without --yes, real filing with it), or with --adopt <n>.", "how": "bug/feature/fix go to super-qa-file-bug.sh, refactor to super-review-file-refactor.sh, every body in the writing-standard ticket format. It enforces per-source fingerprints (custom `custom|<name>|<key>`), exact-fingerprint dedupe and the board's holding column.", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/super-collect/scripts/super-collect-file.sh"]}, {"id": "collect-sentry", "label": "sentry fetcher", "kind": "script", "what": "The sentry source: lists unresolved Sentry issues in the window and pulls event and tag evidence.", "when": "Run when /super-collect includes sentry and the config has a sentry block.", "how": "`collect_sentry.py list --since <w>` calls the Sentry REST API with SENTRY_AUTH_TOKEN from .env; `check <id>` answers still-happening for the verifier. One issue becomes one bug, fp `err|sentry|<id>`.", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/super-collect/scripts/collect_sentry.py"]}, {"id": "collect-posthog", "label": "posthog fetcher", "kind": "script", "what": "The posthog source: exceptions, configured failure events, rage and dead clicks, web vitals, surveys, plus tracking gaps.", "when": "Run when /super-collect includes posthog.", "how": "`collect_posthog.py list|events|funnel|check` runs HogQL queries with POSTHOG_PERSONAL_API_KEY; signal groups over the thresholds become bugs, and missing workflow events become `analytics` feature tickets.", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/super-collect/scripts/collect_posthog.py"]}, {"id": "collect-prs", "label": "prs fetcher", "kind": "script", "what": "The prs source: merged PRs in the window with their comments, reviews, review threads and flagged super-review reports.", "when": "Run when /super-collect includes prs.", "how": "`collect_prs.py list` runs one paginated GraphQL search; Claude then clusters recurring root causes at a shared boundary into fix, refactor or feature tickets (fp `prs|<boundary>|<cause>`).", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/super-collect/scripts/collect_prs.py"]}, {"id": "shoot", "label": "shoot.mjs", "kind": "script", "what": "Playwright screenshot script for the refine loop: light and dark at 1440 and 390, section crops, and before | after sheets.", "when": "Run for round-0 shots at setup and for AFTER shots at the end of every fix round.", "how": "Writes `<label>-<state>-<desktop|mobile>-<light|dark>.png` grown to the scroll height; `--compare round-0` adds cmp sheets the next checker judges.", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/ui-refine-loop/scripts/shoot.mjs"]}, {"id": "imp-detect", "label": "impeccable detect", "kind": "script", "what": "Impeccable's mechanical anti-pattern detector, run over every scope path holding markup or styles.", "when": "Run by the isolated detector sub-agent in every check, alongside the audit.", "how": "Invoked as `scripts/impeccable detect --json` (v4.4+) or `node scripts/detect.mjs --json` (v4.0.x), as found by refine-setup.sh detect; exit 2 means findings, which are checked in source for false positives.", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/ui-refine-loop/references/checker-brief.md", "https://github.com/EricTechPro/super-board/blob/main/skills/ui-refine-loop/scripts/refine-setup.sh"]}, {"id": "install-sh", "label": "install.sh", "kind": "script", "what": "Installs the pack into a target project: skills, .claude/bin scripts, workflows and the guard hooks, with grouped emoji output.", "when": "Run by get.sh, by super-board-setup.py fix during onboard, or by hand: `./install.sh [--no-hooks] [--protect-main] [target]`.", "how": "Copies hooks/*.py to `.claude/hooks/` (never hooks/dev/) and merges the hook block through super-board-settings.py; `--no-hooks --protect-main` installs only the push guard. It records an older install in `.claude/super-board/upgrade.json` and ends with one next step: /super-board onboard.", "source": ["https://github.com/EricTechPro/super-board/blob/main/install.sh"], "opensView": "install"}, {"id": "visual-py", "label": "visual.py", "kind": "script", "what": "The /visual helper: detect picks the mode, facts collects git data, render injects data.json into the inline template.", "when": "Run by /visual at every step: detect with no argument, facts in recap mode, render after data.json is written.", "how": "render prints `{out, missingHunks}`; grounded hunks come from git via `hunks[].file + contains`, and output lands in a gitignored `_tmp/<date>-visual/` or `.visual/`.", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/visual/scripts/visual.py"]}, {"id": "grilling", "label": "grilling", "kind": "external", "what": "Interview pattern that walks a design tree in rounds: numbered questions, each with a recommended answer, until the frontier is empty.", "when": "Reached by /ui-refine-loop's grill step and by /super-board lint for vague or multi-reading tickets; forbidden inside unattended workers.", "how": "Asks the whole frontier per round and waits; facts come from sub-agents, decisions from the user. ui-refine-loop caps it at 10 questions in waves of 3, then 4.", "source": [".agents/skills/grilling/SKILL.md"], "external": true, "origin": "mattpocock-skills", "author": "mattpocock"}, {"id": "tdd", "label": "tdd", "kind": "external", "what": "Test-driven development discipline: tests at agreed seams through public interfaces, red before green, one vertical slice at a time.", "when": "Reached by super-build for every non-docs ticket, by super-qa when writing High test gaps, and by implement.", "how": "Defines good tests, the anti-patterns (implementation-coupled, tautological, horizontal slicing) and the loop rules; refactoring belongs to the code-review stage.", "source": [".agents/skills/tdd/SKILL.md"], "external": true, "origin": "mattpocock-skills", "opensView": "tdd", "author": "mattpocock"}, {"id": "tdd-v2", "label": "tdd-v2", "kind": "external", "what": "The EricOS testing ladder: which rung a test belongs at (unit, isolated render, e2e) and the gate for climbing to the next.", "when": "Reached by super-qa's test-gap check \"where the repo has it\", and by implement as its preferred test skill.", "how": "Building climbs bottom-up; chasing a defect walks down to the first rung that still reproduces. It owns the layer and defers red-green discipline to tdd.", "source": [".agents/skills/tdd-v2/SKILL.md"], "external": true, "origin": "EricOS local skill", "opensView": "tdd-v2", "author": "EricTechPro"}, {"id": "implement", "label": "implement", "kind": "external", "what": "Implements a piece of work from a spec or tickets, test-first, then reviews and commits it.", "when": "Reached by super-build when the issue's type label is feature or ux (implement → tdd → codebase-design).", "how": "Uses tdd-v2 at pre-agreed seams with tdd underneath, runs typecheck and single tests often and the full suite once, then runs code-review before committing.", "source": [".agents/skills/implement/SKILL.md"], "external": true, "origin": "mattpocock-skills (EricOS local override)", "opensView": "implement", "author": "mattpocock"}, {"id": "code-review", "label": "code-review", "kind": "external", "what": "Two-axis review of the diff since a fixed point: Standards (repo rules plus a Fowler smell baseline) and Spec (does it match the issue).", "when": "Reached by super-build once against its own diff before the final commit, by super-review on every card, and by implement and tdd.", "how": "Pins the fixed point (the lanes pass the merge-base so it never asks), runs a Standards and a Spec sub-agent in parallel, and reports them side by side without reranking.", "source": [".agents/skills/code-review/SKILL.md"], "external": true, "origin": "mattpocock-skills (EricOS local override)", "opensView": "code-review", "author": "mattpocock"}, {"id": "diagnosing-bugs", "label": "diagnosing-bugs", "kind": "external", "what": "Diagnosis loop for hard bugs and perf regressions: build a tight red feedback loop, reproduce, hypothesise, instrument, fix with a regression test.", "when": "Reached by super-build for `bug`-labelled tickets, by super-qa as a required dependency, and by lint for bug tickets with no repro.", "how": "Six phases; refuses to theorise before one command goes red on this bug. Its post-mortem hands off to improve-codebase-architecture when no good seam exists.", "source": [".agents/skills/diagnosing-bugs/SKILL.md"], "external": true, "origin": "mattpocock-skills", "opensView": "diagnosing-bugs", "author": "mattpocock"}, {"id": "codebase-design", "label": "codebase-design", "kind": "external", "what": "Shared deep-module vocabulary: module, interface, depth, seam, adapter, leverage, locality, and the deletion test.", "when": "Reached by super-build for feature and refactor tickets, by super-review in step 2 and for every deepening opportunity, and by super-collect's architecture finder as a fallback.", "how": "A reference to consult, not a session: no report, no prompts. Its design-it-twice pattern runs parallel sub-agents when an interface needs alternatives.", "source": [".agents/skills/codebase-design/SKILL.md"], "external": true, "origin": "mattpocock-skills", "author": "mattpocock"}, {"id": "ask-matt", "label": "ask-matt", "kind": "external", "what": "Router over the Matt Pocock skills: which flow fits the situation, from idea to ship.", "when": "Reached by super-build and super-qa workers when the right flow is unclear.", "how": "Main flow: grill-with-docs, optional prototype via handoff, to-spec and to-tickets for multi-session work, then implement (driving tdd) and code-review. On-ramps: triage, diagnosing-bugs, wayfinder.", "source": [".agents/skills/ask-matt/SKILL.md"], "external": true, "origin": "mattpocock-skills", "opensView": "ask-matt", "author": "mattpocock"}, {"id": "humanizer", "label": "humanizer", "kind": "external", "what": "Strips AI writing tells from a finished draft so it reads like a person wrote it, with Eric Tech plain-words overrides.", "when": "Reached whenever a lane or ui-refine-loop writes prose: the writing standard says ALWAYS run commits, tickets, PR bodies and comments through it when installed.", "how": "Applies the vendored blader/humanizer rule set (32 patterns) as a silent pass; without it the writing standard's plain-words rules apply (short sentences, plain words, no hype).", "source": [".agents/skills/humanizer/SKILL.md", "erictech-skills/skills/humanizer/SKILL.md", "https://github.com/EricTechPro/super-board/blob/main/skills/super-board/references/writing-standard.md"], "external": true, "origin": "erictech-skills (vendored blader/humanizer)", "author": "blader"}, {"id": "verification", "label": "verification-before-compl.", "kind": "external", "what": "Evidence before assertions: run the verification command and read its output before claiming work is done, fixed or passing.", "when": "Reached by super-build before its final commit and by super-qa as a required dependency.", "how": "A gate function: identify the proving erge blocker alone. It applies nothing.", "source": ["~/.claude/plugins/cache/ponytail/ponytail/4.10.0/skills/ponytail-review/SKILL.md"], "external": true, "origin": "ponytail plugin", "author": "DietrichGebert"}, {"id": "ponytail-audit", "label": "ponytail-audit", "kind": "external", "what": "Whole-repo version of ponytail-review: a ranked list of what to delete, simplify or replace with stdlib or native features.", "when": "Reached by /super-collect's architecture finder for over-engineering findings.", "how": "Same tags as ponytail-review, biggest cut first, ending `net: -N lines, -M deps possible`; one-shot and read-only.", "source": ["~/.claude/plugins/cache/ponytail/ponytail/4.10.0/skills/ponytail-audit/SKILL.md"], "external": true, "origin": "ponytail plugin", "author": "DietrichGebert"}, {"id": "impeccable", "label": "impeccable", "kind": "external", "what": "Frontend design skill whose commands critique, audit and refine UI: build, evaluate, refine, enhance, fix and iterate categories.", "when": "Reached by /ui-refine-loop at setup (detect and context), by every checker and fixer, and by lint for shape and clarify.", "how": "Each command has a playbook under reference/<command>.md plus craft-floor.md; refine-setup.sh finds v4.0.x node scripts or the v4.4+ launcher in this or any parent dir, warning loudly when missing.", "source": [".agents/skills/impeccable/SKILL.md"], "external": true, "origin": "pbakaus/impeccable", "opensView": "impeccable", "author": "pbakaus"}, {"id": "testing-strategy", "label": "testing-strategy", "kind": "external", "what": "Coverage judgment per component type: what is worth testing and what to skip.", "when": "Listed by super-build's skill map and super-qa's dependencies for deciding which kind of test a change needs.", "how": "Informs coverage only; the localisation ladder, not this skill, picks the test layer. Not installed in EricOS.", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/super-qa/SKILL.md", k"}, {"id": "to-spec", "label": "to-spec", "kind": "external", "what": "Turns the current conversation into a spec and publishes it to the issue tracker, no interview.", "when": "Reached from ask-matt for multi-session builds; listed in super-build's skill map.", "how": "Writes the spec from a template and applies the `ready-for-agent` label; needs the tracker config from setup-matt-pocock-skills.", "source": [".agents/skills/to-spec/SKILL.md"], "external": true, "origin": "mattpocock-skills", "opensView": "to-spec", "author": "mattpocock"}, {"id": "to-tickets", "label": "to-tickets", "kind": "external", "what": "Breaks a plan or spec into tracer-bullet tickets, each declaring its blocking edges.", "when": "Reached from ask-matt after to-spec, and from /super-board lint to split a too-big ticket (criterion 15) into vertical slices; its `## Blocked by` template is why lint criterion 13 exists.", "how": "Publishes blockers first so edges reference real ids, as files locally or native blocking links on a real tracker.", "source": [".agents/skills/to-tickets/SKILL.md"], "external": true, "origin": "mattpocock-skills", "opensView": "to-tickets", "author": "mattpocock"}, {"id": "triage", "label": "triage", "kind": "external", "what": "Moves raw issues and external PRs through a state machine of triage roles into agent-ready briefs.", "when": "Reached from ask-matt when bugs and requests pile up that you did not create.", "how": "Categorise, verify, grill if needed, write the brief; every comment carries an AI disclaimer and labels come from setup-matt-pocock-skills.", "source": [".agents/skills/triage/SKILL.md"], "external": true, "origin": "mattpocock-skills", "opensView": "triage", "author": "mattpocock"}, {"id": "wayfinder", "label": "wayfinder", "kind": "external", "what": "Charts a shared map of decision tickets for a huge, foggy effort and resolves them one at a time.", "when": "Reached from ask-matt for greenfield projects or builds too big for one session.", "how" wer sub-agent in parallel with the detector.", "how": "Reads critique.md (Assessment A) and craft-floor.md, every shot and crop in both themes and widths, then the scope files; returns up to 8 typed problems. No Nielsen heuristics.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/critique.md"], "author": "pbakaus"}, {"id": "v-audit", "label": "audit", "kind": "verb", "what": "Technical quality check scored /20 across accessibility, performance, responsive, theming and implementation integrity.", "when": "Every check, run by the isolated detector sub-agent after impeccable detect.", "how": "Reads audit.md, scores five dimensions 0–4, and turns each verified detector cluster or audit gap into a typed problem; it never sees the screenshots or the design review.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/audit.md"], "author": "pbakaus"}, {"id": "v-polish", "label": "polish", "kind": "verb", "what": "Final quality pass over everything the round touched: small misalignments and inconsistencies, no structural change.", "when": "Always the last command of every fix round, even when no problem was typed polish.", "how": "Runs once over all touched files after the routed chain; then checks must be green before the round's single commit.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/polish.md"], "author": "pbakaus"}, {"id": "v-distill", "label": "distill", "kind": "verb", "what": "Strips a surface to its essence, removing duplicate actions and competing chrome.", "when": "Routed for problems typed `cluttered`.", "how": "Structural tier, so it runs first in the chain alongside extract; follows reference/distill.md as a refinement of the existing design.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/distill.md"], "author": "pbakaus"}, {"id": "v-bolder", "label": "bolder", "kind": "verb", "what": "Amplifies a safe, bland design so it has more presence.", "when": "Routed for `bland`, only when the brief or taste direction asks for more.", "how": "Additive surface-tier verb; skipped with a reason like \"direction says calmer\", and dropped when it pulls against quieter on the same element.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/bolder.md"], "author": "pbakaus"}, {"id": "v-quieter", "label": "quieter", "kind": "verb", "what": "Tones down an aggressive design: fewer colors, weights, borders, shadows or badges.", "when": "Routed for problems typed `too-loud`.", "how": "Surface tier after layout/adapt; when it conflicts with bolder on one element the higher-severity problem wins.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/quieter.md"], "author": "pbakaus"}, {"id": "v-colorize", "label": "colorize", "kind": "verb", "what": "Adds strategic color where gray or flat UI should carry meaning.", "when": "Routed for `dull-color`, only when the direction asks for more.", "how": "Additive surface-tier verb; changes must hold in light and dark and use tokens, not raw values.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/colorize.md"], "author": "pbakaus"}, {"id": "v-layout", "label": "layout", "kind": "verb", "what": "Fixes spacing, rhythm, grouping, alignment and visual hierarchy.", "when": "Routed for problems typed `spacing-hierarchy`.", "how": "Second tier, after distill/extract; a cramped look caused by a copied card is rerouted to extract by the fixer.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/layout.md"], "author": "pbakaus"}, {"id": "v-typeset", "label": "typeset", "kind": "verb", "what": "Improves typography: fonts, type scale, weights, line length and figures.", "when": "Routed for problems typed `typography`.", "how": "Surface tier with colorize, quieter and bolder; follows reference/typeset.md within the taste file's type rules.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/typeset.md"], "author": "pbakaus"}, {"id": "v-adapt", "label": "adapt", "kind": "verb", "what": "Adapts the surface to other screen sizes: breakpoints, touch targets, no sideways scroll at 390.", "when": "Routed for problems typed `responsive`.", "how": "Second tier with layout; the after shots at 390 in both themes prove it.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/adapt.md"], "author": "pbakaus"}, {"id": "v-optimize", "label": "optimize", "kind": "verb", "what": "Diagnoses and fixes UI performance: jank, layout shift, heavy images or bundles.", "when": "Routed for problems typed `performance`.", "how": "Last tier with animate and delight, before polish; follows reference/optimize.md.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/optimize.md"], "author": "pbakaus"}, {"id": "v-onboard", "label": "onboard", "kind": "verb", "what": "Designs first-run flows and empty states that point to the next action.", "when": "Routed for problems typed `first-run-empty`.", "how": "Fix tier with clarify and harden; no dense fixture means no dense shots, never fabricated data.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/onboard.md"], "author": "pbakaus"}, {"id": "v-clarify", "label": "clarify", "kind": "verb", "what": "Improves UX copy: labels, errors, status words and instructions.", "when": "Routed for `confusing-copy` in the refine loop; also dispatched by /super-board lint for copy or error-message ACs.", "how": "Fix tier; refinement keeps the meaning of factual copy and never adds claims.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/clarify.md"], "author": "pbakaus"}, {"id": "v-harden", "label": "harden", "kind": "verb", "what": "Production-readiness: long content, errors, loading, i18n, overflow, and accessibility (contrast, focus, names, keyboard).", "when": "Routed for problems typed `edge-cases` or `accessibility`.", "how": "Fix tier; the only verb two problem types share in routing.md.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/harden.md"], "author": "pbakaus"}, {"id": "v-animate", "label": "animate", "kind": "verb", "what": "Adds purposeful motion and state-change feedback.", "when": "Routed for `needs-motion`, only when the brief or direction asks for motion.", "how": "Additive last-tier verb; delight may call it.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/animate.md"], "author": "pbakaus"}, {"id": "v-delight", "label": "delight", "kind": "verb", "what": "Adds personality and memorable touches to a correct but lifeless surface.", "when": "Routed for `personality`, only when the brief asks for character.", "how": "Additive last-tier verb that calls animate for motion; followed by polish.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/delight.md"], "author": "pbakaus"}, {"id": "v-extract", "label": "extract", "kind": "verb", "what": "Pulls repeated UI into shared tokens and components.", "when": "Routed for `drift`: the same pattern copied 3+ times, raw values next to tokens, one-off components.", "how": "Structural tier, first in the chain; shared components change only behind a new prop that defaults to today's behaviour.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/extract.md"], "author": "pbakaus"}, {"id": "v-shape", "label": "shape", "kind": "verb", "what": "Plans UX/UI for a feature before code is written.", "when": "Dispatched by /super-board lint for feature tickets with undefined UX; never typed as a refine-loop problem.", "how": "Requires init's PRODUCT.md; a redesign need found in the loop goes to openQuestions instead.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/shape.md"], "author": "pbakaus"}, {"id": "v-init", "label": "init", "kind": "verb", "what": "Captures durable product context in PRODUCT.md.", "when": "Suggested by /impeccable when PRODUCT.md is missing; not run by the refine loop.", "how": "Shape and document require it; its context feeds live mode.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/init.md"], "author": "pbakaus"}, {"id": "v-document", "label": "document", "kind": "verb", "what": "Generates DESIGN.md from existing project code.", "when": "When DESIGN.md is missing; the refine loop reads DESIGN.md if present but never runs this.", "how": "Requires init; doctor feeds it when files go stale.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/document.md"], "author": "pbakaus"}, {"id": "v-live", "label": "live", "kind": "verb", "what": "Visual variant mode: pick elements in the browser and generate alternatives.", "when": "Interactive iteration only; the refine loop forbids it as a problem type.", "how": "Fed by init's context and calls polish on the chosen variant.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/live.md"], "author": "pbakaus"}, {"id": "v-overdrive", "label": "overdrive", "kind": "verb", "what": "Pushes a design past conventional limits for a wow factor.", "when": "Interactive only; the refine loop never types a problem as overdrive.", "how": "A redesign-scale command, so the checker sends such needs to openQuestions.", "source": [".agents/skills/impeccable/SKILL.md", ".agents/skills/impeccable/reference/overdrive.md"], "author": "pbakaus"}, {"id": "preflight", "label": "super-board-preflight.sh", "kind": "script", "what": "Builder pre-flight check: is a Ready card already done, already in progress, overlapping an open PR's files, or unclear?", "when": "Run once per batch of up to 5 Ready build cards by the wave's Pre-flight agent (or by the Builder as step 0 on the legacy backend), before any worktree.", "how": "Prints mechanical verdicts and near-miss candidates; the agent adds 'too big' and semantic matches, then returns proceed, hold, sequence or skipped. Hold and sequence move the card to Blocked with the block template; skipped leaves it in Ready.", "source": ["https://github.com/EricTechPro/super-board/blob/main/scripts/super-board-preflight.sh", "https://github.com/EricTechPro/super-board/blob/main/skills/super-board/references/run.md"]}, {"id": "pr-body", "label": "super-board-pr-body.sh", "kind": "script", "what": "Rewrites one marker block of a PR body (redcheck, status, problem, solution, ac, history, visual, risk) without clobbering other lanes' blocks.", "when": "Called by every lane when it updates its part of the PR, and with --skeleton by ui-refine-loop for a fresh body.", "how": "`--pr N --block <name> --expect-head <sha>` with --body-file or --append-file (history rows); `--time` prints local time in the config's timezone.", "source": ["https://github.com/EricTechPro/super-board/blob/main/scripts/super-board-pr-body.sh", "https://github.com/EricTechPro/super-board/blob/main/skills/super-board/references/writing-standard.md"]}, {"id": "needs-you", "label": "Blocked · 🙋 needs you", "kind": "board", "what": "A card parked in Blocked with the 🙋 template and the `needs-you` label: a step only a human may take. There is no separate column.", "when": "The merge gate exits 7 (merge_policy: money, auth, destructive schema, over 400 lines) or 8 (a migration the robot may not run, or a declared human step).", "how": "The comment opens \"🙋 Your turn on #N\" with the exact commands as checkboxes; a human merges it, or comments `done` / labels `needs-you:done` so the planner's resume list sends it back to Review.", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/super-board/references/block-template.md", "https://github.com/EricTechPro/super-board/blob/main/skills/super-board/references/run.md"]}, {"id": "setup-py", "label": "super-board-setup.py", "kind": "script", "what": "The deterministic half of onboard: finds what is missing or old and fixes the must-haves, and handles boards and branches.", "when": "Run by onboard step 1 (check / fix), step 3 (board-rank, board-migrate, names) and step 4 (branch).", "how": "`fix` installs or refreshes skills, scripts, workflows, guard hooks and settings (via install.sh), removes super-refine / cleanup-wt / arch-loop folders, migrates config keys to v3, runs git init and adds Matt Pocock's skills, all backed up first. `board-migrate` adds missing columns and the three labels and moves Skipped cards to Done.", "source": ["https://github.com/EricTechPro/super-board/blob/main/scripts/super-board-setup.py"]}, {"id": "agents-md-py", "label": "super-board-agents-md.py", "kind": "script", "what": "The deterministic half of the AGENTS.md step: detect, backup, the managed super-board block, the CLAUDE.md pointer, coverage and size checks.", "when": "Run by onboard step 5 to stage the merge and at step 8 to write it; install.sh refreshes the managed block on re-install.", "how": "The agent merges rules semantically (duplicates once, conflicts asked one by one); the script proves every rule unit maps to a line (`coverage`), keeps AGENTS.md ≤ 200 lines with one marker pair, and writes atomically.", "source": ["https://github.com/EricTechPro/super-board/blob/main/scripts/super-board-agents-md.py", "https://github.com/EricTechPro/super-board/blob/main/skills/super-board/references/agents-md-block.md", "https://github.com/EricTechPro/super-board/blob/main/skills/super-board/references/onboard.md"]}, {"id": "agents-file", "label": "AGENTS.md + CLAUDE.md", "kind": "board", "what": "The project's instruction files: AGENTS.md as the single source of truth with a managed super-board block, and CLAUDE.md as `@AGENTS.md` plus Claude-only rules.", "when": "Written at onboard step 8 when Eric chose to move his rules (or only add the section); the block is rewritten on re-install.", "how": "The block sits between `<!-- super-board:begin -->` and `<!-- super-board:end -->`, rendered from agents-md-block.md with a Writing table that links the writing standard; nothing outside the markers is touched.", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/super-board/references/agents-md-block.md", "https://github.com/EricTechPro/super-board/blob/main/skills/super-board/references/onboard.md"]}, {"id": "settings-py", "label": "super-board-settings.py", "kind": "script", "what": "Merges hook blocks and permission allow rules into .claude/settings.json without losing anything.", "when": "Run by install.sh for the guard hooks, and by onboard step 6/8 for the permission lines and the protect-main hook.", "how": "`hooks <settings> <snippet>` and `allow <settings> <rules…>` keep every existing key, back the file up, write atomically, and leave an invalid settings.json untouched; `--dry-run` prints the diff onboard shows as \"N lines\".", "source": ["https://github.com/EricTechPro/super-board/blob/main/scripts/super-board-settings.py"]}, {"id": "env-check", "label": "super-board-env-check.sh", "kind": "script", "what": "Says which env keys exist (present, empty or missing) without ever printing a value.", "when": "Run by onboard to detect SENTRY_AUTH_TOKEN, POSTHOG_PERSONAL_API_KEY or migration DB URLs, and allowed in permissions for runs.", "how": "Reads .env.local or .env itself and prints one word per key; guard-secrets lets a plain call through while still blocking cat, grep or source on dotenv files.", "source": ["https://github.com/EricTechPro/super-board/blob/main/scripts/super-board-env-check.sh", "https://github.com/EricTechPro/super-board/blob/main/hooks/guard-secrets.py"]}, {"id": "collect-custom", "label": "custom source fetcher", "kind": "script", "what": "The custom source: extra sources a project added in onboard (an http API, a CLI command, or an MCP server), stored in collect.custom[].", "when": "Run by onboard step 7 (classify, ping, add) and by /super-collect for every custom source (list, normalize).", "how": "`collect_custom.py` classifies the typed text, pings read-only before saving, refuses commands that look like they change something, and turns output into candidates with fp `custom|<name>|<key>`. MCP reads go through the agent and `normalize`.", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/super-collect/scripts/collect_custom.py"]}, {"id": "get-sh", "label": "get.sh", "kind": "script", "what": "One-line installer: `curl -fsSL …/get.sh | bash` fetches the latest super-board release and runs install.sh.", "when": "Eric (or a user) runs it in a project folder to install or upgrade; options --target, --ref, --no-helper-skills, and --no-hooks / --protect-main passed through.", "how": "Downloads the release tarball, runs install.sh, adds Matt Pocock's skills via `npx skills@latest add mattpocock/skills` unless told not to, and prints the next step once.", "source": ["https://github.com/EricTechPro/super-board/blob/main/get.sh"]}, {"id": "plugin-mkt", "label": "plugin marketplace install", "kind": "board", "what": "The Claude Code plugin form of the pack (marketplace.json + plugin.json): ships the seven skills only.", "when": "A user adds the marketplace and installs the plugin instead of running get.sh.", "how": "Skills carry the plugin prefix (/super-board:super-board onboard); onboard step 1 then installs the guard hooks, .claude/bin scripts and workflows a plugin cannot ship from the plugin's own copy.", "source": ["https://github.com/EricTechPro/super-board/blob/main/.claude-plugin/marketplace.json", "https://github.com/EricTechPro/super-board/blob/main/.claude-plugin/plugin.json"]}, {"id": "onboard-answers", "label": "onboard answers file", "kind": "board", "what": "`.claude/super-board/onboard-answers.json`: every onboard answer, saved the moment it is given (gitignored).", "when": "Written after each answer; read when onboard re-runs or resumes after a halt.", "how": "Atomic writes; `last_step` drives the \"Continue where you left off?\" screen, and a finished setup's values fill the step-8 table on re-run.", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/super-board/references/onboard.md"]}, {"id": "upgrade-json", "label": "upgrade record", "kind": "board", "what": "`.claude/super-board/upgrade.json`: the version an install replaced, so onboard knows to upgrade a 2.x setup.", "when": "Written by install.sh (or get.sh) when it finds an older install.", "how": "super-board-setup.py fix reads it and reports \"Upgraded for you\": old folders removed, config keys migrated, labels mapped, Skipped cards moved to Done.", "source": ["https://github.com/EricTechPro/super-board/blob/main/install.sh", "https://github.com/EricTechPro/super-board/blob/main/RELEASE-NOTES.md"]}, {"id": "git-sync", "label": "/git-sync", "kind": "public", "what": "Commits the working tree as one commit per logical change, merge-pulls, pushes the current branch without force, and reports what it did.", "when": "Eric runs /git-sync or says \"sync\", \"commit and push\" or \"pull and push\", usually at the end of a piece of work.", "how": "Stages each group by path (never `git add -A`), refuses secrets, writes the host's commit format or the writing standard, gates `supabase/` changes on a migration file and advisors, then `git pull --no-rebase` and `git push`. The default or a protected branch needs a yes.", "source": ["https://github.com/EricTechPro/super-board/blob/main/skills/git-sync/SKILL.md"], "sublabel": "commit · pull · push", "opensView": "git-sync", "author": "EricTechPro"}], "edges": [{"id": "r-board-build", "from": "super-board", "to": "super-build", "label": "starts Build lane", "when": "a planned Ready card labelled feature or bug (or unlabelled) passes pre-flight"}, {"id": "r-board-qa", "from": "super-board", "to": "super-qa", "label": "starts QA lane", "when": "a card is in QA, or in Ready with the qa label (skips Building)"}, {"id": "r-board-review", "from": "super-board", "to": "super-review", "label": "starts Review lane", "when": "a card is in Review"}, {"id": "r-board-gh", "from": "super-board", "to": "gh-board", "label": "drains", "when": "every wave until drained or halted"}, {"id": "r-board-config", "from": "super-board", "to": "sb-config", "label": "reads config", "when": "onboard writes it; every run reads it"}, {"id": "r-collect-gh", "from": "super-collect", "to": "gh-board", "label": "files to Backlog", "when": "the verifier says file or needs-triage and the run is confirmed"}, {"id": "r-collect-config", "from": "super-collect", "to": "sb-config", "label": "reads collect block", "when": "every run, to resolve sources, window and board"}, {"id": "r-build-qa", "from": "super-build", "to": "super-qa", "label": "hands off", "when": "the draft PR is open and the card moved to QA"}, {"id": "r-qa-review", "from": "super-qa", "to": "super-review", "label": "hands off", "when": "every AC passes and evidence is committed; a fail sends the card back to Ready"}, {"id": "r-review-build", "from": "super-review", "to": "super-build", "label": "bounces [builder]", "when": "a code-side finding or an unfixed prior finding"}, {"id": "r-review-base", "from": "super-review", "to": "base-branch", "label": "merges via gate", "when": "review is clean, tests rerun green, and merge_policy lets the robot merge"}, {"id": "r-review-hooks", "from": "super-review", "to": "hooks", "label": "triggers cleanup-wt", "when": "the merge gate merged a PR and cleanup-wt is installed"}, {"id": "r-refine-base", "from": "ui-refine-loop", "to": "base-branch", "label": "opens draft PR", "when": "the loop stops; it pushes refine/<slug> only and never merges"}, {"id": "r-visual-base", "from": "visual", "to": "base-branch", "label": "reads git facts", "when": "recap mode, or any mode reading the repo"}, {"id": "r-refine-c
