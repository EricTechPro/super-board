    }
  }

  function routeAudit(geo, where) {
    const issues = [];
    // routes: no crossings, no shared runs, no label lying across another route
    const segs = geo.edges.map(e => e.pts.slice(0, -1).map((a, i) => [a, e.pts[i + 1]]));
    const name = e => `${e.s.label}→${e.t.label}`;
    const crossing = ([a, b], [c, d]) => {
      const av = a[0] === b[0], cv = c[0] === d[0];
      if (av === cv) { // parallel: overlapping collinear run = shared trunk
        if (av && Math.abs(a[0] - c[0]) < 1) return Math.min(Math.max(a[1], b[1]), Math.max(c[1], d[1])) - Math.max(Math.min(a[1], b[1]), Math.min(c[1], d[1])) > 1 ? 'share' : null;
        if (!av && Math.abs(a[1] - c[1]) < 1) return Math.min(Math.max(a[0], b[0]), Math.max(c[0], d[0])) - Math.max(Math.min(a[0], b[0]), Math.min(c[0], d[0])) > 1 ? 'share' : null;
        return null;
      }
      const [v, hz] = av ? [[a, b], [c, d]] : [[c, d], [a, b]];
      const x = v[0][0], y = hz[0][1];
      const inV = y > Math.min(v[0][1], v[1][1]) + .5 && y < Math.max(v[0][1], v[1][1]) - .5, inH = x > Math.min(hz[0][0], hz[1][0]) + .5 && x < Math.max(hz[0][0], hz[1][0]) - .5;
      return inV && inH ? 'cross' : null;
    };
    for (let i = 0; i < segs.length; i++) for (let j = i + 1; j < segs.length; j++) {
      let found = null;
      for (const s1 of segs[i]) { for (const s2 of segs[j]) { found = crossing(s1, s2); if (found) break; } if (found) break; }
      if (found === 'cross') issues.push(`${where}: edges ${name(geo.edges[i])} and ${name(geo.edges[j])} cross`);
      if (found === 'share') issues.push(`${where}: edges ${name(geo.edges[i])} and ${name(geo.edges[j])} share a line`);
    }
    geo.edges.forEach((e, i) => { if (!e.lbl) return; const L = { x: e.lbl.x + 1, y: e.lbl.y + 1, w: e.lbl.w - 2, h: e.lbl.h - 2 };
      geo.edges.forEach((o, j) => { if (j !== i && segs[j].some(([a, b]) => Math.max(a[0], b[0]) > L.x && Math.min(a[0], b[0]) < L.x + L.w && Math.max(a[1], b[1]) > L.y && Math.min(a[1], b[1]) < L.y + L.h)) issues.push(`${where}: label "${e.lbl.text}" lies on edge ${name(o)}`); }); });
    return issues;
  }

  /* label-overlap audit used by `visual.py check` (world coordinates, real font metrics) */
  function auditSvg(svg, geo, where) {
    const issues = [], R = n => ({ x: n.x, y: n.y, w: n.w, h: n.h });
    const T = [...svg.querySelectorAll('text[data-t]')].map(t => { let b; try { b = t.getBBox(); } catch (_) { return null; } return { t: t.dataset.t, o: t.dataset.o, txt: t.textContent, b: { x: b.x, y: b.y, w: b.width, h: b.height } }; }).filter(x => x && x.b.w);
    const nodes = geo.nodes;
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) if (hit(R(nodes[i]), R(nodes[j]), -1)) issues.push(`${where}: nodes "${nodes[i].label}" and "${nodes[j].label}" overlap`);
    T.forEach(a => {
      if (a.t === 'el') {
        nodes.forEach(n => { if (hit(a.b, R(n), -1)) issues.push(`${where}: edge label "${a.txt}" covers node "${n.label}"`); });
      } else {
        const own = geo.byId[a.o];
        if (own && (a.b.x < own.x + 1 || a.b.x + a.b.w > own.x + own.w - 1)) issues.push(`${where}: text "${a.txt}" overflows node "${own.label}"`);
        nodes.forEach(n => { if (n !== own && hit(a.b, R(n), -1)) issues.push(`${where}: text "${a.txt}" overlaps node "${n.label}"`); });
      }
    });
    issues.push(...routeAudit(geo, where));
    const els = T.filter(a => a.t === 'el');
    for (let i = 0; i < els.length; i++) for (let j = i + 1; j < els.length; j++) if (hit(els[i].b, els[j].b, -1)) issues.push(`${where}: edge labels "${els[i].txt}" and "${els[j].txt}" overlap`);
    return issues;
  }

  function toggleTheme() {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    const next = cur === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('visual-theme', next); } catch (e) {}
  }

  function renderDoc() {
  const kind = D.kind || 'explore';
  const L = {
    recap:   { key: 'Key changes', files: 'Files changed', dia: 'What changed', tests: 'What to test', hunks: 'Annotated changes' },
    plan:    { key: 'What will change', files: 'Files to touch', dia: 'Design', tests: 'Verification', hunks: 'Code sketches' },
    explore: { key: 'Highlights', files: 'Map', dia: 'Diagram', tests: 'Try it', hunks: 'Key code' },
  }[kind] || {};
  const labels = Object.assign({}, L, D.labels || {});
  const navItems = [];
  const sec = (id, title, count) => { navItems.push([id, title]);
    const s = h(`<section id="${id}"><h2>${esc(title)}${count != null ? ` <span class="count">${count}</span>` : ''}</h2></section>`);
    app.appendChild(s); return s; };
  const base = p => p.split('/').pop();
  const dir = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/') + 1) : '';
  const hunkByFile = {};

  /* ---------- hero ---------- */
  const m = D.meta || {};
  const eyebrow = [`<span class="kind ${esc(kind)}">${esc(kind)}</span>`];
  if (m.project) eyebrow.push(`<span>${esc(m.project)}</span>`);
  if (m.branch) eyebrow.push(`<span>⎇ ${esc(m.branch)}${m.base ? ' → ' + esc(m.base) : ''}</span>`);
  if (D.source) eyebrow.push(`<span>◇ ${esc(D.source)}</span>`);
  const st = D.stats || {};
  const stats = [];
  if (st.files != null) stats.push(`<div class="stat"><b>${st.files}</b><span>files</span></div>`);
  if (st.add != null) stats.push(`<div class="stat add"><b>+${st.add}</b><span>added</span></div>`);
  if (st.del != null) stats.push(`<div class="stat del"><b>−${st.del}</b><span>removed</span></div>`);
  if (st.commits) stats.push(`<div class="stat"><b>${st.commits}</b><span>commits</span></div>`);
  if (kind === 'plan' && (D.steps || []).length) stats.push(`<div class="stat"><b>${D.steps.length}</b><span>steps</span></div>`);
  if (kind === 'plan' && (D.files || []).length && st.files == null) stats.push(`<div class="stat"><b>${D.files.length}</b><span>files</span></div>`);
  if ((D.questions || []).length) stats.push(`<div class="stat"><b>${D.questions.length}</b><span>open questions</span></div>`);
  app.appendChild(h(`<header class="hero"><div class="eyebrow">${eyebrow.join('<span>·</span>')}</div>
    <h1>${inline(D.title || 'Visual')}</h1>${D.subtitle ? `<p class="sub">${inline(D.subtitle)}</p>` : ''}
    <div class="stats">${stats.join('')}</div></header>`));

  if (D.summary) sec('summary', 'Summary').appendChild(h(`<div class="card summary prose">${md(D.summary)}</div>`));

  /* ---------- key changes + files ---------- */
  const keys = D.keyChanges || [];
  const files = D.files || [];
  if (keys.length || files.length) {
    const s = sec('changes', keys.length ? labels.key : labels.files);
    const grid = h(`<div class="split"></div>`); s.appendChild(grid);
    if (keys.length) {
      const col = h(`<div class="changes"></div>`);
      keys.forEach((k, i) => {
        const tag = k.tag ? `<span class="tag t-${esc(String(k.tag).toLowerCase())}">${esc(k.tag)}</span>` : '';
        const chips = (k.files || []).map(f => `<span class="chip" data-file="${esc(f)}" title="${esc(f)}">${esc(base(f))}</span>`).join('');
        col.appendChild(h(`<div class="card change"><div class="num">${String(i + 1).padStart(2, '0')}</div><div>
          <h3>${inline(k.title)} ${tag}</h3>${k.detail ? `<div class="detail prose">${md(k.detail)}</div>` : ''}
          ${chips ? `<div class="chips">${chips}</div>` : ''}</div></div>`));
      });
      grid.appendChild(col);
    }
    if (files.length) grid.appendChild(renderFiles(files));
    if (!keys.length) grid.style.gridTemplateColumns = '1fr';
  }

  function normStatus(f) {
    const s = String(f.status || 'M').toUpperCase();
    return ({ ADD: 'A', ADDED: 'A', NEW: 'A', CREATE: 'A', MODIFY: 'M', MODIFIED: 'M', CHANGE: 'M', EDIT: 'M',
      DELETE: 'D', DELETED: 'D', REMOVE: 'D', RENAME: 'R', RENAMED: 'R' })[s] || s[0];
  }
  function renderFiles(files) {
    const aside = h(`<aside class="card files"></aside>`);
    const tot = files.reduce((a, f) => [a[0] + (f.add || 0), a[1] + (f.del || 0)], [0, 0]);
    const hasNums = files.some(f => f.add || f.del);
    aside.appendChild(h(`<div class="head"><span>${esc(labels.files)} · ${files.length}</span>${hasNums ? `<span><span class="plus">+${tot[0]}</span> <span class="minus">−${tot[1]}</span></span>` : ''}</div>`));
    const areas = {};
    files.forEach(f => (areas[f.area || '(root)'] ||= []).push(f));
    const many = Object.keys(areas).length > 8;
    Object.entries(areas).forEach(([area, fs]) => {
      const a = fs.reduce((x, f) => [x[0] + (f.add || 0), x[1] + (f.del || 0)], [0, 0]);
      const d = h(`<details class="area" ${many && fs.length > 6 ? '' : 'open'}><summary>${esc(area)}<span class="n">${hasNums ? `<span class="plus">+${a[0]}</span> <span class="minus">−${a[1]}</span>` : fs.length}</span></summary></details>`);
      fs.forEach(f => {
        const s = normStatus(f), tot = (f.add || 0) + (f.del || 0);
        const g = tot ? Math.round(5 * (f.add || 0) / tot) : 0;
        const blocks = hasNums ? `<span class="blocks">${[0,1,2,3,4].map(i => `<i class="${tot ? (i < g ? 'g' : 'r') : ''}"></i>`).join('')}</span>` : '';
        const nums = hasNums ? `${f.binary ? '<span>bin</span>' : `<span class="plus">+${f.add || 0}</span><span class="minus">−${f.del || 0}</span>`}${blocks}` : '';
        const pre = f.prefix ?? (f.area ? f.area + '/' : ''), rel = pre && f.path.startsWith(pre) && f.path !== pre ? f.path.slice(pre.length) : f.path;
        const row = h(`<div class="frow" data-path="${esc(f.path)}" title="${esc(f.path)}${f.from ? ' (from ' + esc(f.from) + ')' : ''}">
          <span class="st ${s}">${s}</span><span class="p"><bdi><span class="dir">${esc(dir(rel))}</span>${esc(base(rel))}</bdi></span>
          <span class="ad">${nums}</span>${f.note ? `<div class="fnote">${inline(f.note)}</div>` : ''}</div>`);
        d.appendChild(row);
      });
      aside.appendChild(d);
    });
    return aside;
  }

  /* ---------- diagrams (archify-style inline SVG, zoom + pan) ---------- */
  const cams = [];
  window.__geos = [];
  function renderDiagram(dg) {
    const geo = layoutGraph(dg, false);
    const used = [...new Set(geo.nodes.map(n => n.k))];
    const col = k => `var(--${KIND[k][0]})`, fill = k => `var(--${KIND[k][0]}-f)`;
    const legend = used.map(k => `<span><i style="border-color:${col(k)};background:${fill(k)}"></i>${KIND[k][1]}</span>`).join('')
      + (geo.nodes.some(n => CHG[String(n.change || '').toLowerCase()]) ? '<span style="color:var(--green)">● new</span><span style="color:var(--amber)">● changed</span>' : '');
    const fig = h(`<figure class="card dia"><figcaption><div class="ft">${inline(dg.title || '')}</div><div class="legend">${legend}</div></figcaption>
      <div class="canvas cam" tabindex="0" aria-label="Diagram canvas: drag to pan, pinch or Ctrl+scroll to zoom">${svgOf(geo, { title: dg.title })}
        <div class="ctl mini-ctl"><button data-z="out" title="Zoom out (−)">−</button><button data-z="fit" class="pct" title="Fit (0)">100%</button><button data-z="in" title="Zoom in (+)">+</button><button data-z="flow" title="Animate flow direction">≋</button><button data-z="full" title="Full screen (F)">⛶</button></div>
        <div class="cam-hint">Drag to pan · pinch or ⌘/Ctrl + scroll to zoom</div></div>
      ${dg.caption ? `<div class="fc">${inline(dg.caption)}</div>` : ''}</figure>`);
    fig._geo = geo; window.__geos.push([fig, geo, dg.title || 'diagram']);
    return fig;
  }
  function initDocCameras() {
    document.querySelectorAll('figure.dia').forEach(fig => {
      const el = fig.querySelector('.canvas'), svg = el.querySelector('svg'), geo = fig._geo, b = geo.bounds;
      const sizeIt = () => { if (el.classList.contains('full')) { el.style.height = ''; return; } const w = el.clientWidth || 800; el.style.height = Math.round(Math.max(220, Math.min(680, w * b.h / b.w + 8))) + 'px'; };
      sizeIt();
      const pct = el.querySelector('.pct');
      const cam = new Camera(el, svg, { wheel: 'ctrl', maxFit: 1, onChange: c => { pct.textContent = Math.round(c.s.k * 100) + '%'; } });
      cam.setSvg(svg, b); cam.fit(false); cams.push(cam);
      el.querySelector('.ctl').addEventListener('click', ev => {
        const z = ev.target.closest('button')?.dataset.z; if (!z) return;
        if (z === 'in') cam.zoomAt(1.4, null, null, true); else if (z === 'out') cam.zoomAt(1 / 1.4, null, null, true);
        else if (z === 'fit') cam.fit(); else if (z === 'flow') { el.classList.toggle('flowing'); ev.target.closest('button').classList.toggle('on'); } else if (z === 'full') { el.classList.toggle('full'); document.body.classList.toggle('noscroll', el.classList.contains('full')); sizeIt(); requestAnimationFrame(() => cam.fit(false)); }
      });
      el.addEventListener('keydown', ev => {
        if (ev.key === '+' || ev.key === '=') cam.zoomAt(1.4, null, null, true); else if (ev.key === '-') cam.zoomAt(1 / 1.4, null, null, true);
        else if (ev.key === '0') cam.fit(); else if (ev.key === 'f' || ev.key === 'F') el.querySelector('[data-z=full]').click();
        else if (ev.key === 'Escape' && el.classList.contains('full')) el.querySelector('[data-z=full]').click();
        else if (ev.key.startsWith('Arrow')) { const d = 60, m = { ArrowLeft: [d, 0], ArrowRight: [-d, 0], ArrowUp: [0, d], ArrowDown: [0, -d] }[ev.key]; cam.pan(m[0], m[1], true); }
        else return; ev.preventDefault();
      });
      addEventListener('resize', () => { sizeIt(); if (!cam.touched) cam.fit(false); else cam.apply(); });
    });
  }
  if ((D.diagrams || []).length) {
    const s = sec('diagram', labels.dia);
    D.diagrams.forEach(dg => { try { s.appendChild(renderDiagram(dg)); } catch (err) { s.appendChild(h(`<div class="card empty">Diagram failed: ${esc(err.message)}</div>`)); } });
  }

  /* ---------- endpoints ---------- */
  if ((D.endpoints || []).length) {
    const s = sec('endpoints', 'Endpoints', D.endpoints.length);
    const g = h(`<div class="eps"></div>`); s.appendChild(g);
    const pj = v => esc(typeof v === 'string' ? v : JSON.stringify(v, null, 2));
    D.endpoints.forEach(e => {
      const M = String(e.method || 'GET').toUpperCase(), ch = CHG[String(e.change || '').toLowerCase()];
      g.appendChild(h(`<div class="card ep"><div class="line"><span class="method m-${esc(M)}">${esc(M)}</span><span class="path">${esc(e.path)}</span>
        ${ch ? `<span class="tag" style="color:var(--${ch[0]})">${ch[1]}</span>` : ''}${e.auth ? `<span class="tag t-risk">${esc(e.auth)}</span>` : ''}</div>
        ${e.summary ? `<div class="desc">${inline(e.summary)}</div>` : ''}
        ${e.request != null ? `<details><summary>request</summary><pre class="json">${pj(e.request)}</pre></details>` : ''}
        ${e.response != null ? `<details><summary>response</summary><pre class="json">${pj(e.response)}</pre></details>` : ''}</div>`));
    });
  }

  /* ---------- steps (plan) ---------- */
  if ((D.steps || []).length) {
    const s = sec('steps', 'Steps', D.steps.length);
    const list = h(`<div class="steps"></div>`); s.appendChild(list);
    D.steps.forEach((st, i) => {
      const chips = (st.files || []).map(f => `<span class="chip" data-file="${esc(f)}" title="${esc(f)}">${esc(base(f))}</span>`).join('');
      list.appendChild(h(`<div class="step"><div class="dot">${i + 1}</div><div class="card body"><h3>${inline(st.title)}</h3>
        ${st.detail ? `<div class="detail prose">${md(st.detail)}</div>` : ''}${chips ? `<div class="chips">${chips}</div>` : ''}</div></div>`));
    });
  }

  /* ---------- annotated hunks ---------- */

  /* ================= map mode: drill-down skill / architecture map =================
     Viewer UX ported in spirit from archify (MIT): camera with reading depths, minimap

     reach, node finder, export. Drill-down views, breadcrumbs and deep links are /visual's own. */
  function renderMap() {
    document.body.classList.add('map-mode');
    const nodes = D.nodes || [], views = (D.views || []).filter(v => v && v.id);
    const N = Object.fromEntries(nodes.map(n => [n.id, n]));
    const V = Object.fromEntries(views.map(v => [v.id, v]));
    const viewOfParent = p => V[p] ? p : (views.find(v => v.id === p || v.node === p) || {}).id; // parent may name a node
    views.forEach(v => { if (v.parent) v.parent = viewOfParent(v.parent) || null; });
    const rootId = (D.root && V[D.root]) ? D.root : (views.find(v => !v.parent) || views[0] || {}).id;
    const childOf = nid => { const n = N[nid] || {}; const o = n.view || n.opensView; return o && V[o] ? o : V[nid] ? nid : (views.find(v => v.node === nid) || {}).id; };

      const ids = new Set(v.nodeIds || []);
      const list = Array.isArray(v.edges) && v.edges.length ? v.edges : (D.edges || []).filter(e => ids.has(e.from) && ids.has(e.to));

    };
    const kindLabel = k => KIND[kindOf(k, true)][1];
    const root = D.meta && D.meta.root ? D.meta.root.replace(/\/$/, '') : '';
    const base = D.sourcesBase ? String(D.sourcesBase).replace(/\/$/, '') + '/' : '';
    const srcPath = p => p.replace(/:\d+(-\d+)?$/, '');
    const srcHref = p => /^https?:/.test(p) ? p : 'file://' + encodeURI((p.startsWith('/') ? '' : root + '/' + base) + srcPath(p));

    const app = document.getElementById('app'); app.className = 'mapapp';

      <header class="mbar">

        <nav class="crumbs" id="m-crumbs" aria-label="Breadcrumb"></nav>

        <dt>Esc · Backspace</dt><dd>close panel, then up one level</dd><dt>+ − 0 1</dt><dd>zoom in, out, fit, 100%</dd><dt>← ↑ → ↓</dt><dd>pan</dd><dt>/</dt><dd>find a node</dd><dt>O</dt><dd>views outline</dd><dt>F</dt><dd>animate flow on/off</dd><dt>?</dt><dd>this help</dd></dl>
        <button class="pbtn" data-close>Got it</button></div></div>`;
    const $ = id => document.getElementById(id);
    const stage = $('m-stage'), panel = $('m-panel');
    let cam = null, geo = null, svg = null, cur = null, sel = null, stack = [], busy = false;
    const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches || window.__instant;
    const sleep = ms => new Promise(r => setTimeout(r, reduce() ? 0 : ms));
    const toast = (t, ms = 1800) => { const el = $('m-toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), ms); };

    function buildView(vid, override) {
      const g = buildGeo(vid, override), v = V[vid];
      const markup = svgOf(g, { title: v.title, subject: subjectOf(v), childCount: nid => { const c = childOf(nid); return c && c !== vid ? (V[c].nodeIds || []).length : 0; } });
      return { g, markup };
    }
    const layoutCache = {};
    function buildGeo(vid, override, repair = true) {
      const v = V[vid], ids = (v.nodeIds || []).filter(i => N[i]);

      const seq = v.render === 'sequence';
      if (seq) edges.forEach((e, i) => { e.step = i + 1; });
      const par = {}; // parallel edges between one pair read as one edge listing every relation
      const merged = edges.filter(e => { const k = e.from + '>' + e.to, m = par[k]; if (!m) { par[k] = e; e.all = [e]; return true; } m.all.push(e); return false; })
        .map(e => e.all.length < 2 ? e : { ...e, label: (e.step != null ? '' : '') + (e.label || '') + ' +' + (e.all.length - 1), when: e.all.map(x => (x.step != null ? x.step + '. ' : '') + (x.label || '')).join('\n') });
      const dg = { nodeH: 70, nodes: ids.map(i => ({ ...N[i], sub: N[i].sub || N[i].sublabel, col: (N[i].col != null && v.layout == null && !pos[i]) ? N[i].col : (pos[i] || [0, 0])[0], row: (pos[i] || [0, 0])[1] })),
        edges: merged.map(e => ({ ...e, style: e.style || (N[e.from] && N[e.from].kind === 'hook' ? 'security' : /async|dispatch|spawn/i.test(e.label || '') ? 'async' : '') })) };
      const pair = {}; // A→B plus B→A reads as one two-way edge
      dg.edges = dg.edges.filter(e => { const r = pair[e.to + '>' + e.from]; if (r) { r.both = true; if (e.label && e.label !== r.label) r.label = (r.label ? r.label + ' / ' : '') + e.label; if (e.when) r.when = [r.when, e.when].filter(Boolean).join(' · '); return false; } pair[e.from + '>' + e.to] = e; return true; });
      dg.repair = repair;
      return layoutGraph(dg, true);
    }
    /* crossing-minimising local search over rows and sides; `visual.py render` bakes the result into the page */
    function scoreGeo(g) {
      const bad = routeAudit(g, '').length, len = g.edges.reduce((a, e) => a + e.pts.slice(1).reduce((s, p, i) => s + Math.abs(p[0] - e.pts[i][0]) + Math.abs(p[1] - e.pts[i][1]), 0), 0);
      const bends = g.edges.reduce((a, e) => a + e.pts.length, 0), drop = g.edges.filter(e => e.label && !e.lbl).length;
      return bad * 1000 + ((g.stats.cross || 0) + (g.stats.fallback || 0)) * 150 + drop * 40 + len / 40 + bends * 3 + g.bounds.w * g.bounds.h / 4e5;
    }
    function optimize(vid, budget = 160) {
      budget = Math.max(budget, Math.min(400, 20 * (V[vid].nodeIds || []).length));
      const t0 = performance.now(); let wall = 4000; // per-view time box, extended while problems remain
      const v = V[vid], ids = (v.nodeIds || []).filter(i => N[i]);
      let pos = JSON.parse(JSON.stringify(autoLayout(ids, viewEdges(v), subjectOf(v))));
      let best = scoreGeo(buildGeo(vid, pos, false)), evals = 1;
      const hub = subjectOf(v), hubCol = hub && pos[hub] ? pos[hub][0] : null;
      const tryPos = cand => { evals++; const s = scoreGeo(buildGeo(vid, cand, false)); if (s < best - 0.5) { best = s; pos = cand; return true; } return false; };
      let improved = true;
      while (improved && evals < budget * (best >= 1000 ? 2.5 : 1) && performance.now() - t0 < (best >= 1000 ? 12000 : wall)) {
        improved = false;
        for (const a of ids) {
          if (evals >= budget * (best >= 1000 ? 2.5 : 1) || performance.now() - t0 > (best >= 1000 ? 12000 : wall)) break;
          const [ca, ra] = pos[a];
          const moves = [];
          ids.forEach(b => { if (b !== a && Math.abs(pos[b][0] - ca) <= 1 && b !== hub) moves.push(['swap', b]); });
          moves.push(['row', -1], ['row', 1]);
          if (a !== hub) moves.push(['col', -1], ['col', 1]);
          if (hubCol != null && a !== hub && ca !== hubCol) moves.push(['mirror']);
          for (const [kind, arg] of moves) {
            if (evals >= budget) break;
            const c = JSON.parse(JSON.stringify(pos));
            if (kind === 'swap') { if (a === hub) continue; const t2 = c[a]; c[a] = c[arg]; c[arg] = t2; }
            else if (kind === 'col') { const nc = ca + arg; let r = ra; while (ids.some(b => c[b][0] === nc && c[b][1] === r)) r++; c[a] = [nc, r]; }
            else if (kind === 'row') { const r = ra + arg; if (r < 0 || ids.some(b => c[b][0] === ca && c[b][1] === r)) continue; c[a][1] = r; }
            else { const nc = 2 * hubCol - ca; const occ = ids.find(b => c[b][0] === nc && c[b][1] === ra); if (occ) c[occ][0] = ca; c[a][0] = nc; }
            if (Math.min(...ids.map(i => c[i][0])) < 0) { const m = Math.min(...ids.map(i => c[i][0])); ids.forEach(i => { c[i][0] -= m; }); }
            if (tryPos(c)) { improved = true; break; }
          }
        }
      }
      return { pos, score: best, evals };
    }

    function mount(vid) {

    }

    /* minimap */

      $('m-up').disabled = !parent;
      const used = [...new Set(geo.nodes.map(n => n.k))];

        + `${geo.nodes.some(n => childOf(n.id) && childOf(n.id) !== cur) ? '<span class="lg-stack"><i></i><b>Stacked</b> double-click to look inside</span>' : ''}`
        + `${geo.nodes.some(n => n.author) ? '<span class="lg-av"><i></i><b>Avatar</b> who wrote the skill</span>' : ''}`;
      const tree = (pid, depth) => views.filter(x => (x.parent || null) === pid).map(x => `<button class="tv${x.id === cur ? ' on' : ''}${stack.includes(x.id) && x.id !== cur ? ' path' : ''}" data-v="${esc(x.id)}" style="--d:${depth}">
          <span class="tv-t">${esc(x.title || x.id)}</span><span class="tv-n">${(x.nodeIds || []).length}</span></button>${tree(x.id, depth + 1)}`).join('');
      $('m-tree').innerHTML = `<div class="tree-h">Views <span>${views.length}</span></div>` + tree(null, 0);
      document.title = `${v.title || v.id} · ${D.title || 'map'}`;
    }

    /* selection + passport panel */
    function select(nid, opts = {}) {
      if (!geo.byId[nid]) return;
      sel = nid;
      const ups = new Set(), downs = new Set();
      geo.edges.forEach(e => { if (e.to === nid) ups.add(e.from); if (e.from === nid) downs.add(e.to); });
      svg.querySelectorAll('.node').forEach(g => { const id = g.dataset.id; g.classList.toggle('sel', id === nid); g.classList.toggle('nb', ups.has(id) || downs.has(id)); });
      svg.querySelectorAll('.edge-g').forEach(g => g.classList.toggle('hot', g.dataset.from === nid || g.dataset.to === nid));
      svg.querySelectorAll('.e-lab').forEach(g => { const e = geo.edges[g.dataset.i]; g.classList.toggle('hot', e.from === nid || e.to === nid); });
      stage.classList.add('focusing');
      renderPanel(nid);
      const n = geo.byId[nid];
      if (opts.reveal !== false) cam.reveal({ x: n.x, y: n.y, w: n.w, h: n.h });
      setHash(true);
    }
    function deselect() {
      sel = null; stage.classList.remove('focusing'); panel.hidden = true; stage.classList.remove('with-panel');
      svg.querySelectorAll('.sel,.nb,.hot').forEach(g => g.classList.remove('sel', 'nb', 'hot'));
      setHash(true);
    }
    function relRows(list, dir) {
      if (!list.length) return `<div class="rel-none">${dir === 'up' ? 'Nothing calls this here' : 'Calls nothing here'}</div>`;
      return list.map(({ e, id, inView }) => { const o = N[id] || { label: id, kind: '' }, k = kindOf(o.kind, true);
        return `<button class="rel" data-n="${esc(id)}" title="${inView ? 'Select' : 'Find in another view'}"><i style="background:var(--${KIND[k][0]})"></i><span class="rel-l">${esc(o.label)}</span>
          <span class="rel-e">${e.step != null ? esc(e.step) + ' · ' : ''}${esc(e.label || '')}${inView ? '' : ' ↗'}</span>${e.when ? `<span class="rel-w">${esc(e.when)}</span>` : ''}</button>`; }).join('');
    }
    function authorLine(n) {
      const one = login => { const A = (D.authors || {})[login] || {};
        return `<a class="author" href="${esc(A.url || 'https://github.com/' + login)}" target="_blank" rel="noopener">${A.avatar ? `<img src="${A.avatar}" alt="">` : `<i>${esc(login.slice(0, 2).toUpperCase())}</i>`}<span>${esc(A.name || login)} <b>@${esc(login)}</b></span></a>`; };
      const by = n.author ? `<div class="authors"><span class="by">by</span>${one(n.author)}${n.origin ? `<span class="origin">${esc(n.origin)}</span>` : ''}</div>` : (n.external ? `<div class="authors"><span class="by">by</span><span class="origin">author unknown${n.origin ? ' · ' + esc(n.origin) : ''}</span></div>` : '');
      const cr = (n.credits || []).length ? `<div class="authors"><span class="by">credits</span>${n.credits.map(one).join('')}</div>` : '';
      return by + cr;
    }
    function renderPanel(nid) {
      const n = N[nid] || geo.byId[nid], k = kindOf(n.kind, true), c = `var(--${KIND[k][0]})`, pub = k === 'm-public';
      const inView = new Set(geo.nodes.map(x => x.id)), seen = new Set();
      const collect = dir => {
        const out = [];
        const add = (e, id, iv) => { const key = dir + id + (e.label || ''); if (seen.has(key)) return; seen.add(key); out.push({ e, id, inView: iv }); };
        geo.edges.forEach(e => { if (dir === 'up' && e.to === nid) add(e, e.from, true); if (dir === 'down' && e.from === nid) add(e, e.to, true); });
        (D.edges || []).forEach(e => { if (dir === 'up' && e.to === nid) add(e, e.from, inView.has(e.from)); if (dir === 'down' && e.from === nid) add(e, e.to, inView.has(e.to)); });
        return out;
      };
      const ups = collect('up'), downs = collect('down');
      const child = childOf(nid), canOpen = child && child !== cur;
      const vIn = viewsWith(nid).filter(v => v.id !== cur);
      const sec = (t, body) => body ? `<section class="ps"><h4>${t}</h4><div class="prose">${md(body)}</div></section>` : '';
      panel.innerHTML = `<div class="ph" style="--c:${c}">
          <div class="ph-top"><span class="kchip" style="color:${c}"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${SIGIL[k]}</svg>${esc(KIND[k][1])}</span>
            <span class="vis ${pub ? 'pub' : k === 'm-ext' ? 'ext' : 'priv'}">${pub ? 'PUBLIC' : k === 'm-ext' ? 'EXTERNAL' : 'INTERNAL'}</span><button class="ibtn x" data-close title="Close (Esc)" aria-label="Close">×</button></div>
          <h3>${esc(n.label || nid)}</h3><div class="pid">${esc(nid)}</div>
          ${authorLine(n)}
          ${(n.verbs || []).length ? `<div class="pverbs">${n.verbs.map(v => { const vid = N[nid + ':' + v] ? nid + ':' + v : null; return `<${vid ? `button data-n="${esc(vid)}"` : 'span'} class="pverb" style="--c:${c}">${esc(v)}</${vid ? 'button' : 'span'}>`; }).join('')}</div>` : ''}
          ${canOpen ? `<button class="open-btn" data-open="${esc(child)}" style="--c:${c}">⤢ Open “${esc(V[child].title || child)}” <span>${(V[child].nodeIds || []).length} nodes · Enter</span></button>` : ''}
        </div>
        <div class="pb">
          ${sec('What it does', n.what)}${sec('When it triggers', n.when)}${sec('How it works', n.how)}
          ${!n.what && !n.when && !n.how ? '<div class="rel-none">No description yet — enrich <code>what</code>, <code>when</code>, <code>how</code> in the map model.</div>' : ''}
          ${srcList(n).length ? `<section class="ps"><h4>Source</h4>${srcList(n).map(s => `<div class="src"><a href="${esc(srcHref(s))}" title="Open ${esc(base + s)}">${esc(s)}</a><button class="ibtn sm" data-copy="${esc(base + s)}" title="Copy path">⧉</button></div>`).join('')}</section>` : ''}
          <section class="ps"><h4>Upstream <span>${ups.length}</span></h4>${relRows(ups, 'up')}</section>
          <section class="ps"><h4>Downstream <span>${downs.length}</span></h4>${relRows(downs, 'down')}</section>
          ${vIn.length ? `<section class="ps"><h4>Also appears in</h4><div class="pviews">${vIn.map(v => `<button class="pview" data-v="${esc(v.id)}" data-sel="${esc(nid)}">${esc(v.title || v.id)}</button>`).join('')}</div></section>` : ''}
        </div>`;
      panel.hidden = false; stage.classList.add('with-panel');
    }

    /* navigation */
    function setHash(replace) {
      const p = new URLSearchParams(); p.set('view', cur); if (sel) p.set('node', sel);
      ['theme', 'check', 'shot'].forEach(k => Q.get(k) && p.set(k, Q.get(k)));
      const h = '#' + p.toString();
      if (location.hash === h) return;
      if (replace) history.replaceState(null, '', h); else history.pushState(null, '', h);
    }
    async function go(vid, how = {}) {
      if (!V[vid] || busy) return;
      if (vid === cur) { if (how.select) select(how.select); return; }
      busy = true;
      const prev = cur, via = how.via;
      let mode = 'jump';
      if (prev && chain(vid).includes(prev) || how.via) mode = 'in';
      else if (prev && chain(prev).includes(vid)) mode = 'out';
      if (stack.includes(vid)) stack = stack.slice(0, stack.indexOf(vid) + 1);
      else if (mode === 'in' && prev) stack = [...stack, vid];
      else stack = chain(vid);
      if (prev && !reduce()) {
        if (mode === 'in' && via && geo.byId[via]) { const n = geo.byId[via]; await cam.animate(cam.zoomTo({ x: n.x, y: n.y, w: n.w, h: n.h }, 1.1), 420); }
        else await cam.animate({ k: cam.s.k * (mode === 'out' ? 0.6 : 1) }, mode === 'out' ? 260 : 1);
        stage.classList.add('fading'); await sleep(130);
      }
      mount(vid);
      const fitS = cam.fitState();
      if (prev && !reduce()) {
        if (mode === 'in') cam.set({ ...fitS, k: fitS.k * 0.55 });
        else if (mode === 'out') { const back = geo.nodes.find(n => childOf(n.id) === prev); cam.set(back ? cam.zoomTo({ x: back.x, y: back.y, w: back.w, h: back.h }, 1.1) : { ...fitS, k: fitS.k * 1.6 }); }
        else cam.set(fitS);
        stage.classList.remove('fading');
        await cam.animate(fitS, mode === 'jump' ? 1 : 460);
      } else { cam.set(fitS); stage.classList.remove('fading'); }
      cam.touched = false;
      if (mode === 'out') { const back = geo.nodes.find(n => childOf(n.id) === prev); if (back) flash(back.id); }
      if (how.select) select(how.select, { reveal: true });
      setHash(how.replace);
      busy = false;
    }
    const open = nid => { const c = childOf(nid); if (c && c !== cur) go(c, { via: nid }); else toast('No inner view for this node'); };
    const up = () => { const p = stack.length > 1 ? stack[stack.length - 2] : V[cur].parent; if (p) go(p); else toast('Already at the top'); };
    function flash(nid) { const g = svg.querySelector(`.node[data-id="${CSS.escape(nid)}"]`); if (!g) return; g.classList.add('flash'); setTimeout(() => g.classList.remove('flash'), 1400); }
    const findNode = nid => { if (geo.byId[nid]) return select(nid); const vs = viewsWith(nid); const v = vs.find(x => chain(x.id).includes(cur)) || vs[0]; if (v) go(v.id, { select: nid }); };

    /* events */
    stage.addEventListener('click', e => {
      const g = e.target.closest('.node');
      if (g) return select(g.dataset.id);
      if (e.target.closest('.vcard .back')) return go(e.target.closest('.back').dataset.v);
      if (!e.target.closest('.ctl, .minimap, .vcard, .legend')) deselect();
    });
    stage.addEventListener('dblclick', e => { const g = e.target.closest('.node'); if (g) { e.preventDefault(); open(g.dataset.id); } });
    stage.addEventListener('keydown', e => { const g = e.target.closest && e.target.closest('.node'); if (!g) return; if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); sel === g.dataset.id ? open(g.dataset.id) : select(g.dataset.id); } });
    stage.addEventListener('pointerover', e => { const g = e.target.closest('.node'); if (!g) return; svg.querySelectorAll('.edge-g').forEach(x => x.classList.toggle('hov', x.dataset.from === g.dataset.id || x.dataset.to === g.dataset.id)); });
    stage.addEventListener('pointerout', e => { if (e.target.closest('.node')) svg.querySelectorAll('.edge-g.hov').forEach(x => x.classList.remove('hov')); });
    $('m-ctl').addEventListener('click', e => { const z = e.target.closest('button')?.dataset.z; if (!z) return;
      if (z === 'in') cam.zoomAt(1.4, null, null, true); else if (z === 'out') cam.zoomAt(1 / 1.4, null, null, true); else if (z === 'fit') cam.fit(); else if (z === 'one') cam.actual(); else if (z === 'up') up(); else if (z === 'flow') setFlow(!stage.classList.contains('flowing')); });
    function setFlow(on) { stage.classList.toggle('flowing', on); $('m-flow').classList.toggle('on', on); try { localStorage.setItem('visual-flow', on ? '1' : '0'); } catch (_) {} }
    { let f = null; try { f = localStorage.getItem('visual-flow'); } catch (_) {} setFlow(f ? f === '1' : !matchMedia('(prefers-reduced-motion: reduce)').matches); }
    document.addEventListener('click', e => {
      const t = e.target;
      if (t.closest('[data-close]')) { if (t.closest('#m-helpbox')) $('m-helpbox').hidden = true; else deselect(); return; }
      const ob = t.closest('[data-open]'); if (ob) return go(ob.dataset.open, { via: sel });
      const pv = t.closest('.pview'); if (pv) return go(pv.dataset.v, { select: pv.dataset.sel });
      const rn = t.closest('#m-panel [data-n]'); if (rn) return findNode(rn.dataset.n);
      const cv = t.closest('#m-crumbs [data-v], #m-tree [data-v]'); if (cv) return go(cv.dataset.v);
      const cp = t.closest('[data-copy]'); if (cp) { navigator.clipboard && navigator.clipboard.writeText(cp.dataset.copy).then(() => toast('Path copied'), () => toast(cp.dataset.copy)); return; }
      if (!t.closest('.menu')) $('m-export-pop').hidden = true;
      if (!t.closest('.finder')) $('m-finds').classList.remove('on');
    });
    $('m-outline').addEventListener('click', () => document.body.classList.toggle('tree-open'));
    if (innerWidth > 1180 && views.length > 1) document.body.classList.add('tree-open');
    $('m-help').addEventListener('click', () => { $('m-helpbox').hidden = !$('m-helpbox').hidden; });
    $('m-theme').addEventListener('click', toggleTheme);
    $('m-export').addEventListener('click', () => { $('m-export-pop').hidden = !$('m-export-pop').hidden; });
    $('m-export-pop').addEventListener('click', e => { const x = e.target.closest('[data-x]')?.dataset.x; if (!x) return; $('m-export-pop').hidden = true; exportView(x); });

    /* finder */
    const idx = nodes.map(n => ({ n, hay: [n.label, n.id, (n.verbs || []).join(' '), n.what, n.kind, n.author, ((D.authors || {})[n.author] || {}).name, n.origin].join(' ').toLowerCase() }));
    let hits = [], hi = 0;
    const finder = $('m-find'), finds = $('m-finds');
    const drawFinds = () => { finds.innerHTML = hits.length ? hits.map((x, i) => { const k = kindOf(x.n.kind, true), vs = viewsWith(x.n.id);
        return `<button class="fh${i === hi ? ' on' : ''}" data-i="${i}" role="option"><i style="background:var(--${KIND[k][0]})"></i><span class="fh-l">${esc(x.n.label)}</span><span class="fh-v">${esc(vs.map(v => v.title || v.id).slice(0, 2).join(' · '))}</span></button>`; }).join('') : '<div class="fh-none">No match</div>';
      finds.classList.add('on'); };
    finder.addEventListener('input', () => { const q = finder.value.trim().toLowerCase(); if (!q) { finds.classList.remove('on'); return; }
      hits = idx.filter(x => q.split(/\s+/).every(w => x.hay.includes(w))).sort((a, b) => (a.n.label.toLowerCase().startsWith(q) ? 0 : 1) - (b.n.label.toLowerCase().startsWith(q) ? 0 : 1)).slice(0, 9); hi = 0; drawFinds(); });
    finder.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { hi = Math.min(hits.length - 1, hi + 1); drawFinds(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { hi = Math.max(0, hi - 1); drawFinds(); e.preventDefault(); }
      else if (e.key === 'Enter' && hits[hi]) { pick(hits[hi].n.id); }
      else if (e.key === 'Escape') { finder.value = ''; finds.classList.remove('on'); finder.blur(); }
      e.stopPropagation();
    });
    finds.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) pick(hits[+b.dataset.i].n.id); });
    const pick = nid => { finds.classList.remove('on'); finder.value = ''; finder.blur(); findNode(nid); };

    /* keyboard */
    document.addEventListener('keydown', e => {
      if ((e.target.matches && e.target.matches('input, textarea')) || e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key;
      if (k === '+' || k === '=') cam.zoomAt(1.4, null, null, true);
      else if (k === '-' || k === '_') cam.zoomAt(1 / 1.4, null, null, true);
      else if (k === '0') cam.fit();
      else if (k === '1') cam.actual();
      else if (k === 'Escape' || k === 'Backspace') { if (!$('m-helpbox').hidden) $('m-helpbox').hidden = true; else if (sel) deselect(); else up(); }
      else if (k === 'Enter' && sel) open(sel);
      else if (k === '/') { finder.focus(); }
      else if (k === '?') $('m-helpbox').hidden = !$('m-helpbox').hidden;
      else if (k === 'o' || k === 'O') document.body.classList.toggle('tree-open');
      else if (k === 'f' || k === 'F') setFlow(!stage.classList.contains('flowing'));
      else if (k.startsWith('Arrow')) { const d = 80, m = { ArrowLeft: [d, 0], ArrowRight: [-d, 0], ArrowUp: [0, d], ArrowDown: [0, -d] }[k]; cam.pan(m[0], m[1], true); }
      else return;
      e.preventDefault();
    });
    addEventListener('popstate', () => { const p = new URLSearchParams(location.hash.slice(1)); const v = p.get('view') || rootId; if (v !== cur) go(v, { replace: true, select: p.get('node') || undefined }); else if (p.get('node')) select(p.get('node')); else if (sel) deselect(); });
    let rz; addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { if (!cam.touched) cam.fit(false); else cam.apply(); }); });

    /* export: resolve CSS variables into attributes so the file stands alone */
    function standalone(scale) {
      const clone = svg.cloneNode(true), b = geo.bounds;
      const src = svg.querySelectorAll('*'), dst = clone.querySelectorAll('*');
      const props = ['fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'opacity', 'fill-opacity', 'stroke-opacity', 'font-family', 'font-size', 'font-weight', 'letter-spacing', 'visibility'];
      src.forEach((el, i) => { const cs = getComputedStyle(el); props.forEach(p => { const v = cs.getPropertyValue(p); if (v) dst[i].style.setProperty(p, v); }); });
      clone.querySelectorAll('title').forEach(t => t.remove());
      clone.setAttribute('viewBox', `${b.x} ${b.y} ${b.w} ${b.h}`); clone.setAttribute('width', b.w * scale); clone.setAttribute('height', b.h * scale);
      const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      Object.entries({ x: b.x, y: b.y, width: b.w, height: b.h, fill: getComputedStyle(document.body).backgroundColor }).forEach(([k2, v]) => bg.setAttribute(k2, v));
      clone.insertBefore(bg, clone.firstChild.nextSibling);
      return new XMLSerializer().serializeToString(clone);
    }
    function download(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
    function exportView(x) {
      const base = (D.slug || D.title || 'map').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + cur.replace(/[^a-z0-9]+/gi, '-');
      if (x === 'svg') download(base + '.svg', new Blob([standalone(1)], { type: 'image/svg+xml' }));
      else if (x === 'png') {
        const img = new Image(), s = standalone(2), b = geo.bounds;
        img.onload = () => { const c = document.createElement('canvas'); c.width = b.w * 2; c.height = b.h * 2; c.getContext('2d').drawImage(img, 0, 0); c.toBlob(bl => download(base + '.png', bl)); };
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
      } else if (x === 'link') { navigator.clipboard && navigator.clipboard.writeText(location.href).then(() => toast('Link copied'), () => toast(location.href)); }
      else if (x === 'json') { const { meta, kind, ...model } = D; download(base.split('-' + cur)[0] + '.json', new Blob([JSON.stringify(model, null, 2)], { type: 'application/json' })); }
      if (x !== 'link') toast('Exported ' + x.toUpperCase());
    }

    /* boot */
    const p0 = new URLSearchParams(location.hash.slice(1));
    const v0 = V[p0.get('view')] ? p0.get('view') : rootId;
    stack = chain(v0); mount(v0); cam.fit(false); cam.touched = false;
    const n0 = p0.get('node') || (Q.get('shot') && v0 !== rootId ? subjectOf(V[v0]) || (V[v0].nodeIds || [])[0] : null);
    if (n0 && geo.byId[n0]) select(n0, { reveal: false });
    setHash(true);
    if (!Q.get('shot') && !Q.get('check')) { try { if (!localStorage.getItem('visual-map-seen')) { toast('Scroll to zoom · drag to pan · double-click a stacked node to open it · ? for keys', 5200); localStorage.setItem('visual-map-seen', '1'); } } catch (_) {} }

    window.__mapAudit = () => {
      const out = [], host = document.createElement('div');
      host.style.cssText = 'position:absolute;left:-99999px;top:0;width:2000px;height:2000px;visibility:hidden';
      document.body.appendChild(host);
      const routes = {}, layouts = {};
      if (Q.get('optimize')) views.forEach(v => { if (!v.layout) { const r = optimize(v.id); layouts[v.id] = r.pos; layoutCache[v.id] = r.pos; } });
      views.forEach(v => { const { g, markup } = buildView(v.id); host.innerHTML = markup; out.push(...auditSvg(host.firstChild, g, 'view ' + v.id)); Object.entries(g.stats || {}).forEach(([k, n]) => { routes[k] = (routes[k] || 0) + n; });
        g.edges.filter(e => e.how === 'fallback').forEach(e => (routes.fallbackEdges ||= []).push(`${v.id}: ${e.from}(${e.fs})→${e.to}(${e.ts})`)); });
      host.remove();
      const deep = views.filter(v => v.parent).sort((a, b) => chain(b.id).length - chain(a.id).length || (b.nodeIds || []).length - (a.nodeIds || []).length)[0];
      return { overlaps: out, routes, layouts, checked: views.length + ' views', childView: deep ? deep.id : null };
    };
  }

  try { (D.kind === 'map' ? renderMap : renderDoc)(); } catch (err) { errors.push('render: ' + err.message); console.error(err); }

  /* ---------- self-check hook for `visual.py check` ---------- */
  if (Q.get('check')) {
    const report = () => {
      let res = { overlaps: [], checked: 0 };
      try {
        if (window.__mapAudit) res = window.__mapAudit();
        else { (window.__geos || []).forEach(([fig, geo, name]) => res.overlaps.push(...auditSvg(fig.querySelector('svg'), geo, 'diagram ' + name))); res.checked = (window.__geos || []).length + ' diagrams'; }
      } catch (err) { errors.push('check: ' + err.message); }
      res.errors = errors;
      const pre = document.createElement('pre'); pre.id = 'visual-check'; pre.hidden = true; pre.textContent = JSON.stringify(res); document.body.appendChild(pre);
    };
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(report, report);
  }
})();
</script>
</body>
</html>
