<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="super-board kanban logo">
  <title>super-board</title>
  <rect x="4" y="4" width="88" height="88" rx="20" fill="#0d1117"/>
  <!-- three columns -->
  <rect x="14" y="16" width="20" height="64" rx="5" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="38" y="16" width="20" height="64" rx="5" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="62" y="16" width="20" height="64" rx="5" fill="#ffffff" fill-opacity="0.08"/>
  <!-- cards: Ready -->
  <rect x="17" y="20" width="14" height="10" rx="2.5" fill="#d97757"/>
  <rect x="17" y="33" width="14" height="10" rx="2.5" fill="#d97757" fill-opacity="0.55"/>
  <rect x="17" y="46" width="14" height="10" rx="2.5" fill="#d97757" fill-opacity="0.3"/>
  <!-- cards: in flight -->
  <rect x="41" y="20" width="14" height="10" rx="2.5" fill="#58a6ff"/>
  <rect x="41" y="33" width="14" height="10" rx="2.5" fill="#58a6ff" fill-opacity="0.55"/>
  <!-- cards: Done, with a check -->
  <rect x="65" y="20" width="14" height="10" rx="2.5" fill="#3fb950"/>
  <rect x="65" y="33" width="14" height="10" rx="2.5" fill="#3fb950"/>
  <rect x="65" y="46" width="14" height="10" rx="2.5" fill="#3fb950"/>
  <path d="M66 70.5 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
